name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ansible-checks:
    # Lint, the small unit tests, syntax checks and chart lint. The slow OpenBao
    # tests run in the jobs below; the `ansible` job reports all of them as one check.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: k3s-lab-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install ansible tooling
        run: |
          python3 -m pip install --user -r requirements-ansible-core.txt -r requirements-ci.txt -r requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Assert the installed ansible-core is the pin
        run: python3 scripts/assert-ansible-core-pin.py
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          # Matches the Helm release the dmf-init image installs. Dependabot does
          # not track this input; bump it by hand.
          version: v4.3.2
      - name: Install collections
        # Galaxy sometimes sends a malformed response. Retry, and clear the
        # response cache after the first failure.
        run: |
          for attempt in 1 2 3; do
            clear=""
            if [ "$attempt" -gt 1 ]; then clear="--clear-response-cache"; fi
            if ansible-galaxy collection install $clear -r ee/requirements.yml; then
              exit 0
            fi
            echo "Collection install failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: Every test file is collected by the runner CI uses
        # A test file nobody runs gives false confidence. Each test file must match
        # exactly one rule below. The rule names the runner and, for files a job
        # lists one by one, the command that lists it; a name in a comment or step
        # name does not count. Each Python file must also give its runner at least
        # one case, so an empty or unimportable file fails, and so does a pytest-style
        # file under a unittest rule. Pytest-style files belong in awx-autoscale. This
        # guards against forgetting to wire a file in, not against a job that is
        # skipped or a command that only echoes a name.
        run: |
          python3 - <<'PY'
          import ast, fnmatch, importlib.util, pathlib, re, subprocess, sys, unittest
          # (directory, name pattern, excluded pattern, runner, command that lists the file)
          RULES = [
              # The ansible-unit shards take every file by glob.
              ("tests", "test_openbao_*.py", None, "unittest", None),
              ("tests", "test_*.py", "test_openbao_*.py", "unittest", "-p '{b}'"),
              # Run as a script, so it must call unittest.main() itself.
              ("tests", "test-*.py", None, "script", "tests/{b}"),
              # The "Every OpenBao test playbook is in the list, once" step checks these.
              ("tests", "test-openbao-*.yml", None, "none", None),
              ("tests", "test-*.yml", "test-openbao-*.yml", "none", "tests/{b}"),
              ("roles/stack/operator/awx-integration/tests", "test_*.py", None, "unittest", None),
              ("roles/stack/operator/awx-autoscale/tests", "test_*.py", None, "pytest", None),
              ("roles/base/prometheus/tests", "test_*.promtool.yml", None, "none", None),
          ]
          FIXTURES = ["tests/fixtures"]
          root = pathlib.Path.cwd()
          wf = pathlib.Path("../.github/workflows/ci.yml").read_text().splitlines()
          active = "\n".join(re.sub(r"\s#.*$", "", l) for l in wf
                             if not re.match(r"\s*(#|-?\s*name:)", l))
          names = ["test_*.py", "test-*.py", "test-*.yml", "test_*.promtool.yml"]
          files = sorted({p for n in names for p in root.rglob(n)
                          if (p.suffix == ".py" or "tests" in p.relative_to(root).parts)
                          and not any(str(p.relative_to(root)).startswith(f + "/") for f in FIXTURES)})
          problems, unit, pyt = [], [], set()
          for p in files:
              rel = p.relative_to(root)
              hits = [r for r in RULES if str(rel.parent) == r[0] and fnmatch.fnmatch(p.name, r[1])
                      and not (r[2] and fnmatch.fnmatch(p.name, r[2]))]
              if len(hits) != 1:
                  problems.append(f"{rel}: {'no rule collects it' if not hits else 'matches several rules'}")
                  continue
              runner, cmd = hits[0][3], hits[0][4]
              if cmd and not re.search(r"(^|[\s'\"])" + re.escape(cmd.format(b=p.name)) + r"([\s'\";\\]|$)", active, re.M):
                  problems.append(f"{rel}: no job command lists it")
              if runner == "script" and not any(
                      isinstance(n, ast.If) and "__name__" in ast.unparse(n.test) and "__main__" in ast.unparse(n.test)
                      and any("unittest.main(" in ast.unparse(c) for c in n.body)
                      for n in ast.parse(p.read_text()).body):
                  problems.append(f"{rel}: run as a script, but no unittest.main() under __main__")
              if p.suffix == ".py" and runner in ("unittest", "script"):
                  unit.append(p)
              elif runner == "pytest":
                  pyt.add(rel.parent)
          def count(s, mod):
              return sum(count(t, mod) if isinstance(t, unittest.TestSuite) else type(t).__module__ == mod for t in s)
          total = 0
          for p in unit:
              rel = p.relative_to(root)
              mod = "t_" + re.sub(r"\W", "_", str(rel))
              sys.path.insert(0, str(p.parent))
              try:
                  spec = importlib.util.spec_from_file_location(mod, p)
                  m = importlib.util.module_from_spec(spec)
                  sys.modules[mod] = m
                  spec.loader.exec_module(m)
                  n = count(unittest.defaultTestLoader.loadTestsFromModule(m), mod)
              except BaseException as e:
                  problems.append(f"{rel}: import failed: {e!r}")
                  continue
              finally:
                  sys.path.pop(0)
              total += n
              if not n:
                  problems.append(f"{rel}: no unittest case")
          print("unittest files:", len(unit), "cases:", total)
          for d in sorted(pyt):
              cwd = root / d.parent
              r = subprocess.run([sys.executable, "-m", "pytest", "--collect-only", "-q", d.name],
                                 cwd=cwd, capture_output=True, text=True)
              got = {}
              for l in r.stdout.splitlines():
                  if "::" in l:
                      f = (cwd / l.split("::")[0]).resolve()
                      got[f] = got.get(f, 0) + 1
              if r.returncode:
                  problems.append(f"{d}: pytest collection failed:\n{r.stdout[-800:]}{r.stderr[-400:]}")
              print("pytest", d, "cases:", sum(got.values()))
              problems += [f"{f.relative_to(root)}: no pytest case" for f in files
                           if f.parent == root / d and f.suffix == ".py" and not got.get(f.resolve())]
          print("test files checked:", len(files))
          if not files:
              problems.append("No test files found")
          if problems:
              sys.exit("Test files with no runner or no case:\n" + "\n".join(problems))
          PY
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint playbooks/ -p
      - name: CI collections match the execution environment's pinned list
        run: python3 -m unittest discover -s tests -p 'test_ci_collections_match_ee.py' -v
      - name: the execution environment's ansible-core pin is one valid line and renders into the build
        run: python3 -m unittest discover -s tests -p 'test_ee_ansible_core_pin.py' -v
      - name: the ansible-core assertion fails for a core that is not the pin
        run: python3 -m unittest discover -s tests -p 'test_assert_ansible_core_pin.py' -v
      - name: no secrets in AWX job-template extra_vars (dmfdeploy/dmfdeploy#310)
        run: python3 -m unittest discover -s roles/stack/operator/awx-integration/tests -v
      - name: Forgejo Authentik contributor policy regression tests (dmfdeploy/dmfdeploy#15)
        run: python3 tests/test-forgejo-contributor-policy.py
      - name: the AWX EE tag is set once and plays 050, 630 and 693 resolve it
        run: python3 -m unittest discover -s tests -p 'test_awx_ee_image_tag.py' -v
      - name: Forgejo admin identity audit fixture tests (dmfdeploy/dmfdeploy#15)
        run: python3 -m unittest discover -s tests -p 'test_audit_forgejo_identities.py' -v
      - name: setup request catalogue digests, pinned policies and ConfigMap render
        run: python3 -m unittest discover -s tests -p 'test_openbao_catalogue.py' -v
      - name: CoreDNS custom zone forwards unlisted names
        run: python3 -m unittest discover -s tests -p 'test_coredns_custom_zone.py' -v
      - name: local-CA zone and born-inventory use the node's internal address on a NAT node
        run: python3 -m unittest discover -s tests -p 'test_local_ca_node_address.py' -v
      - name: imported local CA, approval page certificate and LAN-mode mDNS
        run: python3 -m unittest discover -s tests -p 'test_local_ca_import_and_lan_mdns.py' -v
      - name: tasks that carry a secret set no_log
        run: python3 -m unittest discover -s tests -p 'test_no_log_secrets.py' -v
      - name: job and script templates that handle a secret never turn on trace mode
        run: python3 -m unittest discover -s tests -p 'test_secret_jobs_no_trace_mode.py' -v
      - name: tasks that once passed a secret as an argument keep it off the command line
        run: python3 -m unittest discover -s tests -p 'test_secrets_not_in_argv_render.py' -v
      - name: shell programs take their values on stdin
        run: python3 -m unittest discover -s tests -p 'test_shell_values_as_arguments.py' -v
      - name: downloads are verified before they run
        run: python3 -m unittest discover -s tests -p 'test_downloads_verified.py' -v
      - name: shell values reach their program unchanged
        run: |
          PATH="$PWD/tests/fixtures/fake-kubectl:$PATH" \
          ANSIBLE_COLLECTIONS_PATH="$PWD/tests/fixtures/fake-collections:$HOME/.ansible/collections" \
          ansible-playbook tests/test-shell-values-literal.yml
      - name: vendored NetBox chart matches its provenance record
        run: python3 -m unittest discover -s tests -p 'test_netbox_chart_provenance.py' -v
      - name: console values pass the certificate authority facts through
        run: python3 -m unittest discover -s tests -p 'test_cms_values_trust_info.py' -v
      - name: every alert links to a section of the dmf-runbooks alerts page
        run: python3 -m unittest discover -s tests -p 'test_alert_runbook_anchors.py' -v
      - name: each AWX consumer in the configure playbooks follows a wake
        run: python3 -m unittest discover -s tests -p 'test_awx_wake_before_consumers.py' -v
      - name: the install lists the capabilities dmf-init requires
        run: python3 -m unittest discover -s tests -p 'test_install_capabilities.py' -v
      - name: the harden role never schedules a reboot
        run: python3 -m unittest discover -s tests -p 'test_harden_no_scheduled_reboot.py' -v
      - name: lifecycle-operate.yml imports no deploy play
        run: python3 -m unittest discover -s tests -p 'test_lifecycle_operate_read_only.py' -v
      - name: no call or default turns certificate verification off
        run: python3 -m unittest discover -s tests -p 'test_certificate_verification_stays_on.py' -v
      - name: registry and console names agree, and 321 refuses a missing local CA
        run: python3 -m unittest discover -s tests -p 'test_service_hosts_and_local_ca.py' -v
      - name: no task loops over a no_log result without no_log
        run: python3 -m unittest discover -s tests -p 'test_no_log_result_not_looped.py' -v
      - name: tracked third-party images are pinned by digest, never :latest (not charts/, ee/)
        run: python3 -m unittest discover -s tests -p 'test_image_references_pinned.py' -v
      - name: the node scrape jobs scrape the kubelet directly and verify it
        run: python3 -m unittest discover -s tests -p 'test_prometheus_scrape_configs.py' -v
      - name: ansible syntax-check
        run: |
          shopt -s nullglob
          playbooks=(playbooks/*.yml)
          [ ${#playbooks[@]} -gt 0 ] || { echo "No playbooks found"; exit 1; }
          for pb in "${playbooks[@]}"; do
            echo "=== syntax-check: $pb ==="
            ansible-playbook "$pb" --syntax-check
          done
      - name: harden fail2ban ignoreip validation (dmfdeploy/dmfdeploy#142)
        run: ansible-playbook tests/test-harden-fail2ban-ignoreip.yml
      - name: whole-index mirror keeps the index digest (dmfdeploy/dmfdeploy#808)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          ansible-playbook tests/test-zot-seed-index-mirror.yml
      - name: administrator facts, Authentik credential parse and NAT bind address
        run: |
          set -eu
          for pb in tests/test-app-admin-facts-live-read.yml \
                    tests/test-authentik-oauth-credentials-parse.yml \
                    tests/test-k3s-nat-bind-ip.yml; do
            echo "=== $pb ==="
            ansible-playbook "$pb"
          done
      - name: AWX autoscale helper tests
        working-directory: k3s-lab-bootstrap/roles/stack/operator/awx-autoscale
        run: python3 -m pytest tests -q
      - name: Install promtool (pinned release, sha256 checked)
        env:
          PROM_VERSION: "3.16.0"
          PROM_SHA256: "68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34"
        run: |
          set -eu
          curl -fsSLo /tmp/prom.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          echo "${PROM_SHA256}  /tmp/prom.tgz" | sha256sum -c -
          tar -xzf /tmp/prom.tgz -C /tmp --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          echo "/tmp" >> "$GITHUB_PATH"
      - name: Prometheus alert rule tests
        working-directory: k3s-lab-bootstrap/roles/base/prometheus
        run: |
          set -eu
          ansible localhost -m ansible.builtin.template \
            -a "src=templates/rules/alerts.yaml.j2 dest=tests/rendered_alerts.yml" \
            -e @defaults/main.yml
          promtool check rules tests/rendered_alerts.yml
          shopt -s nullglob
          files=(tests/test_*.promtool.yml)
          [ ${#files[@]} -gt 0 ] || { echo "No promtool tests found"; exit 1; }
          for f in "${files[@]}"; do
            promtool test rules "$f"
          done
      - name: the platform-services dashboard shows the AWX probe lane as asleep, by running its query in promtool (dmfdeploy/dmfdeploy#1027)
        run: python3 -m unittest discover -s tests -p 'test_awx_probe_lane_dashboard_1027.py' -v
      - name: helm-lint charts/
        run: |
          set -eu
          shopt -s nullglob
          charts=(charts/*/)
          if [ ${#charts[@]} -eq 0 ]; then
            echo "No charts found"
            exit 1
          fi
          for chart_dir in "${charts[@]}"; do
            echo "=== helm-lint: $chart_dir ==="
            helm lint "$chart_dir"
          done

  ansible-openbao:
    # Each line of PLAYBOOKS is "<shard> <fakes|plain> <playbook> [<slice>/<slices>]".
    # Shard N runs its lines in order; "fakes" puts the fake kubectl and the fake
    # collections in front. A playbook is in one place, so it runs in exactly one shard,
    # unless it takes a slice: then it has one line for each of its slices, and the playbook
    # runs the cases at that slice's positions (-e case_shard and -e case_shards). The
    # identity-verifier playbook is the longest: its 62 cases take about 40 minutes of
    # runner time, 20 seconds each, so it is in four slices of about 10 minutes. Two
    # slices took 18 to 25 minutes each, too close to the 30-minute job limit. The other
    # playbooks take less than 10 minutes in a shard, setup included. Two limits make a
    # stuck test fail by name. The verifier gives each task a limit (case_task_timeout,
    # 120 seconds), and its failure names the case; that bounds each task, not a stuck
    # step outside the verifier. The test step also has a deadline: the job's start, plus
    # the 30-minute job limit, less 90 seconds to report. Each playbook gets the time that
    # is left, so setup that runs long leaves less. When the time is used, the step fails
    # and names the playbook or says that setup used it. A playbook that itself exits with
    # 124 is reported as out of time too. Setup steps have their own limits, which total 11
    # minutes (1 + 1 + 3 + 5 + 1; runs take under 2 minutes). The 90 seconds to report also
    # hold the 20 seconds that a playbook gets to leave after the stop signal before it is
    # killed (exit 137). So the test step has at least 17 minutes; its longest shards take
    # about 15.
    name: ansible-openbao (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      PLAYBOOKS: |
        1 fakes tests/test-openbao-k8s-auth.yml
        2 fakes tests/test-openbao-grow-ha.yml
        2 fakes tests/test-openbao-raft-snapshot.yml
        2 fakes tests/test-openbao-unseal.yml
        2 fakes tests/test-openbao-data-read.yml
        2 fakes tests/test-openbao-capabilities.yml
        2 fakes tests/test-openbao-restart-guard.yml
        3 plain tests/test-openbao-ha-render.yml
        3 plain tests/test-openbao-ha-guard.yml
        3 fakes tests/test-openbao-ha-guard-collect.yml
        3 fakes tests/test-openbao-guard-poll.yml
        3 fakes tests/test-openbao-cert-issuance.yml
        3 fakes tests/test-openbao-ca-bundle.yml
        3 fakes tests/test-openbao-init-status.yml
        3 fakes tests/test-openbao-tls-secret-wait.yml
        3 fakes tests/test-openbao-cli.yml
        3 fakes tests/test-openbao-cli-callers.yml
        3 fakes tests/test-born-inventory-breakglass-login.yml
        1 fakes tests/test-openbao-identity-verifier.yml 3/4
        3 fakes tests/test-openbao-identity-verifier.yml 4/4
        4 fakes tests/test-openbao-identity-verifier.yml 1/4
        5 fakes tests/test-openbao-identity-verifier.yml 2/4
    defaults:
      run:
        working-directory: k3s-lab-bootstrap
    steps:
      - name: Record the start of the job
        timeout-minutes: 1
        working-directory: .
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        timeout-minutes: 1
        with:
          python-version: "3.14"
      - name: Install ansible tooling
        timeout-minutes: 3
        run: |
          python3 -m pip install --user -r requirements-ansible-core.txt -r requirements-ci.txt -r requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Assert the installed ansible-core is the pin
        timeout-minutes: 1
        run: python3 scripts/assert-ansible-core-pin.py
      - name: Install collections
        timeout-minutes: 5
        # Galaxy sometimes sends a malformed response. Retry, and clear the
        # response cache after the first failure.
        run: |
          for attempt in 1 2 3; do
            clear=""
            if [ "$attempt" -gt 1 ]; then clear="--clear-response-cache"; fi
            if ansible-galaxy collection install $clear -r ee/requirements.yml; then
              exit 0
            fi
            echo "Collection install failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: Every OpenBao test playbook is in the list, once
        timeout-minutes: 1
        env:
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -eu
          listed=$(echo "$PLAYBOOKS" | awk 'NF {print $3}' | sort -u)
          # A playbook has one line without a slice, or one line for each slice 1/n to n/n.
          bad=$(echo "$PLAYBOOKS" | awk 'NF {
              if ($4 == "") { whole[$3]++; next }
              split($4, f, "/")
              if (f[2] < 2 || f[1] < 1 || f[1] > f[2]) { print $3 " has the slice " $4; next }
              if (total[$3] && total[$3] != f[2]) { print $3 " mixes slice counts"; next }
              total[$3] = f[2]; seen[$3, f[1]]++; lines[$3]++
            }
            END {
              for (p in whole) if (whole[p] > 1 || p in total) print p " is listed twice"
              for (p in total) {
                if (lines[p] != total[p]) print p " lacks a slice of " total[p]
                for (i = 1; i <= total[p]; i++) if (seen[p, i] != 1) print p " slice " i "/" total[p] " is not listed once"
              }
            }' | sort -u)
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
          # Every row needs a shard that exists in the matrix and a known mode.
          bad=$(echo "$PLAYBOOKS" | awk -v n="$SHARDS" 'NF {
              if ($1 !~ /^[0-9]+$/ || $1 < 1 || $1 > n) print $3 " is in shard " $1 ", not 1 to " n
              if ($2 != "fakes" && $2 != "plain") print $3 " has the mode " $2
            }')
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
          present=$(printf '%s\n' tests/test-openbao-*.yml | sort)
          missing=$(comm -23 <(echo "$present") <(echo "$listed"))
          [ -z "$missing" ] || { echo "Not in a shard: $missing"; exit 1; }
          unknown=$(comm -13 <(printf '%s\n' tests/test-*.yml | sort) <(echo "$listed"))
          [ -z "$unknown" ] || { echo "Listed but missing: $unknown"; exit 1; }
      - name: OpenBao Raft render, guard, unseal and migration tests
        run: |
          set -eu
          echo "$PLAYBOOKS" | awk -v shard="$SHARD" 'NF && $1 == shard' | grep -q . ||
            { echo "Shard $SHARD has no playbooks"; exit 1; }
          # The job limit is 30 minutes; keep 90 seconds to report before it.
          deadline=$(( JOB_START + 30 * 60 - 90 ))
          echo "$PLAYBOOKS" | awk -v shard="$SHARD" 'NF && $1 == shard {print $2, $3, $4}' |
          while read -r mode playbook slice; do
            echo "=== $playbook ($mode) ${slice:-} ==="
            args=()
            if [ -n "${slice:-}" ]; then
              args=(-e "case_shard=${slice%/*}" -e "case_shards=${slice#*/}")
            fi
            env_prefix=()
            if [ "$mode" = fakes ]; then
              env_prefix=(env "PATH=$PWD/tests/fixtures/fake-kubectl:$PATH"
                "ANSIBLE_COLLECTIONS_PATH=$PWD/tests/fixtures/fake-collections:$HOME/.ansible/collections")
            fi
            left=$(( deadline - $(date +%s) ))
            if [ "$left" -le 0 ]; then
              echo "::error::$playbook did not start: setup and the earlier playbooks used the time before the job limit"
              exit 1
            fi
            "${env_prefix[@]}" timeout --kill-after=20s "$left" ansible-playbook "$playbook" "${args[@]}" </dev/null || {
              rc=$?
              if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then echo "::error::$playbook was still running when the time before the job limit ended"; fi
              exit "$rc"
            }
          done
        env:
          SHARD: ${{ matrix.shard }}

  ansible-unit:
    # The OpenBao unit tests, split by file. Each file has a weight, in seconds of
    # test time, and a file without one counts for 2. The slowest files are placed
    # first, each in the lightest shard, so a new test file lands in a shard without a
    # change here. Three files run the install playbook for real and take 6, 5 and
    # 1.5 minutes on a CI runner. Keep their weights in step when those times change.
    # The shards take about 6, 5 and 4 minutes of test time.
    name: ansible-unit (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: k3s-lab-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Install ansible tooling
        run: |
          python3 -m pip install --user -r requirements-ansible-core.txt -r requirements-ci.txt -r requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Assert the installed ansible-core is the pin
        run: python3 scripts/assert-ansible-core-pin.py
      - name: Install collections
        # Galaxy sometimes sends a malformed response. Retry, and clear the
        # response cache after the first failure.
        run: |
          for attempt in 1 2 3; do
            clear=""
            if [ "$attempt" -gt 1 ]; then clear="--clear-response-cache"; fi
            if ansible-galaxy collection install $clear -r ee/requirements.yml; then
              exit 0
            fi
            echo "Collection install failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: OpenBao AppRole lifecycle registry and setup issuer tests (dmfdeploy/dmfdeploy#11, #396)
        run: |
          set -eu
          shopt -s nullglob
          files=(tests/test_openbao_*.py)
          [ ${#files[@]} -gt 0 ] || { echo "No OpenBao unit tests found"; exit 1; }
          modules=$(printf '%s\n' "${files[@]}" | sort | python3 -c '
          import os, sys
          weights = {
              "test_openbao_install_path": 350, "test_openbao_fresh_init_token": 310,
              "test_openbao_revoker": 85, "test_openbao_image_preflight": 55,
              "test_openbao_fake_bao_tokens": 30, "test_openbao_rotation_wiring": 15,
              "test_openbao_a2a_static": 11, "test_openbao_approle_registry_assertions": 8,
              "test_openbao_generate_root": 6,
          }
          shard, total = int(os.environ["SHARD"]), int(os.environ["TOTAL"])
          names = [line.strip()[len("tests/"):-len(".py")] for line in sys.stdin if line.strip()]
          load = [0] * total
          mine = []
          for name in sorted(names, key=lambda n: -weights.get(n, 2)):
              lightest = load.index(min(load))
              load[lightest] += weights.get(name, 2)
              if lightest == shard - 1:
                  mine.append(name)
          print("\n".join(sorted(mine)))
          ')
          echo "$modules"
          [ -n "$modules" ] || { echo "Shard $SHARD has no test files"; exit 1; }
          echo "$modules" | PYTHONPATH=tests xargs python3 -m unittest -v
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}

  ansible:
    # The required check. It passes only when every job it waits for passed.
    needs: [ansible-checks, ansible-openbao, ansible-unit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every ansible job passed
        run: |
          echo "ansible-checks:  $CHECKS"
          echo "ansible-openbao: $OPENBAO"
          echo "ansible-unit:    $UNIT"
          [ "$CHECKS" = success ] && [ "$OPENBAO" = success ] && [ "$UNIT" = success ]
        env:
          CHECKS: ${{ needs.ansible-checks.result }}
          OPENBAO: ${{ needs.ansible-openbao.result }}
          UNIT: ${{ needs.ansible-unit.result }}

  review-comments:
    # Comments state why, not which review prompted them
    # (dmfdeploy/dmfdeploy#768). Allowlist: .review-comment-allow.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: No review history in comments
        run: bin/check-review-comments.sh
      - name: Allowlist parser self-test
        run: bin/check-review-comments.sh --self-test

  working-model:
    # Working-model block sync (umbrella issue dmfdeploy/dmfdeploy#32): the
    # agent-context block in CLAUDE.md/AGENTS.md/QWEN.md must stay byte-identical
    # to the umbrella template; --strict fails on a missing or drifted block.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Umbrella: canonical template + checker
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dmfdeploy/dmfdeploy
          ref: working-model-v2
          path: .umbrella
          persist-credentials: false
      - name: Working-model block sync (strict)
        run: .umbrella/bin/check-working-model-sync.sh --repo . --strict --template .umbrella/docs/templates/working-model-block.md
