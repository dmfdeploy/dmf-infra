name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: k3s-lab-bootstrap
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install ansible tooling
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user ansible ansible-lint yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814  # v4.2.0
      - name: Install collections
        run: |
          ansible-galaxy collection install -r requirements.yml -r ee/requirements.yml
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint playbooks/ -p
      - name: no secrets in AWX job-template extra_vars (dmfdeploy/dmfdeploy#310)
        run: python3 -m unittest discover -s roles/stack/operator/awx-integration/tests -v
      - name: Forgejo Authentik contributor policy regression tests (dmfdeploy/dmfdeploy#15)
        run: python3 tests/test-forgejo-contributor-policy.py
      - name: Forgejo admin identity audit fixture tests (dmfdeploy/dmfdeploy#15)
        run: python3 -m unittest discover -s tests -p 'test_audit_forgejo_identities.py' -v
      - name: OpenBao AppRole lifecycle registry and setup issuer tests (dmfdeploy/dmfdeploy#11, #396)
        run: python3 -m unittest discover -s tests -p 'test_openbao_*.py' -v
      - name: tasks that carry a secret set no_log
        run: python3 -m unittest discover -s tests -p 'test_no_log_secrets.py' -v
      - name: ansible syntax-check
        run: |
          shopt -s nullglob
          for pb in playbooks/*.yml; do
            echo "=== syntax-check: $pb ==="
            ansible-playbook "$pb" --syntax-check
          done
      - name: OpenBao Raft render, guard, unseal and migration tests
        run: |
          ansible-playbook tests/test-openbao-ha-render.yml
          ansible-playbook tests/test-openbao-ha-guard.yml
          export PATH="$PWD/tests/fixtures/fake-kubectl:$PATH"
          export ANSIBLE_COLLECTIONS_PATH="$PWD/tests/fixtures/fake-collections:$HOME/.ansible/collections"
          ansible-playbook tests/test-openbao-ha-guard-collect.yml
          ansible-playbook tests/test-openbao-guard-poll.yml
          ansible-playbook tests/test-openbao-unseal.yml
          ansible-playbook tests/test-openbao-data-read.yml
          ansible-playbook tests/test-openbao-capabilities.yml
          ansible-playbook tests/test-openbao-restart-guard.yml
          ansible-playbook tests/test-openbao-grow-ha.yml
          ansible-playbook tests/test-openbao-k8s-auth.yml
      - name: harden fail2ban ignoreip validation (dmfdeploy/dmfdeploy#142)
        run: ansible-playbook tests/test-harden-fail2ban-ignoreip.yml
      - name: whole-index mirror keeps the index digest (dmfdeploy/dmfdeploy#808)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          ansible-playbook tests/test-zot-seed-index-mirror.yml
      - name: helm-lint charts/
        run: |
          set -eu
          shopt -s nullglob
          charts=(charts/*/)
          if [ ${#charts[@]} -eq 0 ]; then
            echo "SKIP: no charts found"
            exit 0
          fi
          for chart_dir in "${charts[@]}"; do
            echo "=== helm-lint: $chart_dir ==="
            helm lint "$chart_dir"
          done

  review-comments:
    # Comments state why, not which review prompted them
    # (dmfdeploy/dmfdeploy#768). Allowlist: .review-comment-allow.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: No review history in comments
        run: bin/check-review-comments.sh
      - name: Allowlist parser self-test
        run: bin/check-review-comments.sh --self-test

  working-model:
    # Working-model block sync (umbrella issue dmfdeploy/dmfdeploy#32): the
    # agent-context block in CLAUDE.md/AGENTS.md/QWEN.md must stay byte-identical
    # to the umbrella template; --strict fails on a missing or drifted block.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 — umbrella: canonical template + checker
        with:
          repository: dmfdeploy/dmfdeploy
          ref: working-model-v2
          path: .umbrella
          persist-credentials: false
      - name: Working-model block sync (strict)
        run: .umbrella/bin/check-working-model-sync.sh --repo . --strict --template .umbrella/docs/templates/working-model-block.md
