---
# Assertion-only verification of the OpenBao bootstrap identity model
# (ADR-0008 + ADR-0021 + ADR-0024). Confirms that:
#
#   1. ops-admin, policy-reconciler, and approle-reconciler can all log in
#      (positive: the identities exist and the break-glass JSON is complete),
#      and the Kubernetes-auth setup-issuer and rotation scheduler can log in
#      with a TokenRequest JWT for their ServiceAccounts.
#   2. The AC-5 separation matrix from the AppRole-Reconciler Implementation
#      Brief §7.5 holds on the live cluster — ops-admin cannot write policy
#      and cannot mint object-storage AppRole secret-ids; policy-reconciler
#      cannot mint object-storage AppRole secret-ids; approle-reconciler
#      cannot write policy and cannot read app secrets.
#   3. The downstream ESO chain seeded by base/object-storage-credentials is
#      reconciling — both ClusterSecretStores Ready, and ExternalSecrets in
#      the six target namespaces (openbao-system, awx, netbox, authentik,
#      forgejo, zot) report status.conditions[Ready] == True.
#   4. When eso_openbao_auth_method is kubernetes, the main store logs in with
#      Kubernetes auth: a fresh token with the right audience gets a real
#      login, an ExternalSecret that reads through the main store refreshes
#      after a forced sync, a wrong ServiceAccount, namespace or audience is
#      refused, and no standing identity can write auth/kubernetes/config.
#      The token of that login has no capability on the PKI issue path: ESO
#      reads KV secrets only.
#   5. In both modes, the live eso-reader policy has no path stanza on the PKI
#      mount and grants only read and list. In AppRole mode, ESO's AppRole role
#      carries the eso-reader policy and no other, so nothing adds a grant to an
#      ESO token. The AppRole checks read the policy and the role with identities
#      that this playbook already logs in as. The playbook never logs in as ESO
#      with AppRole and never reads or uses ESO's SecretID: a failed AppRole login
#      counts toward the lockout of ESO's role, and a locked role stops every
#      ExternalSecret.
#
# Tokens never appear in argv or logs (ADR-0007). Capability probes pipe the
# token via stdin into the OpenBao pod's shell; the probe output contains
# only capability lists (read/write/deny etc.), no token material.
#
# Run:
#   bin/run-playbook.sh <env> \
#     ../dmf-infra/k3s-lab-bootstrap/playbooks/verify-openbao-identity-model.yml
#
- name: Verify OpenBao bootstrap identity model
  hosts: k3s_control[0]
  become: true
  gather_facts: false
  tags:
    - vertical-security
    - verify-openbao-identity

  vars:
    verify_openbao_namespace: "{{ openbao_namespace | default('openbao') }}"
    verify_openbao_pod_selector: "app.kubernetes.io/name=openbao"
    verify_setup_issuer_service_account: "{{ openbao_setup_issuer_service_account | default('setup-issuer') }}"
    verify_setup_issuer_k8s_role: "{{ openbao_setup_issuer_k8s_role | default('setup-issuer') }}"
    verify_setup_issuer_audience: "{{ openbao_setup_issuer_audience | default('openbao') }}"
    verify_rotation_scheduler_service_account: "{{ openbao_rotation_scheduler_service_account | default('approle-rotation-scheduler') }}"
    verify_rotation_scheduler_k8s_role: "{{ openbao_rotation_scheduler_k8s_role | default('approle-rotation-scheduler') }}"
    verify_rotation_scheduler_audience: "{{ openbao_rotation_scheduler_audience | default('openbao') }}"
    verify_eso_auth_method: "{{ eso_openbao_auth_method | default('approle') }}"
    verify_eso_namespace: "{{ eso_namespace | default('external-secrets') }}"
    verify_eso_service_account: "{{ eso_service_account_name | default('external-secrets') }}"
    verify_eso_k8s_role: "{{ openbao_eso_kubernetes_role_name | default('external-secrets') }}"
    verify_eso_audience: "{{ openbao_eso_kubernetes_audience | default('openbao') }}"
    verify_eso_store_name: "{{ eso_cluster_secret_store_name | default('openbao') }}"
    verify_eso_pki_mount: "{{ openbao_pki_path | default('pki') }}"
    verify_eso_pki_probe_path: "{{ verify_eso_pki_mount }}/issue/internal-ca"
    verify_eso_policy_name: eso-reader
    verify_eso_approle_role: "{{ openbao_eso_role_name | default('external-secrets') }}"
    # An ExternalSecret that reads from the main store, to force a refresh.
    verify_main_store_sync_target:
      namespace: authentik
      name: authentik-runtime
    # Probe matrix per Implementation Brief §7.5. Each entry asserts the
    # identity's capability on the target path matches the expected outcome.
    # `deny` means the only capability returned is `deny` (full deny);
    # `update` means the only capability returned is `update`; `read` means the
    # only capability returned is `read`;
    # `denied_or_missing` accepts either explicit deny or no-capabilities.
    verify_probes:
      - identity: ops-admin
        path: sys/policies/acl/test
        expected: deny
        reason: ops-admin must not write ACL policies (policy-reconciler's job)
      - identity: ops-admin
        path: auth/approle/role/object-storage-app-backups/secret-id
        expected: deny
        reason: ops-admin must not mint object-storage AppRole secret-ids (approle-reconciler's job)
      - identity: policy-reconciler
        path: auth/approle/role/object-storage-app-backups/secret-id
        expected: deny
        reason: policy-reconciler must not mint object-storage AppRole secret-ids
      - identity: approle-reconciler
        path: sys/policies/acl/test
        expected: deny
        reason: approle-reconciler must not write ACL policies (policy-reconciler's job)
      - identity: approle-reconciler
        path: secret/data/apps/forgejo/admin
        expected: deny
        reason: approle-reconciler must not read app secrets (ops-admin's job)
      - identity: ops-admin
        path: auth/kubernetes/config
        expected: deny
        reason: ops-admin must not write the Kubernetes auth config
      - identity: policy-reconciler
        path: auth/kubernetes/config
        expected: deny
        reason: policy-reconciler must not write the Kubernetes auth config
      - identity: approle-reconciler
        path: auth/kubernetes/config
        expected: deny
        reason: approle-reconciler must not write the Kubernetes auth config
      - identity: setup-issuer
        path: auth/approle/role/born-inventory-netbox-reader/secret-id
        expected: update
        reason: the setup issuer mints SecretIDs for born-inventory-netbox-reader, and only create is open
      - identity: setup-issuer
        path: auth/approle/role/born-inventory-netbox-reader/secret-id-accessor/destroy
        expected: update
        reason: the setup issuer destroys the accessor of the SecretID it minted
      - identity: setup-issuer
        path: auth/approle/role/born-inventory-netbox-reader/custom-secret-id
        expected: deny
        reason: the setup issuer must not assign a caller-supplied SecretID
      - identity: setup-issuer
        path: auth/approle/role/born-inventory-netbox-reader/role-id
        expected: deny
        reason: the setup issuer must not read AppRole configuration
      - identity: setup-issuer
        path: auth/approle/role/born-inventory-netbox-reader
        expected: deny
        reason: the setup issuer must not change the AppRole
      - identity: setup-issuer
        path: auth/approle/role/external-secrets/secret-id
        expected: deny
        reason: the setup issuer must not mint credentials for another role
      - identity: setup-issuer
        path: secret/data/apps/netbox/runtime
        expected: deny
        reason: the setup issuer must not read application secrets
      - identity: setup-issuer
        path: sys/policies/acl/test
        expected: deny
        reason: the setup issuer must not write ACL policies
      - identity: setup-issuer
        path: sys/auth
        expected: deny
        reason: the setup issuer must not reach sys/*
      - identity: setup-issuer
        path: sys/mounts
        expected: deny
        reason: the setup issuer must not reach sys/*
      - identity: rotation-scheduler
        path: auth/approle/role/external-secrets
        expected: read
        reason: the scheduler reads a target's role to check its TTL, and cannot change the role
      - identity: rotation-scheduler
        path: auth/approle/role/external-secrets/custom-secret-id
        expected: update
        reason: the scheduler assigns the candidate SecretID of a registry target
      - identity: rotation-scheduler
        path: auth/approle/role/external-secrets/secret-id/lookup
        expected: update
        reason: the scheduler looks up its candidate by value
      - identity: rotation-scheduler
        path: auth/approle/role/external-secrets/secret-id-accessor/destroy
        expected: update
        reason: the scheduler destroys the accessor of a replaced SecretID
      - identity: rotation-scheduler
        path: auth/approle/role/external-secrets/secret-id
        expected: deny
        reason: the scheduler must not use the endpoint that generates a random SecretID
      - identity: rotation-scheduler
        path: auth/approle/role/external-secrets/secret-id-accessor/lookup
        expected: deny
        reason: the scheduler must not look up an accessor
      - identity: rotation-scheduler
        path: auth/approle/role/born-inventory-netbox-reader/secret-id
        expected: deny
        reason: the scheduler must not mint credentials for an AppRole outside the registry
      - identity: rotation-scheduler
        path: auth/approle/role/born-inventory-netbox-reader/custom-secret-id
        expected: deny
        reason: the scheduler must not assign a SecretID to an AppRole outside the registry
      - identity: rotation-scheduler
        path: secret/data/apps/netbox/runtime
        expected: deny
        reason: the scheduler must not read application secrets
      - identity: rotation-scheduler
        path: secret/data/apps/forgejo/admin
        expected: deny
        reason: the scheduler must not read application secrets
      - identity: rotation-scheduler
        path: sys/policies/acl/test
        expected: deny
        reason: the scheduler must not write ACL policies
      - identity: rotation-scheduler
        path: auth/kubernetes/role/test
        expected: deny
        reason: the scheduler must not administer auth methods
      - identity: rotation-scheduler
        path: sys/auth
        expected: deny
        reason: the scheduler must not reach sys/*
      - identity: rotation-scheduler
        path: sys/mounts
        expected: deny
        reason: the scheduler must not reach sys/*
    # ExternalSecrets that base/object-storage-credentials creates per
    # default. Names match the role's object_storage_consumer_namespaces
    # mapping: openbao_snapshots ships only to openbao-system; app_backups
    # ships to the five app namespaces. Total = 6 ExternalSecrets, matching
    # the role's `Create ExternalSecret` task iteration count.
    verify_expected_external_secrets:
      - { namespace: openbao-system, name: s3-creds-openbao-snapshots }
      - { namespace: awx,            name: s3-creds-app-backups }
      - { namespace: netbox,         name: s3-creds-app-backups }
      - { namespace: authentik,      name: s3-creds-app-backups }
      - { namespace: forgejo,        name: s3-creds-app-backups }
      - { namespace: zot,            name: s3-creds-app-backups }

  tasks:
    # ────────────────────────────────────────────────────────────────
    # Step 1 — establish three identity sessions, capture per-identity tokens
    # ────────────────────────────────────────────────────────────────
    - name: Establish ops-admin session
      ansible.builtin.include_role:
        name: common/openbao-session
      vars:
        openbao_session_mode: operator
        openbao_session_namespace: "{{ verify_openbao_namespace }}"

    - name: Capture ops-admin token
      ansible.builtin.set_fact:
        _verify_token_ops_admin: "{{ _openbao_session_client_token }}"
      no_log: true

    - name: Establish policy-reconciler session
      ansible.builtin.include_role:
        name: common/openbao-session
      vars:
        openbao_session_mode: policy-reconciler
        openbao_session_namespace: "{{ verify_openbao_namespace }}"

    - name: Capture policy-reconciler token
      ansible.builtin.set_fact:
        _verify_token_policy_reconciler: "{{ _openbao_session_client_token }}"
      no_log: true

    - name: Establish approle-reconciler session
      ansible.builtin.include_role:
        name: common/openbao-session
      vars:
        openbao_session_mode: approle-reconciler
        openbao_session_namespace: "{{ verify_openbao_namespace }}"

    - name: Capture approle-reconciler token
      ansible.builtin.set_fact:
        _verify_token_approle_reconciler: "{{ _openbao_session_client_token }}"
      no_log: true

    # ────────────────────────────────────────────────────────────────
    # Step 2 — discover OpenBao pod for capability probes
    # ────────────────────────────────────────────────────────────────
    - name: Discover OpenBao pod for capability probes
      kubernetes.core.k8s_info:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: v1
        kind: Pod
        namespace: "{{ verify_openbao_namespace }}"
        label_selectors:
          - "{{ verify_openbao_pod_selector }}"
      register: _verify_openbao_pod_info

    - name: Assert OpenBao pod exists
      ansible.builtin.assert:
        that:
          - _verify_openbao_pod_info.resources | length > 0
        fail_msg: >-
          Could not find an OpenBao pod in namespace
          {{ verify_openbao_namespace }} with selector
          {{ verify_openbao_pod_selector }}.

    - name: Set OpenBao pod fact
      ansible.builtin.set_fact:
        _verify_openbao_pod: "{{ _verify_openbao_pod_info.resources[0].metadata.name }}"

    # ────────────────────────────────────────────────────────────────
    # Step 2b — setup-issuer login (Kubernetes auth). The JWT is a short-lived
    # TokenRequest for the issuer ServiceAccount and travels on stdin.
    # ────────────────────────────────────────────────────────────────
    - name: Request a JWT for the setup issuer ServiceAccount
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/rancher/k3s/k3s.yaml
          - -n
          - "{{ verify_openbao_namespace }}"
          - create
          - token
          - "{{ verify_setup_issuer_service_account }}"
          - --duration
          - 10m
          - --audience
          - "{{ verify_setup_issuer_audience }}"
      register: _verify_issuer_jwt
      changed_when: false
      no_log: true

    - name: Log in as the setup issuer
      ansible.builtin.shell:
        cmd: >-
          kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
          -n {{ verify_openbao_namespace }}
          exec -i {{ _verify_openbao_pod }}
          -- sh -c '
          exec bao write -format=json auth/kubernetes/login
          role={{ verify_setup_issuer_k8s_role | quote }} jwt=-'
        stdin: "{{ _verify_issuer_jwt.stdout | trim }}"
        stdin_add_newline: false
      register: _verify_issuer_login
      changed_when: false
      no_log: true

    - name: Capture setup-issuer token
      ansible.builtin.set_fact:
        _verify_token_setup_issuer: "{{ (_verify_issuer_login.stdout | from_json).auth.client_token }}"
      no_log: true

    # ────────────────────────────────────────────────────────────────
    # Step 2c — rotation scheduler login (Kubernetes auth), the same way.
    # The scheduler's role is written on a fresh install only, so an
    # environment that was upgraded through a role rerun may not have it yet.
    # The login and the scheduler probes then do not run, with a message,
    # unless the rotation switch is on: with the switch on, a missing role is
    # a failure. Only two answers count as "not set up": the ServiceAccount is
    # not found, or OpenBao's Kubernetes auth says the role does not exist
    # ("invalid role name" in the auth plugin's login, "could not be found" in
    # OpenBao's own lookup). Any other failure of the token request or of the
    # login fails verification, whatever the switch says.
    # ────────────────────────────────────────────────────────────────
    - name: Request a JWT for the rotation scheduler ServiceAccount
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/rancher/k3s/k3s.yaml
          - -n
          - "{{ verify_openbao_namespace }}"
          - create
          - token
          - "{{ verify_rotation_scheduler_service_account }}"
          - --duration
          - 10m
          - --audience
          - "{{ verify_rotation_scheduler_audience }}"
      register: _verify_scheduler_jwt
      changed_when: false
      failed_when: false
      no_log: true

    - name: Log in as the rotation scheduler
      ansible.builtin.shell:
        cmd: >-
          kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
          -n {{ verify_openbao_namespace }}
          exec -i {{ _verify_openbao_pod }}
          -- sh -c '
          exec bao write -format=json auth/kubernetes/login
          role={{ verify_rotation_scheduler_k8s_role | quote }} jwt=-'
        stdin: "{{ _verify_scheduler_jwt.stdout | trim }}"
        stdin_add_newline: false
      register: _verify_scheduler_login
      changed_when: false
      failed_when: false
      no_log: true
      when: _verify_scheduler_jwt.rc == 0

    - name: Work out whether the rotation scheduler is set up
      ansible.builtin.set_fact:
        _verify_scheduler_ready: "{{ _verify_scheduler_login.rc | default(1) == 0 }}"
        _verify_scheduler_switch: "{{ approle_rotation_engine_enabled | default(false) | bool }}"
        _verify_scheduler_account_missing: >-
          {{
            _verify_scheduler_jwt.rc != 0
            and 'serviceaccounts' in _verify_scheduler_jwt.stderr
            and ' not found' in _verify_scheduler_jwt.stderr
          }}
        _verify_scheduler_role_missing: >-
          {{
            ('could not be found' in (_verify_scheduler_login.stderr | default('')))
            or ('invalid role name' in (_verify_scheduler_login.stderr | default('')))
          }}

    - name: Work out whether the token request failed for another reason
      ansible.builtin.set_fact:
        _verify_scheduler_token_request_failed: >-
          {{ _verify_scheduler_jwt.rc != 0 and not (_verify_scheduler_account_missing | bool) }}

    - name: Assert the token request for the rotation scheduler did not fail
      ansible.builtin.assert:
        that:
          - not (_verify_scheduler_token_request_failed | bool)
        fail_msg: >-
          The token request for the ServiceAccount
          {{ verify_rotation_scheduler_service_account }} failed for a reason
          other than the ServiceAccount being absent, so the scheduler
          identity cannot be judged. The error was:
          {{ _verify_scheduler_jwt.stderr | default('') | trim }}

    - name: Work out whether the rotation scheduler is missing
      ansible.builtin.set_fact:
        _verify_scheduler_not_set_up: >-
          {{ (_verify_scheduler_account_missing | bool) or (_verify_scheduler_role_missing | bool) }}

    - name: Assert the rotation scheduler can log in when it is expected to
      ansible.builtin.assert:
        that:
          - _verify_scheduler_ready | bool or (_verify_scheduler_not_set_up | bool and not (_verify_scheduler_switch | bool))
        fail_msg: >-
          The rotation scheduler could not log in to OpenBao as role
          {{ verify_rotation_scheduler_k8s_role }}. Either its ServiceAccount
          or Kubernetes-auth role is missing while approle_rotation_engine_enabled
          is on, or the login failed for another reason (for example the
          Kubernetes auth reviewer config is missing). The openbao role writes
          the Kubernetes-auth role on a fresh install only: an installed
          environment needs the out-of-repo procedure that writes it.

    - name: Say that the rotation scheduler is not set up yet
      ansible.builtin.debug:
        msg: >-
          The rotation scheduler's ServiceAccount or Kubernetes-auth role
          ({{ verify_rotation_scheduler_k8s_role }}) does not exist yet, and
          approle_rotation_engine_enabled is off, so its login and capability
          probes were skipped. The openbao role writes that role on a fresh
          install only. Set up the scheduler identity before you turn the
          rotation on.
      when: not (_verify_scheduler_ready | bool)

    - name: Capture rotation-scheduler token
      ansible.builtin.set_fact:
        _verify_token_rotation_scheduler: >-
          {{
            (_verify_scheduler_login.stdout | from_json).auth.client_token
            if _verify_scheduler_ready | bool else ''
          }}
      no_log: true

    - name: Choose the capability probes to run
      ansible.builtin.set_fact:
        _verify_active_probes: >-
          {{
            verify_probes
            if _verify_scheduler_ready | bool
            else verify_probes | rejectattr('identity', 'equalto', 'rotation-scheduler') | list
          }}
    # ────────────────────────────────────────────────────────────────
    # Step 3 — AC-5 negative probes (Implementation Brief §7.5)
    # ────────────────────────────────────────────────────────────────
    - name: Probe capability matrix
      ansible.builtin.shell:
        cmd: >-
          kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
          -n {{ verify_openbao_namespace }}
          exec -i {{ _verify_openbao_pod }}
          -- sh -c '
          IFS= read -r BAO_TOKEN;
          export BAO_TOKEN;
          bao token capabilities -format=json {{ item.path | quote }}'
        stdin: >-
          {{
            {
              'ops-admin': _verify_token_ops_admin,
              'policy-reconciler': _verify_token_policy_reconciler,
              'approle-reconciler': _verify_token_approle_reconciler,
              'setup-issuer': _verify_token_setup_issuer,
              'rotation-scheduler': _verify_token_rotation_scheduler
            }[item.identity]
          }}
      register: _verify_probe_results
      changed_when: false
      no_log: true
      loop: "{{ _verify_active_probes }}"
      loop_control:
        label: "{{ item.identity }} → {{ item.path }}"

    - name: Build per-probe capability lists
      ansible.builtin.set_fact:
        _verify_probe_caps_list: >-
          {{
            _verify_probe_caps_list | default([])
            + [
                (item.stdout | from_json).capabilities
                if (item.stdout | from_json) is mapping and (item.stdout | from_json).capabilities is defined
                else (item.stdout | from_json)
              ]
          }}
      loop: "{{ _verify_probe_results.results }}"
      loop_control:
        label: "{{ item.item.identity }} → {{ item.item.path }}"

    - name: Assert each negative probe matches expected outcome
      ansible.builtin.assert:
        that:
          - >-
              (item.0.expected == 'deny' and item.1 == ['deny']) or
              (item.0.expected == 'update' and item.1 == ['update']) or
              (item.0.expected == 'read' and item.1 == ['read']) or
              (item.0.expected == 'denied_or_missing' and (item.1 == ['deny'] or item.1 | length == 0))
        fail_msg: >-
          AC-5 separation violated: {{ item.0.identity }} → {{ item.0.path }}.
          Expected '{{ item.0.expected }}'; got {{ item.1 }}.
          Reason: {{ item.0.reason }}.
          This indicates a policy drift or an identity gained an unintended
          capability. Review ADR-0021 and the role policies before mutating
          further state.
      loop: "{{ _verify_active_probes | zip(_verify_probe_caps_list) | list }}"
      loop_control:
        label: "{{ item.0.identity }} → {{ item.0.path }}"

    # ────────────────────────────────────────────────────────────────
    # Step 3b — what an ESO token can do, without logging in as ESO. The policy
    # is checked in both modes. In AppRole mode the role's policy list is checked
    # too, when the rotation scheduler (the identity that can read that role) is set up.
    # ────────────────────────────────────────────────────────────────
    - name: Check that the live eso-reader policy grants no capability on the PKI mount
      ansible.builtin.include_tasks: tasks/verify-eso-reader-policy.yml

    - name: Check that ESO's AppRole role carries the eso-reader policy only
      ansible.builtin.include_tasks: tasks/verify-eso-role-policies.yml
      when:
        - verify_eso_auth_method == 'approle'
        - _verify_scheduler_ready | bool

    - name: Say that ESO's AppRole role was not checked
      ansible.builtin.debug:
        msg: >-
          The rotation scheduler is not set up, and it is the only identity that
          can read ESO's AppRole role, so the role's policy list was not checked.
          Set up the scheduler identity to turn this check on.
      when:
        - verify_eso_auth_method == 'approle'
        - not (_verify_scheduler_ready | bool)

    # ────────────────────────────────────────────────────────────────
    # Step 4 — ClusterSecretStore Ready (positive)
    # ────────────────────────────────────────────────────────────────
    - name: Look up ClusterSecretStores
      kubernetes.core.k8s_info:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: external-secrets.io/v1
        kind: ClusterSecretStore
        name: "{{ item }}"
      register: _verify_css_info
      loop:
        - openbao-openbao-snapshots
        - openbao-app-backups
      loop_control:
        label: "{{ item }}"

    - name: Assert each ClusterSecretStore is Ready
      ansible.builtin.assert:
        that:
          - item.resources | length > 0
          - >-
              item.resources[0].status.conditions
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list | length > 0
        fail_msg: >-
          ClusterSecretStore '{{ item.item }}' is missing or not Ready.
          Confirm base/object-storage-credentials ran cleanly and OpenBao
          is unsealed.
      loop: "{{ _verify_css_info.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ────────────────────────────────────────────────────────────────
    # Step 5 — ExternalSecret Ready in the six target namespaces (positive)
    # ────────────────────────────────────────────────────────────────
    - name: Look up ExternalSecrets in target namespaces
      kubernetes.core.k8s_info:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: external-secrets.io/v1
        kind: ExternalSecret
        namespace: "{{ item.namespace }}"
        name: "{{ item.name }}"
      register: _verify_es_info
      loop: "{{ verify_expected_external_secrets }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"

    - name: Assert each ExternalSecret is Ready
      ansible.builtin.assert:
        that:
          - item.resources | length > 0
          - >-
              item.resources[0].status.conditions | default([])
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list | length > 0
        fail_msg: >-
          ExternalSecret '{{ item.item.namespace }}/{{ item.item.name }}' is
          missing or not Ready. Either base/object-storage-credentials hasn't
          run against this namespace, ESO can't reach OpenBao, or the AppRole
          secret_id has expired.
      loop: "{{ _verify_es_info.results }}"
      loop_control:
        label: "{{ item.item.namespace }}/{{ item.item.name }}"

    # ────────────────────────────────────────────────────────────────
    # Step 6 — main store on Kubernetes auth (only when it is selected)
    # ────────────────────────────────────────────────────────────────
    - name: Read the main ClusterSecretStore
      kubernetes.core.k8s_info:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: external-secrets.io/v1
        kind: ClusterSecretStore
        name: "{{ verify_eso_store_name }}"
      register: _verify_main_store
      when: verify_eso_auth_method == 'kubernetes'

    - name: Assert the main store is Ready and uses only Kubernetes auth
      ansible.builtin.assert:
        that:
          - _verify_main_store.resources | length == 1
          - _verify_main_store.resources[0].spec.provider.vault.auth.keys() | list == ['kubernetes']
          - _verify_main_store.resources[0].spec.provider.vault.auth.kubernetes.serviceAccountRef.name == verify_eso_service_account
          - _verify_main_store.resources[0].spec.provider.vault.auth.kubernetes.serviceAccountRef.namespace == verify_eso_namespace
          - verify_eso_audience in _verify_main_store.resources[0].spec.provider.vault.auth.kubernetes.serviceAccountRef.audiences
          - >-
              _verify_main_store.resources[0].status.conditions
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list | length > 0
        fail_msg: >-
          The main ClusterSecretStore {{ verify_eso_store_name }} is missing, not
          Ready, or does not hold exactly the Kubernetes auth block.
      when: verify_eso_auth_method == 'kubernetes'

    - name: Check the main store's Kubernetes auth
      when: verify_eso_auth_method == 'kubernetes'
      block:
        - name: Request a fresh token for ESO's ServiceAccount with the right audience
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - /etc/rancher/k3s/k3s.yaml
              - -n
              - "{{ verify_eso_namespace }}"
              - create
              - token
              - "{{ verify_eso_service_account }}"
              - --duration
              - 10m
              - --audience
              - "{{ verify_eso_audience }}"
          register: _verify_eso_jwt
          changed_when: false
          no_log: true

        - name: Log in as ESO with the fresh token
          ansible.builtin.shell:
            cmd: >-
              kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
              -n {{ verify_openbao_namespace }}
              exec -i {{ _verify_openbao_pod }}
              -- sh -c '
              exec bao write -format=json auth/kubernetes/login
              role={{ verify_eso_k8s_role | quote }} jwt=-'
            stdin: "{{ _verify_eso_jwt.stdout | trim }}"
            stdin_add_newline: false
          register: _verify_eso_login
          changed_when: false
          no_log: true

        - name: Capture the ESO login result
          ansible.builtin.set_fact:
            _verify_eso_auth: "{{ (_verify_eso_login.stdout | from_json).auth }}"
          no_log: true

        - name: Assert the login has the eso-reader policy and a short lifetime
          ansible.builtin.assert:
            that:
              - "'eso-reader' in _verify_eso_auth.policies"
              - _verify_eso_auth.lease_duration | int > 0
              - _verify_eso_auth.lease_duration | int <= 3600
            fail_msg: The ESO login did not return the eso-reader policy with a short token lifetime.
          no_log: true

        - name: Check that the ESO token has no grant on the PKI mount
          ansible.builtin.include_tasks: tasks/verify-eso-no-pki.yml

        - name: Revoke the token of the verification login
          ansible.builtin.shell:
            cmd: >-
              kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
              -n {{ verify_openbao_namespace }}
              exec -i {{ _verify_openbao_pod }}
              -- sh -c '
              IFS= read -r BAO_TOKEN;
              export BAO_TOKEN;
              bao token revoke -self'
            stdin: "{{ _verify_eso_auth.client_token }}\n"
          changed_when: false
          no_log: true

        - name: Request a token for the wrong ServiceAccount
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - /etc/rancher/k3s/k3s.yaml
              - -n
              - "{{ verify_eso_namespace }}"
              - create
              - token
              - default
              - --duration
              - 10m
              - --audience
              - "{{ verify_eso_audience }}"
          register: _verify_wrong_sa_jwt
          changed_when: false
          no_log: true

        - name: Request a token with the wrong audience
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - /etc/rancher/k3s/k3s.yaml
              - -n
              - "{{ verify_eso_namespace }}"
              - create
              - token
              - "{{ verify_eso_service_account }}"
              - --duration
              - 10m
              - --audience
              - "{{ verify_eso_audience }}-wrong"
          register: _verify_wrong_aud_jwt
          changed_when: false
          no_log: true

        # A name unique to this run. `kubectl create` fails when the namespace exists,
        # so the probe never adopts a namespace it did not create. The flag records
        # that this run created it, and only then does the cleanup delete it.
        - name: Choose a namespace name unique to this run
          ansible.builtin.set_fact:
            _verify_run_id: "{{ lookup('ansible.builtin.pipe', 'date -u +%s') }}{{ 99999 | random }}"
            _verify_wrong_ns_created: false

        - name: Name the probe namespace
          ansible.builtin.set_fact:
            _verify_wrong_namespace: "dmf-verify-{{ _verify_run_id }}"

        - name: Create the probe namespace
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - /etc/rancher/k3s/k3s.yaml
              - create
              - namespace
              - "{{ _verify_wrong_namespace }}"
          changed_when: true

        - name: Record that this run created the probe namespace
          ansible.builtin.set_fact:
            _verify_wrong_ns_created: true

        - name: Create a ServiceAccount of ESO's name in the probe namespace
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - /etc/rancher/k3s/k3s.yaml
              - -n
              - "{{ _verify_wrong_namespace }}"
              - create
              - serviceaccount
              - "{{ verify_eso_service_account }}"
          changed_when: true

        - name: Request a token for ESO's account name in the wrong namespace
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - /etc/rancher/k3s/k3s.yaml
              - -n
              - "{{ _verify_wrong_namespace }}"
              - create
              - token
              - "{{ verify_eso_service_account }}"
              - --duration
              - 10m
              - --audience
              - "{{ verify_eso_audience }}"
          register: _verify_wrong_ns_jwt
          changed_when: false
          no_log: true

        - name: Try to log in with each wrong token
          ansible.builtin.shell:
            cmd: >-
              kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
              -n {{ verify_openbao_namespace }}
              exec -i {{ _verify_openbao_pod }}
              -- sh -c '
              exec bao write -format=json auth/kubernetes/login
              role={{ verify_eso_k8s_role | quote }} jwt=-'
            stdin: "{{ item.jwt }}"
            stdin_add_newline: false
          register: _verify_wrong_logins
          changed_when: false
          failed_when: false
          no_log: true
          loop:
            - { case: wrong ServiceAccount, jwt: "{{ _verify_wrong_sa_jwt.stdout | trim }}" }
            - { case: wrong namespace, jwt: "{{ _verify_wrong_ns_jwt.stdout | trim }}" }
            - { case: wrong audience, jwt: "{{ _verify_wrong_aud_jwt.stdout | trim }}" }
          loop_control:
            label: "{{ item.case }}"

        - name: Assert every wrong token is refused
          ansible.builtin.assert:
            that:
              - item.rc != 0
              - "'client_token' not in item.stdout"
            fail_msg: "OpenBao accepted a login with the {{ item.item.case }} token."
          loop: "{{ _verify_wrong_logins.results }}"
          loop_control:
            label: "{{ item.item.case }}"

        - name: Try to write the Kubernetes auth config as each standing identity
          # The body holds a public key that cannot parse. A token that may write
          # the config gets a validation error and nothing changes; a token that
          # may not gets 403 before the body is read.
          ansible.builtin.shell:
            cmd: >-
              kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
              -n {{ verify_openbao_namespace }}
              exec -i {{ _verify_openbao_pod }}
              -- sh -c '
              IFS= read -r BAO_TOKEN;
              export BAO_TOKEN;
              bao write auth/kubernetes/config pem_keys=not-a-public-key'
            stdin: >-
              {{
                {
                  'ops-admin': _verify_token_ops_admin,
                  'policy-reconciler': _verify_token_policy_reconciler,
                  'approle-reconciler': _verify_token_approle_reconciler
                }[item]
              }}
          register: _verify_config_writes
          changed_when: false
          failed_when: false
          no_log: true
          loop: [ops-admin, policy-reconciler, approle-reconciler]

        - name: Assert each standing identity gets 403 on the config write
          ansible.builtin.assert:
            that:
              - item.rc != 0
              - "item.stderr is search('Code: 403|permission denied')"
            fail_msg: "{{ item.item }} did not get 403 when it wrote auth/kubernetes/config."
          loop: "{{ _verify_config_writes.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Read the ExternalSecret that the probe refreshes
          kubernetes.core.k8s_info:
            kubeconfig: /etc/rancher/k3s/k3s.yaml
            api_version: external-secrets.io/v1
            kind: ExternalSecret
            namespace: "{{ verify_main_store_sync_target.namespace }}"
            name: "{{ verify_main_store_sync_target.name }}"
          register: _verify_target_es

        - name: Assert the ExternalSecret reads through the main store
          ansible.builtin.assert:
            that:
              - _verify_target_es.resources | length == 1
              - _verify_target_es.resources[0].spec.secretStoreRef.name == verify_eso_store_name
              - _verify_target_es.resources[0].spec.secretStoreRef.kind | default('SecretStore') == 'ClusterSecretStore'
            fail_msg: >-
              {{ verify_main_store_sync_target.namespace }}/{{ verify_main_store_sync_target.name }}
              does not read through the ClusterSecretStore {{ verify_eso_store_name }}.
              Set verify_main_store_sync_target to an ExternalSecret that does.

        # A successful refresh through the main store after a forced sync: up to three
        # attempts, each with its own annotation, passing when ESO publishes the version
        # computed for the annotated metadata. An attempt after a success does nothing
        # (playbooks/tasks/verify-main-store-refresh.yml).
        - name: Force a sync and wait for a later refresh
          ansible.builtin.include_tasks: tasks/verify-main-store-refresh.yml
          loop: [1, 2, 3]
          loop_control:
            loop_var: _verify_attempt

        - name: Assert a successful refresh through the main store followed a forced sync
          ansible.builtin.assert:
            that: _verify_refreshed | default(false) | bool
            fail_msg: >-
              {{ verify_main_store_sync_target.namespace }}/{{ verify_main_store_sync_target.name }}
              showed no Ready refresh after three forced syncs. The main store may not be
              reading from OpenBao.
      always:
        - name: Remove the probe namespace, only if this run created it
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - /etc/rancher/k3s/k3s.yaml
              - delete
              - namespace
              - "{{ _verify_wrong_namespace }}"
              - --wait=false
          changed_when: true
          when: _verify_wrong_ns_created | default(false) | bool

    # ────────────────────────────────────────────────────────────────
    # Summary
    # ────────────────────────────────────────────────────────────────
    - name: Summarise identity-model verification
      ansible.builtin.debug:
        msg: |-
          OpenBao identity model verified on this cluster:
            - {{ _verify_active_probes | map(attribute='identity') | unique | list | length }} identities log in and are probed:
              {{ _verify_active_probes | map(attribute='identity') | unique | join(', ') }}
            - {{ _verify_active_probes | length }} capability probes match their expected outcome:
              {% for p in _verify_active_probes %}
              * {{ p.identity }} → {{ p.path }}: {{ p.expected }}
              {% endfor %}
            - 2 ClusterSecretStores Ready (openbao-openbao-snapshots, openbao-app-backups)
            - main store auth method: {{ verify_eso_auth_method }}
            - {{ verify_expected_external_secrets | length }} ExternalSecrets Ready across
              {{ verify_expected_external_secrets | map(attribute='namespace') | unique | list | length }}
              namespaces
