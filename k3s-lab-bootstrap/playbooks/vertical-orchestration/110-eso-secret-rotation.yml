---
# Rotate the ESO AppRole SecretID. Two procedures can run, and the switch
# approle_rotation_engine_enabled picks one.
#
# - On (the registry-driven rotation): 115-approle-rotation.yml rotates the
#   `external-secrets` target with lib/approle_lifecycle/rotation.py. The
#   scheduler logs in to OpenBao with Kubernetes auth, so turn the switch on
#   only after the scheduler identity works: the openbao role has written its
#   Kubernetes-auth role (a fresh install does, an installed environment needs
#   the out-of-repo procedure) and OpenBao has the Kubernetes auth reviewer
#   config.
# - Off (the default): provisioning runs the earlier procedure unchanged, from
#   tasks/eso-secret-rotation-legacy.yml, so the SecretID keeps being
#   refreshed on every run.
- name: Rotate the ESO AppRole SecretID with the registry-driven rotation
  ansible.builtin.import_playbook: 115-approle-rotation.yml
  vars:
    approle_rotation_target: external-secrets
    approle_rotation_actor: provisioning-playbook
    approle_rotation_role: operator
    approle_rotation_reason: rotate the ESO AppRole during provisioning
  when: approle_rotation_engine_enabled | default(false) | bool

- name: Rotate ESO AppRole secret_id
  hosts: k3s_control[0]
  become: true
  gather_facts: false

  vars:
    eso_rotation_openbao_namespace: "{{ openbao_namespace | default('openbao') }}"
    eso_rotation_openbao_role_name: "{{ openbao_eso_role_name | default('external-secrets') }}"
    eso_rotation_approle_secret_name: "{{ eso_approle_secret_name | default('openbao-approle') }}"
    eso_rotation_breakglass_file: "{{ eso_openbao_breakglass_file | default('') }}"
    eso_rotation_external_secrets_namespace: "{{ eso_namespace | default('external-secrets') }}"

  tasks:
    - name: Wait for the cluster to be ready
      ansible.builtin.include_role:
        name: base/cluster-ready
      when: not (approle_rotation_engine_enabled | default(false) | bool)

    - name: Run the earlier ESO rotation procedure
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/eso-secret-rotation-legacy.yml"
      when: not (approle_rotation_engine_enabled | default(false) | bool)
