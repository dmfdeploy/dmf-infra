---
# Audit-grade time discipline.
# Runs after 200-baseline (which installs chrony) and before 210-harden.
# Audit records from different nodes are compared by their timestamps, so the
# node clocks must agree.
- name: Configure chrony for audit-grade time sync
  hosts: all
  become: true
  gather_facts: true
  roles:
    - base/chrony
