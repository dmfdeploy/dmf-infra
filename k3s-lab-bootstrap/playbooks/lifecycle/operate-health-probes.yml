---
# playbooks/lifecycle/operate-health-probes.yml
# DMF lifecycle: Operate stage — read-only endpoint probes.
#
# Operate is the steady state of a running facility, so this file only reads.
# It never deploys. The deploy plays for these apps run in the install path:
# bootstrap-*-provision-post-seed.yml and bootstrap-*-configure.yml.
#
# Probes:
# - DMF Console /healthz
# - NetBox API root (the endpoint born-inventory depends on)
# - Zot registry /v2/

- name: Probe DMF Console endpoint
  hosts: localhost
  become: false
  gather_facts: false

  tasks:
    - name: Check DMF Console health endpoint
      ansible.builtin.uri:
        url: "https://{{ dmf_cms_host | default('console.' ~ (cert_manager_cluster_domain | default('dmf.example.com'))) }}/healthz"
        method: GET
        status_code: [200]
        validate_certs: true
        return_content: true
      register: _operate_cms_health
      retries: 30
      delay: 5
      until: _operate_cms_health.status == 200

    - name: Assert DMF Console reports healthy status
      ansible.builtin.assert:
        that:
          - (_operate_cms_health.content | from_json).status == 'ok'
          - (_operate_cms_health.content | from_json).product == 'DMF Console'

- name: Probe NetBox API endpoint
  hosts: localhost
  become: false
  gather_facts: false

  tasks:
    - name: Check NetBox API root
      ansible.builtin.uri:
        url: "https://{{ netbox_host | default('netbox.' ~ (cert_manager_cluster_domain | default('dmf.example.com'))) }}/api/"
        method: GET
        status_code: [200]
        validate_certs: "{{ dmf_born_inventory_netbox_validate_certs | default(false) | bool }}"
      register: _operate_netbox_api
      retries: 30
      delay: 5
      until: _operate_netbox_api.status == 200

- name: Probe Zot registry endpoint
  hosts: localhost
  become: false
  gather_facts: false

  tasks:
    - name: Check Zot registry v2 endpoint
      ansible.builtin.uri:
        url: "https://{{ registry_host | default('registry.' ~ (cert_manager_cluster_domain | default('dmf.example.com'))) }}/v2/"
        method: GET
        status_code: [200, 401]
        validate_certs: true
      register: _operate_zot_v2
      retries: 30
      delay: 5
      until: _operate_zot_v2.status in [200, 401]
