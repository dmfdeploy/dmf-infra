---
# playbooks/vertical-security/106-openbao-kubernetes-auth.yml
# Move an installed environment to the Kubernetes auth reviewer identity and, when
# eso_openbao_auth_method is kubernetes, to ESO's role. This is a live change: the
# OpenBao pods restart to run as their own ServiceAccount and are sealed until they
# are unsealed. Run it only after the rehearsal on a disposable environment and the
# operator's approval for the environment.
#
# It writes only the Kubernetes auth config, ESO's role, and the Kubernetes-auth roles
# of the setup issuer, the rotation scheduler and the approval executor when they are
# missing, with a temporary root token that you give it in the environment:
#
#   OPENBAO_TEMP_ROOT_TOKEN=<token from the generate-root procedure>
#
# The procedure runs as ops-admin with a quorum of unseal shares: OpenBao 2.6 and
# later accept generate-root only from an authenticated caller. It is written out in
# the "Root token procedure" of roles/stack/operator/openbao/README.md.
#
# The token never goes in an argument list, and the play writes it to no file. Each
# task that uses it sends it to the pod on stdin. SSH pipelining is off in
# ansible.cfg, so Ansible stages every task's arguments, stdin included, in a
# temporary file on the node and removes that file when the task ends; an
# interrupted run or ANSIBLE_KEEP_REMOTE_FILES can leave it behind, and
# ANSIBLE_DEBUG prints module arguments. Run the play first without a
# token to move the workload; tasks/kubernetes-auth-existing.yml in the openbao
# role states the order of runs. A rerun writes nothing when the config and every
# role match, and it leaves an existing role as it is. A role needs its
# ServiceAccount and its policy: when one is missing, the play writes no role of the
# setup issuer, the rotation scheduler or the approval executor and fails with the
# names. Run playbooks/vertical-security/100-openbao.yml first, then this play
# again. It needs
# openbao_kubernetes_reviewer_enabled set to true in the inventory.
#
# The generate-root token has no lifetime, so the play trades it at once. After it
# checks that the token holds the root policy, it mints an orphan token with the
# root policy and a lifetime of openbao_k8s_write_token_ttl (15 minutes by default;
# the play refuses a value outside 10 to 15 minutes and checks the lifetime that
# OpenBao issued), revokes the generate-root token before the first write, and makes
# every write with the short token. It revokes the short token before it exits, also
# when a step fails, and proves that the server refuses both tokens: only a permission
# error from the server counts as that proof. If a revoke itself fails, the play
# fails loudly. Then revoke what is left by its accessor from a working session
# (`bao token revoke -accessor <accessor>`) before you do anything else. The play
# looks up the pod inside the block that owns the tokens. If that lookup fails, the
# revoke cannot run: the play then fails and says that the token is not revoked and
# how to revoke it by its accessor.
#
# If the run ends with the host UNREACHABLE, Ansible skips the revoke and prints no
# warning. After the generate-root token was revoked, which happens before the first
# write, only the short token can be left, and it expires on its own within 15
# minutes: you need to do nothing. If the host went away before that revoke, the
# generate-root token can still be valid. Check it, and revoke it by its accessor
# before you do anything else. A run that stops during or after the mint, but before
# that revoke, can leave both the generate-root token and a short token.
#
# If the answer to the mint is lost on its way back, the server may have created the
# short token while the play never saw it. The play then ends failed after it revoked
# the other tokens, and says how to find and revoke the token by its accessor. It
# expires on its own within 15 minutes.
- name: Move an installed environment to Kubernetes auth
  hosts: k3s_control[0]
  become: true
  gather_facts: false
  tasks:
    - name: Apply the workload, then write and check the config
      ansible.builtin.include_role:
        name: stack/operator/openbao
        tasks_from: kubernetes-auth-existing.yml
