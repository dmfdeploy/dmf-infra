---
- name: Deploy Longhorn distributed storage
  hosts: k3s_control[0]
  become: true
  vars:
    longhorn_version: "v1.10.1"
    # SHA-256 of longhorn.yaml, keyed by release. Longhorn publishes no checksum file,
    # so each value is the hash of the file at that release tag, downloaded from
    # longhorn_manifest_url and run through `shasum -a 256`. Add the new version's
    # hash when you change longhorn_version; the install fails until you do.
    longhorn_manifest_sha256:
      v1.10.1: "9dcd2472b009e468424fc708802e4a3a0e1e0880e44add6035ec2426d312994a"
    longhorn_manifest_url: "https://raw.githubusercontent.com/longhorn/longhorn/{{ longhorn_version }}/deploy/longhorn.yaml"
  tasks:
    - name: Create longhorn-system namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: longhorn-system

    # The manifest is checked against a pinned hash before it reaches the cluster,
    # so the apply reads the local, verified file and never the URL.
    - name: Apply the checked Longhorn manifest
      block:
        - name: Create a private file for the Longhorn manifest
          ansible.builtin.tempfile:
            state: file
            prefix: longhorn-
            suffix: .yaml
          register: _longhorn_manifest_file

        - name: Download Longhorn manifest
          ansible.builtin.get_url:
            url: "{{ longhorn_manifest_url }}"
            dest: "{{ _longhorn_manifest_file.path }}"
            # The temp file already exists and is empty, so its hash differs from the
            # pinned one and get_url downloads. It checks the download against the hash
            # before it replaces the file.
            checksum: >-
              sha256:{{ longhorn_manifest_sha256[longhorn_version]
              | mandatory('longhorn_manifest_sha256 has no hash for ' ~ longhorn_version
              ~ '; add the SHA-256 of longhorn.yaml for that release') }}
            mode: "0600"

        - name: Apply Longhorn manifests from the downloaded manifest
          kubernetes.core.k8s:
            kubeconfig: /etc/rancher/k3s/k3s.yaml
            state: present
            src: "{{ _longhorn_manifest_file.path }}"
          register: longhorn_apply
      always:
        - name: Remove the downloaded Longhorn manifest
          ansible.builtin.file:
            path: "{{ _longhorn_manifest_file.path }}"
            state: absent
          when: _longhorn_manifest_file.path is defined

    - name: Wait for Longhorn manager to be ready
      kubernetes.core.k8s_info:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        kind: DaemonSet
        name: longhorn-manager
        namespace: longhorn-system
      register: longhorn_manager
      until: >
        longhorn_manager.resources[0].status.numberReady | default(0) ==
        longhorn_manager.resources[0].status.desiredNumberScheduled | default(0)
      retries: 60
      delay: 10

    - name: Set default replica count
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        definition:
          apiVersion: longhorn.io/v1beta2
          kind: Setting
          metadata:
            name: default-replica-count
            namespace: longhorn-system
          value: "{{ longhorn_default_replica_count | string }}"

    - name: Read existing Longhorn StorageClass
      kubernetes.core.k8s_info:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: longhorn
      register: longhorn_storageclass

    - name: Decide whether Longhorn StorageClass must be replaced
      ansible.builtin.set_fact:
        longhorn_storageclass_needs_replace: >-
          {{
            longhorn_storageclass.resources | length > 0 and
            (
              longhorn_storageclass.resources[0].parameters.numberOfReplicas | default('') !=
              (longhorn_default_replica_count | string)
            )
          }}

    - name: Read PVC usage before replacing Longhorn StorageClass
      kubernetes.core.k8s_info:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: v1
        kind: PersistentVolumeClaim
      register: longhorn_pvcs
      when: longhorn_storageclass_needs_replace

    - name: Decide whether Longhorn StorageClass replacement is safe
      ansible.builtin.set_fact:
        longhorn_storageclass_replace_safe: >-
          {{
            (
              longhorn_pvcs.resources
              | selectattr('spec.storageClassName', 'defined')
              | selectattr('spec.storageClassName', 'equalto', 'longhorn')
              | list
              | length
            ) == 0
          }}
      when: longhorn_storageclass_needs_replace

    - name: Warn when Longhorn StorageClass replacement is blocked by existing PVCs
      ansible.builtin.debug:
        msg: >-
          Longhorn StorageClass parameters differ from the desired bootstrap config,
          but PVCs already exist that use `longhorn`. Leaving the live StorageClass
          unchanged and continuing the bootstrap.
      when:
        - longhorn_storageclass_needs_replace
        - not longhorn_storageclass_replace_safe

    - name: Update Longhorn storageclass ConfigMap template
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: longhorn-storageclass
            namespace: longhorn-system
          data:
            storageclass.yaml: |
              kind: StorageClass
              apiVersion: storage.k8s.io/v1
              metadata:
                name: longhorn
                annotations:
                  storageclass.kubernetes.io/is-default-class: "true"
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              reclaimPolicy: "Delete"
              volumeBindingMode: Immediate
              parameters:
                numberOfReplicas: "{{ longhorn_default_replica_count | string }}"
                staleReplicaTimeout: "30"
                fromBackup: ""
                fsType: "ext4"
                dataLocality: "disabled"
                unmapMarkSnapChainRemoved: "ignored"
                disableRevisionCounter: "true"
                dataEngine: "v1"
                backupTargetName: "default"

    - name: Replace Longhorn StorageClass before PVCs exist
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: absent
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: longhorn
      when:
        - longhorn_storageclass_needs_replace
        - longhorn_storageclass_replace_safe

    - name: Wait for Longhorn StorageClass to match desired replica count
      kubernetes.core.k8s_info:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: longhorn
      register: longhorn_storageclass_ready
      until: >-
        longhorn_storageclass_ready.resources | length > 0 and
        (
          longhorn_storageclass_ready.resources[0].parameters.numberOfReplicas | default('')
        ) == (longhorn_default_replica_count | string)
      retries: 30
      delay: 5
      when:
        - longhorn_storageclass_needs_replace
        - longhorn_storageclass_replace_safe
