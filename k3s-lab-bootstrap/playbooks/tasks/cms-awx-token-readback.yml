---
# Read the AWX token back from OpenBao and check that it is the one that was written.
# 697-cms-awx-token.yml includes this file after it persists the token. It needs the
# OpenBao session of the play (`_openbao_session_pod`, `_openbao_session_client_token`),
# `_cms_awx_svc_token`, and `_cms_awx_token_recovered_from_openbao`. It is a file of its
# own so that tests/test-openbao-cli-callers.yml can run these tasks.
- name: Read back AWX token from OpenBao
  ansible.builtin.include_role:
    name: common/openbao-cli
  vars:
    openbao_cli_operation: read back the AWX token
    openbao_cli_pod: "{{ _openbao_session_pod }}"
    openbao_cli_namespace: "{{ cms_openbao_namespace | default('openbao') }}"
    openbao_cli_token: "{{ _openbao_session_client_token }}"
    openbao_cli_calls:
      - args: [kv, get, -format=json, secret/apps/awx/runtime]
    openbao_cli_register: _cms_awx_openbao_raw
    openbao_cli_allow_failure: true

# One expression, so `rc` stays a number on every ansible-core version: a template
# per field can type the result as text, and `rc == 0` below would compare the text
# "0" with 0. The token is empty when the read failed, so the assert below can name the exit code.
- name: Extract AWX token from OpenBao JSON
  ansible.builtin.set_fact:
    _cms_awx_openbao_verify: >-
      {{ {
        'rc': _cms_awx_openbao_raw.rc | int,
        'stdout': ((_cms_awx_openbao_raw.stdout | from_json).data.data.cms_api_token | default('')
                   if _cms_awx_openbao_raw.rc | int == 0 and _cms_awx_openbao_raw.stdout | length > 0
                   else '') | string,
        'stderr': _cms_awx_openbao_raw.stderr | string
      } }}
  no_log: true

- name: Debug AWX token OpenBao read output
  ansible.builtin.debug:
    msg: |
      rc: {{ _cms_awx_openbao_verify.rc }}
      stdout empty: {{ _cms_awx_openbao_verify.stdout | length == 0 }}
      stdout length: {{ _cms_awx_openbao_verify.stdout | length }}
      stderr length: {{ _cms_awx_openbao_verify.stderr | length }}
  when: not _cms_awx_token_recovered_from_openbao | default(false) | bool

- name: Assert AWX token read succeeded from OpenBao
  ansible.builtin.assert:
    that:
      - _cms_awx_openbao_verify.rc == 0
    fail_msg: |
      Failed to read AWX token back from OpenBao.
      Return code: {{ _cms_awx_openbao_verify.rc }}
      The error text can hold a secret, so it is not shown.
      Check OpenBao is accessible and secret path exists.
  when: not _cms_awx_token_recovered_from_openbao | default(false) | bool

- name: Assert AWX token was persisted correctly to OpenBao
  ansible.builtin.assert:
    that:
      - _cms_awx_openbao_verify.stdout | trim == _cms_awx_svc_token
    fail_msg: |
      AWX service account token failed to persist to OpenBao.
      The value read back does not match the token that was written.
      This indicates OpenBao write succeeded but value is not consistent.
      Check OpenBao policies and mount permissions for secret/apps/awx/runtime.
  when: _cms_awx_openbao_verify.rc == 0
  no_log: true
