# Reads one source of principals for the identity check: lists the names under
# `_verify_src.list_path` and reads each one. It adds one entry per principal to
# _verify_principals, with the policies that the principal holds, in `policies`,
# and the groups that it passes policies to, in `members`.
#
# An empty list is not a failure: `bao list` exits 2 and prints "No value found" on
# standard error, or `{}` in JSON mode. A refused list (permission denied) also exits 2, so
# the task accepts only those two answers. A refused read, or a read of a name that the
# list just returned, fails the run: a principal that could not be read is one that the
# check could not clear.
#
# The caller holds the token in _verify_token_identity_reader and the pod in
# _verify_openbao_pod. The token goes in on stdin.
#
# Names come from OpenBao, which the verifier does not trust, so no name goes into a shell
# program. Each call runs `command` with an argument list, and the path reaches the program
# in the pod on stdin, after the token. The program reads it into a variable with
# `IFS= read -r`, and a check before the call rejects a path that holds a line break.

- name: Check that the list path holds no newline
  ansible.builtin.assert:
    that:
      - "(_verify_src.list_path) is not search('[\\r\\n]')"
    fail_msg: "_verify_src.list_path must not contain a newline: the program reads it from stdin, one value per line."

- name: "Identity check: list {{ _verify_src.list_path }}"
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - -n
      - "{{ verify_openbao_namespace }}"
      - exec
      - -i
      - "{{ _verify_openbao_pod }}"
      - --
      - sh
      - -c
      - 'IFS= read -r BAO_TOKEN; IFS= read -r LIST_PATH; export BAO_TOKEN; exec bao list -format=json "$LIST_PATH"'
    stdin: "{{ _verify_token_identity_reader }}\n{{ _verify_src.list_path }}\n"
  register: _verify_src_list
  changed_when: false
  failed_when:
    - _verify_src_list.rc != 0
    - not (_verify_src_list.rc == 2 and (_verify_src_list.stdout | trim == '{}' or 'No value found' in _verify_src_list.stderr))
  no_log: true

- name: Check that the read path holds no newline
  ansible.builtin.assert:
    that:
      - "(_verify_src.list_path ~ '/' ~ item) is not search('[\\r\\n]')"
    fail_msg: "_verify_src.list_path ~ '/' ~ item must not contain a newline: the program reads it from stdin, one value per line."
  loop: "{{ (_verify_src_list.stdout | from_json) if _verify_src_list.rc == 0 else [] }}"
  loop_control:
    label: "{{ item }}"

- name: "Identity check: read each name under {{ _verify_src.list_path }}"
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - -n
      - "{{ verify_openbao_namespace }}"
      - exec
      - -i
      - "{{ _verify_openbao_pod }}"
      - --
      - sh
      - -c
      - 'IFS= read -r BAO_TOKEN; IFS= read -r READ_PATH; export BAO_TOKEN; exec bao read -format=json "$READ_PATH"'
    stdin: "{{ _verify_token_identity_reader }}\n{{ _verify_src.list_path ~ '/' ~ item }}\n"
  register: _verify_src_reads
  changed_when: false
  no_log: true
  loop: "{{ (_verify_src_list.stdout | from_json) if _verify_src_list.rc == 0 else [] }}"
  loop_control:
    label: "{{ item }}"

- name: "Identity check: record the principals under {{ _verify_src.list_path }}"
  ansible.builtin.set_fact:
    _verify_principals: >-
      {{
        _verify_principals | default([])
        + [{
            'kind': _verify_src.kind,
            'mount': _verify_src.mount,
            'id': item.item,
            'name': (item.stdout | from_json).data.name | default(item.item),
            'policies': (
              ((item.stdout | from_json).data.token_policies | default([], true))
              + ((item.stdout | from_json).data.policies | default([], true))
              + ((item.stdout | from_json).data.allowed_policies | default([], true))
              + ((item.stdout | from_json).data.allowed_policies_glob | default([], true))
            ),
            'members': (item.stdout | from_json).data.member_group_ids | default([], true),
            'member_entities': (item.stdout | from_json).data.member_entity_ids | default([], true)
          }]
      }}
  loop: "{{ _verify_src_reads.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true
