# DMF AWX Execution Environment (Lane A of the 2026-05-19 convergence plan).
#
# Built from Fedora minimal 45, with a pinned ansible-core, a pinned
# ansible-runner, pinned collections and DMF-specific OCI labels. Used by:
#   - the in-cluster ansible runner pod (bootstrap-configure 69x chain;
#     see roles/stack/operator/ansible-runner/)
#   - AWX-spawned media catalog launchers (`media-*` JTs; ADR-0025)
#
# Do not build this file directly. scripts/build.sh replaces the placeholder
# under dependencies.ansible_core with the line in
# ../requirements-ansible-core.txt, the one place the ansible-core version
# is set, and builds from the rendered copy.
#
# Build: roles-adjacent script at scripts/build.sh
# Publish (public source of truth): the umbrella's bin/publish-image-to-ghcr.sh, see README.md
# Mirror to cluster Zot (runtime registry): ../playbooks/630-zot-seed-platform.yml

version: 3

options:
  # Fedora minimal ships microdnf, not dnf.
  package_manager_path: /usr/bin/microdnf

images:
  base_image:
    # The multi-arch index digest of the 45 tag, resolved with
    # `skopeo inspect --raw docker://quay.io/fedora/fedora-minimal:45 | shasum -a 256`
    # on 2026-11-25. The digest is what the build uses; the tag is for readers.
    # Always take the newest released Fedora. Refresh when the next release
    # ships (see ../README.md, "Fedora refresh").
    name: quay.io/fedora/fedora-minimal:45@sha256:22c73cf27de5e36f06d435b3bf016b02b95e75473ceef9a0bed48396124951a1

dependencies:
  # The base image has no Python, so Builder installs it. Fedora 45 ships
  # Python 3.15, which ansible-core 2.22 supports as a controller and
  # as a target.
  python_interpreter:
    package_system: python3 python3-pip
    python_path: /usr/bin/python3
  ansible_core:
    # Placeholder. scripts/build.sh fills it from requirements-ansible-core.txt.
    # A test fails if a version is written here by hand.
    package_pip: __ANSIBLE_CORE_PIN__
  ansible_runner:
    package_pip: ansible-runner==2.4.3
  # Every collection in requirements.yml must support the core pinned above.
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

additional_build_steps:
  append_final:
    # ARG values are passed by scripts/build.sh via --build-arg.
    # ${VAR} substitution happens at docker build time, embedding the
    # values into the LABEL directives below.
    - ARG IMAGE_VERSION=0.5.0
    - ARG VCS_REF=unknown
    - LABEL org.opencontainers.image.title="DMF AWX Execution Environment"
    - LABEL org.opencontainers.image.description="Shared Ansible EE for dmfdeploy platform — used by in-cluster runner pod (bootstrap-configure) and AWX catalog launchers (media-* JTs). See ADR-0025."
    - LABEL org.opencontainers.image.source="https://github.com/dmfdeploy/dmf-infra"
    - LABEL org.opencontainers.image.revision="${VCS_REF}"
    - LABEL org.opencontainers.image.version="${IMAGE_VERSION}"
    - LABEL org.opencontainers.image.licenses="Apache-2.0"
    - LABEL org.opencontainers.image.vendor="dmfdeploy platform contributors"
    - LABEL org.opencontainers.image.base.name="quay.io/fedora/fedora-minimal:45"
    - LABEL org.dmfdeploy.ee.lane="A"
