---
# Parameterized catalog project creation/update (Move 1 + Catalog, ADR-0014)
# Loop variable: catalog_project (name, description, scm_url, roles_path,
# optional scm_branch — umbrella #277: JT registrations (awx_catalog_
# job_templates) and the playbook contracts they target must move
# together; an unpinned project floating on `main` while JT var names are
# registration-frozen is exactly how #277's drift escaped. Defaults to
# 'main' for any project that doesn't set its own scm_branch — see
# awx_catalog_projects' own dmf-runbooks entry for the pinned case.)
# Updates: awx_catalog_project_ids fact map

- name: "Lookup AWX project: {{ catalog_project.name }}"
  ansible.builtin.uri:
    url: "{{ awx_integration_api_base }}/projects/?name={{ catalog_project.name | urlencode }}&organization={{ awx_integration_org_id }}"
    method: GET
    url_username: "{{ awx_integration_admin_user }}"
    url_password: "{{ awx_integration_admin_password }}"
    force_basic_auth: true
    status_code: 200
  until: >-
    _catalog_project_lookup is success
    or (_catalog_project_lookup.status | default(0) >= 400 and _catalog_project_lookup.status | default(0) < 500)
  retries: "{{ _gate_uri_retry | default(6) }}"
  delay: "{{ _gate_uri_delay | default(5) }}"
  register: _catalog_project_lookup
  no_log: "{{ not awx_integration_debug | bool }}"

- name: "Create AWX project: {{ catalog_project.name }}"
  ansible.builtin.uri:
    url: "{{ awx_integration_api_base }}/projects/"
    method: POST
    url_username: "{{ awx_integration_admin_user }}"
    url_password: "{{ awx_integration_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ catalog_project.name }}"
      description: "{{ catalog_project.description }}"
      organization: "{{ awx_integration_org_id }}"
      scm_type: "git"
      scm_url: "{{ catalog_project.scm_url }}"
      scm_branch: "{{ catalog_project.scm_branch | default('main') }}"
      scm_update_on_launch: true
      credential: "{{ awx_integration_scm_cred_id }}"
    status_code: 201
  until: >-
    _catalog_project_created is success
    or (_catalog_project_created.status | default(0) >= 400 and _catalog_project_created.status | default(0) < 500)
  retries: "{{ _gate_uri_retry | default(6) }}"
  delay: "{{ _gate_uri_delay | default(5) }}"
  when: _catalog_project_lookup.json.count | int == 0
  register: _catalog_project_created
  no_log: "{{ not awx_integration_debug | bool }}"

- name: "Set catalog project ID: {{ catalog_project.name }}"
  ansible.builtin.set_fact:
    _catalog_project_id: >-
      {{ (_catalog_project_lookup.json.results | default([]) | first | default({})).id
         | default(_catalog_project_created.json.id) }}

- name: "Update AWX project SCM: {{ catalog_project.name }}"
  ansible.builtin.uri:
    url: "{{ awx_integration_api_base }}/projects/{{ _catalog_project_id }}/"
    method: PATCH
    url_username: "{{ awx_integration_admin_user }}"
    url_password: "{{ awx_integration_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      scm_url: "{{ catalog_project.scm_url }}"
      scm_branch: "{{ catalog_project.scm_branch | default('main') }}"
      scm_update_on_launch: true
      credential: "{{ awx_integration_scm_cred_id }}"
      scm_delete_on_update: true
      custom_virtualenv: ""
    status_code: 200
  until: >-
    _gate_uri_result_24 is success
    or (_gate_uri_result_24.status | default(0) >= 400 and _gate_uri_result_24.status | default(0) < 500)
  retries: "{{ _gate_uri_retry | default(6) }}"
  delay: "{{ _gate_uri_delay | default(5) }}"
  register: _gate_uri_result_24
  when: _catalog_project_lookup.json.count | int > 0
  no_log: "{{ not awx_integration_debug | bool }}"

- name: "Set GIT_SSL_NO_VERIFY and ANSIBLE_ROLES_PATH for AWX project: {{ catalog_project.name }}"
  ansible.builtin.uri:
    url: "{{ awx_integration_api_base }}/projects/{{ _catalog_project_id }}/"
    method: PATCH
    url_username: "{{ awx_integration_admin_user }}"
    url_password: "{{ awx_integration_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      environment_vars:
        GIT_SSL_NO_VERIFY: "true"
        ANSIBLE_ROLES_PATH: "{{ catalog_project.roles_path }}"
    status_code: [200, 400]
  until: >-
    _catalog_project_env_set is success
    or (_catalog_project_env_set.status | default(0) >= 400 and _catalog_project_env_set.status | default(0) < 500)
  retries: "{{ _gate_uri_retry | default(6) }}"
  delay: "{{ _gate_uri_delay | default(5) }}"
  register: _catalog_project_env_set
  no_log: "{{ not awx_integration_debug | bool }}"

- name: "Derive Forgejo mirror repo + pinned ref: {{ catalog_project.name }}"
  ansible.builtin.set_fact:
    _catalog_project_forgejo_repo: "{{ catalog_project.scm_url | basename | regex_replace('\\.git$', '') }}"
    _catalog_project_forgejo_ref: "{{ catalog_project.scm_branch | default('main') }}"

- name: "Trigger Forgejo mirror-sync: {{ catalog_project.name }}"
  # Best-effort: the in-cluster Forgejo repos are pull-mirrors of GitHub on a
  # ~1h interval, so a project sync right after a GitHub tag push can race a
  # stale mirror (umbrella #316). Kick a mirror-sync here to shrink that
  # window, but don't hard-fail on it — a non-mirror repo, an unconfigured
  # mirror, etc. all tolerate 4xx here. The authoritative gate is the ref-wait
  # poll below.
  ansible.builtin.uri:
    url: "{{ awx_integration_forgejo_api_base }}/repos/{{ awx_integration_forgejo_user }}/{{ _catalog_project_forgejo_repo }}/mirror-sync"
    method: POST
    headers:
      Authorization: "token {{ awx_integration_forgejo_token }}"
    status_code: [200, 202, 400, 401, 403, 404, 422]
  register: _catalog_project_mirror_sync
  failed_when: false
  no_log: "{{ not awx_integration_debug | bool }}"

- name: "Wait for pinned ref to mirror into Forgejo: {{ catalog_project.name }}"
  # Authoritative gate for the mirror race (umbrella #316): the commits
  # endpoint resolves a branch, tag, or SHA uniformly, returning 200 once the
  # pinned ref exists in the mirror and 404 until it does.
  ansible.builtin.uri:
    url: "{{ awx_integration_forgejo_api_base }}/repos/{{ awx_integration_forgejo_user }}/{{ _catalog_project_forgejo_repo }}/commits?sha={{ _catalog_project_forgejo_ref | urlencode }}&limit=1&stat=false"
    method: GET
    headers:
      Authorization: "token {{ awx_integration_forgejo_token }}"
    status_code: [200, 404]
  register: _catalog_project_mirror_ref_wait
  failed_when: false
  until: _catalog_project_mirror_ref_wait.status | default(0) == 200
  retries: "{{ awx_integration_forgejo_mirror_wait_retries | default(24) }}"
  delay: "{{ awx_integration_forgejo_mirror_wait_delay | default(5) }}"
  no_log: "{{ not awx_integration_debug | bool }}"

- name: "Assert pinned ref mirrored into Forgejo: {{ catalog_project.name }}"
  ansible.builtin.assert:
    that:
      - _catalog_project_mirror_ref_wait.status | default(0) == 200
    fail_msg: >-
      AWX catalog project {{ catalog_project.name }} is pinned to ref
      '{{ _catalog_project_forgejo_ref }}' in Forgejo repo
      {{ awx_integration_forgejo_user }}/{{ _catalog_project_forgejo_repo }},
      but that ref never appeared in the in-cluster Forgejo mirror after
      waiting {{ awx_integration_forgejo_mirror_wait_retries | default(24) }}
      retries x {{ awx_integration_forgejo_mirror_wait_delay | default(5) }}s
      delay (~{{ (awx_integration_forgejo_mirror_wait_retries | default(24) | int)
      * (awx_integration_forgejo_mirror_wait_delay | default(5) | int) }}s total).
      Likely cause: the GitHub tag/branch has not yet mirrored into the
      in-cluster Forgejo pull-mirror (~1h interval). Manual remedy: POST
      {{ awx_integration_forgejo_api_base }}/repos/{{ awx_integration_forgejo_user }}/{{ _catalog_project_forgejo_repo }}/mirror-sync
      then re-run this play once that returns.

- name: "Trigger AWX project sync: {{ catalog_project.name }}"
  ansible.builtin.uri:
    url: "{{ awx_integration_api_base }}/projects/{{ _catalog_project_id }}/update/"
    method: POST
    url_username: "{{ awx_integration_admin_user }}"
    url_password: "{{ awx_integration_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: {}
    status_code: [201, 202]
  until: >-
    _catalog_project_update is success
    or (_catalog_project_update.status | default(0) >= 400 and _catalog_project_update.status | default(0) < 500)
  retries: "{{ _gate_uri_retry | default(6) }}"
  delay: "{{ _gate_uri_delay | default(5) }}"
  register: _catalog_project_update
  no_log: "{{ not awx_integration_debug | bool }}"

- name: "Wait for AWX project sync to complete: {{ catalog_project.name }}"
  ansible.builtin.uri:
    url: "{{ awx_integration_api_base }}/project_updates/{{ _catalog_project_update.json.id }}/"
    method: GET
    url_username: "{{ awx_integration_admin_user }}"
    url_password: "{{ awx_integration_admin_password }}"
    force_basic_auth: true
    # A freshly-woken AWX (scale-to-zero wake) answers /ping 200 before the
    # project_updates endpoint is fully warm — it can briefly 404 or drop the
    # connection. Tolerate those as transient and let `until` keep polling.
    # (Same fix as the project-sync poll in tasks/main.yml, b96bf23 — this is
    # the catalog-project duplicate that was missed.)
    status_code: [200, 404]
  register: _catalog_project_update_status
  failed_when: false
  # Guard `.json is defined`: a connection error / non-JSON result registers a
  # dict without `.json`, and a bare `...json.status` conditional then crashes
  # ("object of type 'dict' has no attribute 'json'") instead of retrying.
  until: >-
    _catalog_project_update_status.json is defined
    and _catalog_project_update_status.json.status in ["successful", "failed", "canceled"]
  retries: 60
  delay: 5
  no_log: "{{ not awx_integration_debug | bool }}"

- name: "Assert AWX project sync succeeded: {{ catalog_project.name }}"
  ansible.builtin.assert:
    that:
      - _catalog_project_update_status.json is defined
      - _catalog_project_update_status.json.status is defined
      - _catalog_project_update_status.json.status == "successful"
    fail_msg: >-
      AWX project sync did not complete for {{ catalog_project.name }}
      (http_status={{ _catalog_project_update_status.status | default('none') }},
      status={{ _catalog_project_update_status.json.status | default('unknown')
      if _catalog_project_update_status.json is defined else 'no-json' }}).
      Without a fresh sync, AWX's JT serializer cannot resolve playbook references
      and downstream job-template creation will fail with HTTP 400.

- name: "Set catalog project ID fact: {{ catalog_project.name }}"
  ansible.builtin.set_fact:
    awx_catalog_project_ids: "{{ awx_catalog_project_ids | combine({ catalog_project.name: _catalog_project_id }) }}"
