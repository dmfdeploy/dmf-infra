---
awx_integration_vault_path: "{{ inventory_dir }}/group_vars/all/vault.yml"
awx_integration_vault_password_file: "~/.vault_pass"
awx_integration_openbao_namespace: openbao
awx_integration_openbao_pod_label_selector: "app.kubernetes.io/name=openbao"
awx_integration_openbao_breakglass_file: "{{ eso_openbao_breakglass_file | default('', true) }}"
awx_integration_forgejo_runtime_secret_path: "{{ forgejo_runtime_secret_path | default('secret/apps/forgejo/runtime') }}"
awx_integration_netbox_runtime_secret_path: "{{ netbox_runtime_secret_path | default('secret/apps/netbox/runtime') }}"
awx_integration_runtime_secret_path: secret/apps/awx/runtime
awx_integration_awx_external_host: >-
  {{
    awx_host
    | default(
        (external_base_url | default('http://' ~ (metallb_vip | default('placeholder'))))
        | regex_replace('^https?://', '')
        | regex_replace('/.*$', ''),
        true
      )
  }}
awx_integration_awx_scheme: >-
  {{
    'https'
    if (external_base_url | default('https://' ~ awx_integration_awx_external_host)).startswith('https://')
    else 'http'
  }}
awx_integration_external_base_url: >-
  {{
    awx_integration_awx_scheme ~ '://' ~ awx_integration_awx_external_host
    if (awx_exposure | default('host')) == 'host'
    else (external_base_url | default('http://' ~ (metallb_vip | default('placeholder'))))
  }}
awx_integration_forgejo_host: >-
  {{
    forgejo_host
    | default(
        awx_integration_external_base_url
        | regex_replace('^https?://', '')
        | regex_replace('/.*$', ''),
        true
      )
  }}
awx_integration_forgejo_scheme: >-
  {{
    'https'
    if awx_integration_external_base_url.startswith('https://')
    else 'http'
  }}
awx_integration_forgejo_base_url: "{{ awx_integration_forgejo_scheme }}://{{ awx_integration_forgejo_host }}"

awx_integration_api_base: "{{ awx_integration_external_base_url ~ awx_integration_awx_path ~ '/api/v2' }}"
awx_integration_awx_path: >-
  {{ '' if (awx_exposure | default('host')) == 'host' else (awx_path | default('/awx')) }}
awx_integration_netbox_path: "/netbox"
awx_integration_netbox_namespace: "netbox"
awx_integration_forgejo_api_base: "{{ awx_integration_forgejo_base_url }}/api/v1"

# In-cluster Forgejo service URL for the SCM clones AWX performs. AWX's project
# syncs run in its EE pods (in-cluster), so cloning the ingress host
# (awx_integration_forgejo_base_url) needlessly goes out through Traefik and, on
# the local-CA lane, hits the untrusted ingress cert -> sync fails. The internal
# service serves git over plain HTTP on :3000 (no TLS, no ingress). Mirrors
# awx_integration_netbox_url, already an in-cluster svc URL.
# NOTE: api_base above intentionally stays on the ingress host — the configure
# play runs on the NODE, which resolves the ingress host (321 /etc/hosts) but
# not *.svc.cluster.local (nodes don't use cluster DNS).
awx_integration_forgejo_namespace: "{{ forgejo_namespace | default('forgejo') }}"
awx_integration_forgejo_internal_url: "http://forgejo-http.{{ awx_integration_forgejo_namespace }}.svc.cluster.local:3000"

# Match the AWX CR admin_user. Per ADR-0028 D3 / survey §3.2 the local AWX
# admin is decoupled from the bootstrap operator username: it is the canonical
# `awx-break-glass` (see roles/stack/operator/awx/defaults/main.yml). Never fall
# back to vault_bootstrap_admin_username — the operator identity must not leak
# into the app-local admin (ADR-0024/0028).
awx_integration_admin_user: "{{ awx_admin_user | default('awx-break-glass') }}"
awx_integration_admin_password: "{{ awx_admin_password | default(vault_awx_admin_password | default(vault_bootstrap_admin_password | mandatory)) }}"
awx_integration_read_admin_password_from_cluster: true
awx_integration_admin_password_secret_namespace: "{{ awx_namespace | default('awx') }}"
awx_integration_admin_password_secret_name: "{{ (awx_instance_name | default('awx')) ~ '-admin-password' }}"
awx_integration_org: "Default"

awx_integration_svc_user: "awx-svc"
awx_integration_svc_password: "{{ vault_awx_svc_password | default('') }}"
awx_integration_svc_token: "{{ vault_awx_svc_token | default('') }}"

awx_integration_project_name: "awx-automation"
awx_integration_project_branch: "main"
awx_integration_project_scm_url: >-
  {{ awx_integration_forgejo_internal_url ~ '/' ~ awx_integration_forgejo_user ~ '/' ~ awx_integration_project_name ~ '.git' }}
awx_integration_inventory_path: "inventory/netbox.yml"
awx_integration_collections_path: "collections/requirements.yml"

awx_integration_inventory_name: "NetBox Inventory"
awx_integration_inventory_source_name: "NetBox Inventory Source"
awx_integration_netbox_url: "{{ 'http://netbox.' ~ awx_integration_netbox_namespace ~ '.svc.cluster.local' }}"
awx_integration_netbox_token: >-
  {{ vault_netbox_awx_token | default(netbox_sot_awx_token_effective | default(''), true) }}
# ADR-0032: scoped catalog-writer token (ipam.service + extras.tag). Unlike the
# awx inventory token it is NOT surfaced by export-vars (absent from
# bootstrap-secrets.sh) — its sole source is the in-cluster OpenBao read of
# secret/apps/netbox/runtime (key netbox_catalog_token, minted by 691-netbox-sot).
# Defaulted empty so the source-token-read gating can detect "needs reading" and
# the catalog JT wiring always has a defined var.
awx_integration_netbox_catalog_token: "{{ vault_netbox_catalog_token | default('', true) }}"
# NetBox schema generation in v4.5.0 can take several minutes due to drf-spectacular
# filterset warnings. The 600s timeout covers this, and caching avoids re-fetching
# on subsequent syncs. See: docs/plans/AWX NetBox Inventory Sync Fix 2026-05-04.md
awx_integration_netbox_timeout: 600
awx_integration_netbox_cache: true
awx_integration_netbox_cache_timeout: 3600
awx_integration_api_wait_retries: 60
awx_integration_api_wait_delay: 10
awx_integration_auth_wait_retries: 60
awx_integration_auth_wait_delay: 10

awx_integration_forgejo_user: "forgejo-svc"
awx_integration_forgejo_token: >-
  {{ vault_forgejo_svc_token | default(forgejo_svc_token_effective | default(''), true) }}

# umbrella #316: the in-cluster Forgejo repos are pull-mirrors of GitHub on a
# ~1h interval, which races a pinned catalog project's re-pin right after a
# GitHub tag push (dmf-runbooks v0.4.2, 2026-07-29 — the mirror hadn't caught
# up yet and the project sync failed). catalog-project.yml triggers a
# mirror-sync and polls this budget for the pinned ref to actually appear
# before syncing the AWX project. 24 x 5s = 2 minutes.
awx_integration_forgejo_mirror_wait_retries: 24
awx_integration_forgejo_mirror_wait_delay: 5

# Phase 8 (ADR-0016): AWX SSH Machine credential path for control-node access.
# Placeholder default — every environment must override in its private
# inventory with the operator-local path to the private key file.
awx_control_node_ssh_privkey_path: "/mnt/secure/awx-control-node.privkey"

awx_integration_update_on_launch: true
awx_integration_overwrite: true
awx_integration_overwrite_vars: true
# AWX is served with the lab CA; callers may override per environment if
# they need to trust a different certificate chain.
awx_integration_validate_certs: false

awx_integration_sync_project: false
awx_integration_sync_inventory: false
awx_integration_debug: false

# Move 1 + Catalog: multi-project AWX layout (ADR-0014)
# Each entry: name, description, scm_url, roles_path fragment
awx_catalog_projects:
  - name: dmf-runbooks
    description: "Thin launcher playbooks for catalog entries"
    scm_url: "{{ awx_integration_forgejo_internal_url }}/{{ awx_integration_forgejo_user }}/dmf-runbooks.git"
    roles_path: "/var/lib/awx/projects/dmf-runbooks/roles"
    # umbrella #277: pin to the tagged release (dmf-runbooks#22), not
    # `main` — JT registrations (awx_catalog_job_templates below) are
    # audited against ONE specific playbook-contract snapshot; letting
    # the project float on main while the JTs are registration-frozen is
    # exactly the mechanism that let #277's drift (a WP3 var rename the
    # JTs never picked up) escape silently. Bump this tag deliberately,
    # in lock-step with the next JT contract audit — never let it drift
    # back to `main`.
    #
    # v0.4.0 -> v0.4.1 (umbrella #296): NO JT contract audit was required for
    # this bump. `git diff v0.4.0..v0.4.1` touches only VERSION,
    # roles/l3_run_guard/tasks/capacity.yml and the test harness — nothing
    # under playbooks/ or */defaults/, so every registered JT's
    # playbook/extra-vars contract is byte-identical. The fix is internal to
    # the L3 capacity gate: the chart-fetch block deleted its temp chart dir
    # before the topology group-render loop reused it, so every topology
    # launch failed the gate with `path ".../mxl-fabrics-demo" not found`
    # (live AWX job 288). Scalar launches were unaffected.
    #
    # v0.4.1 -> v0.4.2 (umbrella #306): delivers the media-switch-source
    # chart-argument fix (dmf-runbooks ef81caa) — PHASE 2's `helm upgrade`
    # was missing the positional CHART argument entirely, so every switch
    # ran whatever chart argv happened to fall into that slot rather than
    # the receiver's own installed chart; job 392 (2026-07-29) caught this
    # live, still running the old argv while this pin sat on v0.4.1. This
    # pin IS the delivery mechanism — the fix is inert until the project
    # advances past v0.4.1.
    # JT contract audit (required before this bump, per the note above):
    # `git diff v0.4.1..origin/main` (dmf-runbooks) touches
    # playbooks/switch-mxl-fabrics-demo.yml, roles/l3_run_guard/tasks/
    # _assert_reserved_vars.yml, a new roles/l3_run_guard/tasks/
    # switch_resolve_chart.yml, and the test harness — nothing under any
    # */defaults/ path. The playbook filename referenced by the
    # media-switch-source JT below (playbook: playbooks/switch-mxl-fabrics-
    # demo.yml) is unchanged, and that playbook's documented extra_vars
    # contract (topology_params/receiver_instance/source_instance/reason,
    # consumed VERBATIM from dmf-cms's ReconnectViaAwxActuator) is
    # untouched by the diff — only the task body past that header changed
    # (new switch_resolve_chart include + the helm argv fix). The new
    # _switch_* facts the fix introduces (_switch_chart_ref,
    # _switch_chart_name, _switch_helm_metadata, _switch_receiver_metadata,
    # _switch_receiver_chart_version, _switch_helm_upgrade_help,
    # _switch_rollback_flag, _switch_chart_tmp) are internal-only — added
    # to _assert_reserved_vars.yml's reserved list specifically so they
    # CANNOT be supplied as caller extra_vars, reinforcing rather than
    # expanding the JT-facing surface. The media-switch-source JT already
    # carries no JT-level extra_vars defaults by design (see its own
    # comment below) — nothing there needs to change. Conclusion: JT
    # contract intact, re-pin is a pure delivery-mechanism bump.
    #
    # v0.4.2 -> v0.4.3 (umbrella #306): switch play replaces the
    # helm-as-oracle wait with direct state verification.
    scm_branch: "v0.4.3"
  - name: dmf-media
    description: "Media function roles and playbooks (Layer 4-5)"
    scm_url: "{{ awx_integration_forgejo_internal_url }}/{{ awx_integration_forgejo_user }}/dmf-media.git"
    roles_path: "/var/lib/awx/projects/dmf-media/roles"
  - name: dmf-infra
    description: "Infrastructure roles and playbooks (Layer 1-3, 6)"
    scm_url: "{{ awx_integration_forgejo_internal_url }}/{{ awx_integration_forgejo_user }}/dmf-infra.git"
    roles_path: "/var/lib/awx/projects/dmf-infra/k3s-lab-bootstrap/roles"

# Move 1 + Catalog: AWX job templates for catalog entries (ADR-0014)
# Each entry maps to a thin launcher in dmf-runbooks/playbooks/.
# The dmf-runbooks project must exist before these are created.
#
# umbrella #202 WP3 R3c (codex round-2 P1-9 infra half, ADR-0032): every
# media-* entry below carries ONLY netbox_api_url + vault_netbox_catalog_token
# — vault_netbox_api_token (the admin token) was swept out of all 8
# launch/finalise entries (media-rollback-run already never carried it,
# R2c). The catalog lane is scoped-writer-only end to end now; grep this
# file for "vault_netbox_api_token" to confirm it appears nowhere in
# awx_catalog_job_templates.
#
# umbrella #277 audit (2026-07-24, release-alignment PR): every entry below
# re-verified against its target playbook's ACTUAL var contract in
# dmf-runbooks origin/main — #277's live incident (job 165) was exactly a
# JT registration drifted silently out of step with a WP3-era playbook
# rename. Findings: media-launch-nmos-cpp/-crosspoint were pinning chart
# version via a var name (nmos_cpp_chart_version/crosspoint_chart_version)
# neither playbook has read since the WP3 R6a single-source rename to
# l3_chart_version — both fixed (renamed the extra_vars KEY, not the
# awx-integration var it reads from). media-launch-mxl-videotestsrc/
# -videotest-view were passing the dead mxl_release alias instead of
# l3_release/l3_catalog_key — the view entry's version of this was #277's
# actual live bug (identity silently fell back to the source release's
# default). The four finalise/teardown entries + media-rollback-run were
# independently confirmed ALREADY CORRECT (teardown-*.yml never defines
# l3_release/l3_catalog_key in its own scope, so mxl_release/
# nmos_namespace-with-a-hardcoded-release-name are the actually-live vars
# there — see the mxl finalise entries' own comments for why "fixing" them
# to l3_release would be wrong, not right).
awx_catalog_job_templates:
  - name: media-launch-nmos-cpp
    description: "Launch NMOS IS-04/05 registry + mock nodes (configure stage)"
    playbook: "playbooks/launch-nmos-cpp.yml"
    project_name: "dmf-runbooks"
    extra_vars:
      netbox_api_url: "{{ awx_integration_netbox_url }}"
      # ADR-0032: the launcher writes NetBox via this scoped catalog-writer
      # token (ipam.service + extras.tag), NOT the superuser admin token.
      vault_netbox_catalog_token: "{{ awx_integration_netbox_catalog_token | default(vault_netbox_catalog_token | default(''), true) }}"
      # Pin the chart version the launcher pulls from Zot (overrides the
      # launcher's hardcoded default, which lags behind chart bumps without a
      # Forgejo republish). 0.1.2 adds the registry query-ws :81 Service port.
      # umbrella #277: the WP3 R6a single-source rename means
      # launch-nmos-cpp.yml's OWN var is l3_chart_version, not
      # nmos_cpp_chart_version — this JT used to pass the latter, which the
      # playbook never reads at all (a silently inert extra_var; every
      # launch actually installed the playbook's own hardcoded default
      # regardless). Verified against dmf-runbooks origin/main.
      l3_chart_version: "{{ nmos_cpp_chart_version }}"
  - name: media-finalise-nmos-cpp
    description: "Teardown NMOS workloads (finalise stage)"
    playbook: "playbooks/teardown-nmos-cpp.yml"
    project_name: "dmf-runbooks"
    extra_vars:
      netbox_api_url: "{{ awx_integration_netbox_url }}"
      # ADR-0032: scoped catalog-writer token (see media-launch-nmos-cpp).
      vault_netbox_catalog_token: "{{ awx_integration_netbox_catalog_token | default(vault_netbox_catalog_token | default(''), true) }}"
  - name: media-launch-nmos-crosspoint
    description: "Launch NMOS Crosspoint routing UI (configure stage)"
    playbook: "playbooks/launch-nmos-crosspoint.yml"
    project_name: "dmf-runbooks"
    extra_vars:
      netbox_api_url: "{{ awx_integration_netbox_url }}"
      # ADR-0032: scoped catalog-writer token (see media-launch-nmos-cpp).
      vault_netbox_catalog_token: "{{ awx_integration_netbox_catalog_token | default(vault_netbox_catalog_token | default(''), true) }}"
      # Crosspoint admin password (OpenBao-sourced). The launcher hashes it to
      # SHA256 for users.json; the plaintext never reaches the chart or git.
      vault_nmos_crosspoint_admin_password: "{{ vault_nmos_crosspoint_admin_password | default('', true) }}"
      # Env-specific IngressRoute host (websecure/Traefik, same lane as the
      # console). Stamped from the env base domain; the launcher default is the
      # example-domain placeholder. See dmfdeploy/dmfdeploy#108 follow-up.
      crosspoint_ingress_host: "crosspoint.{{ cert_manager_cluster_domain | default('dmf.example.com') }}"
      # Pin the chart version the launcher pulls from Zot (overrides the
      # launcher's hardcoded default, which lags chart bumps without a Forgejo
      # republish). 0.1.1 carries the wss mixed-content fix (image + chart).
      # umbrella #277: same drift class as media-launch-nmos-cpp — the
      # playbook's own var is l3_chart_version (WP3 R6a rename), not
      # crosspoint_chart_version, which launch-nmos-crosspoint.yml never
      # reads at all. Verified against dmf-runbooks origin/main.
      l3_chart_version: "{{ nmos_crosspoint_chart_version }}"
  - name: media-finalise-nmos-crosspoint
    description: "Teardown NMOS Crosspoint (finalise stage)"
    playbook: "playbooks/teardown-nmos-crosspoint.yml"
    project_name: "dmf-runbooks"
    extra_vars:
      netbox_api_url: "{{ awx_integration_netbox_url }}"
      # ADR-0032: scoped catalog-writer token (see media-launch-nmos-cpp).
      vault_netbox_catalog_token: "{{ awx_integration_netbox_catalog_token | default(vault_netbox_catalog_token | default(''), true) }}"
  - name: media-launch-mxl-videotestsrc
    description: "Launch MXL test-pattern source (configure stage)"
    playbook: "playbooks/launch-mxl-fabrics-demo.yml"
    project_name: "dmf-runbooks"
    extra_vars:
      mxl_role: source
      # umbrella #277: WP3 R6a single-sourced identity to l3_release/
      # l3_catalog_key — launch-mxl-fabrics-demo.yml's own mxl_release is
      # now a COSMETIC alias derived FROM l3_release (mxl_release: "{{
      # l3_release }}" in the playbook's own vars:), so an extra_var here
      # named mxl_release would silently do nothing for identity (it has
      # NO effect on which release/NetBox record actually gets mutated —
      # verified against dmf-runbooks origin/main + its own R6b comment).
      # This was the live #277 bug for the SIBLING view JT below (identity
      # fell back to this playbook's own default, mxl-videotestsrc, while
      # mxl_role=view applied — an in-place role flip of the wrong
      # release); this source JT only ever "worked" because its intended
      # values happened to coincide with the playbook's defaults.
      l3_release: mxl-videotestsrc
      l3_catalog_key: mxl-videotestsrc
      # Chart version pin (umbrella #258/dmf-media#19 measured calibration
      # — mirrors nmos_cpp_chart_version's own pin/rationale above).
      # 0.4.0 -> 0.4.1: umbrella #301 / dmf-media#24 removes CPU limits from
      # the media path (memory limits unchanged). NOTE: this is the mxl
      # HELM CHART pin — NOT scm_branch (~line 160), which is the dmf-runbooks
      # project pin and coincidentally ALSO reads v0.4.1. Bumping the wrong
      # one is silent.
      # 0.4.1 -> 0.4.2: umbrella #308 / dmf-media#26, the pacing-fix chart.
      l3_chart_version: "0.4.2"
      mxl_interface: eth0
      # Profile-derived (dmfdeploy/dmfdeploy#17): colocated pod-network pair
      # on the single-node profile; the original cross-host hostNetwork shape
      # everywhere else. Override awx_integration_mxl_placement_mode to force.
      mxl_placement_mode: "{{ awx_integration_mxl_placement_mode | default('single-node' if (dmf_release_profile | default('')) == 'sandbox-single-node' else 'split-node', true) }}"
      # roles/mxl stamps the NetBox catalog record (ADR-0037/0038) — same
      # credential plumbing as the NMOS catalog JTs.
      netbox_api_url: "{{ awx_integration_netbox_url }}"
      # ADR-0032: scoped catalog-writer token (see media-launch-nmos-cpp).
      vault_netbox_catalog_token: "{{ awx_integration_netbox_catalog_token | default(vault_netbox_catalog_token | default(''), true) }}"
  - name: media-finalise-mxl-videotestsrc
    description: "Teardown MXL test-pattern source (finalise stage)"
    playbook: "playbooks/teardown-mxl-fabrics-demo.yml"
    project_name: "dmf-runbooks"
    extra_vars:
      # umbrella #277 audit: UNLIKE the launch entries above, mxl_release
      # IS the live, load-bearing identity var here — teardown-mxl-
      # fabrics-demo.yml never defines l3_release/l3_catalog_key in its
      # own scope, so roles/mxl's netbox_service_name/cluster_service
      # fall back to mxl_function_key/mxl_release (undefined l3_* ->
      # default fallback) exactly as intended. Verified against
      # dmf-runbooks origin/main — do NOT "fix" this to l3_release by
      # analogy with the launch entries; that would leave this var
      # correctly-named for a var the playbook doesn't read at this
      # entry point at all.
      mxl_release: mxl-videotestsrc
      netbox_api_url: "{{ awx_integration_netbox_url }}"
      vault_netbox_catalog_token: "{{ awx_integration_netbox_catalog_token | default(vault_netbox_catalog_token | default(''), true) }}"
  - name: media-launch-mxl-videotest-view
    description: "Launch MXL test-pattern viewer (configure stage)"
    playbook: "playbooks/launch-mxl-fabrics-demo.yml"
    project_name: "dmf-runbooks"
    extra_vars:
      mxl_role: view
      # umbrella #277 THE BUG: this JT used to pass mxl_release (a dead
      # cosmetic alias here, see media-launch-mxl-videotestsrc's own
      # comment) and nothing else for identity — l3_release/l3_catalog_key
      # were never set, so they fell back to the playbook's own DEFAULT
      # (mxl-videotestsrc, the SOURCE release) while mxl_role=view still
      # applied — live incident, job 165: launching this JT replaced the
      # running SOURCE release with role=view in place. Fixed the same way
      # as the source JT: explicit l3_release/l3_catalog_key here.
      l3_release: mxl-videotest-view
      l3_catalog_key: mxl-videotest-view
      # Keep in lock-step with the source JT's pin above (0.4.0 -> 0.4.1,
      # umbrella #301 / dmf-media#24 — CPU limits removed from the media path).
      # Again: the mxl HELM CHART pin, not scm_branch (~line 160).
      # 0.4.1 -> 0.4.2, umbrella #308 / dmf-media#26 — pacing fix.
      l3_chart_version: "0.4.2"
      mxl_interface: eth0
      # Keep in lock-step with media-launch-mxl-videotestsrc above.
      mxl_placement_mode: "{{ awx_integration_mxl_placement_mode | default('single-node' if (dmf_release_profile | default('')) == 'sandbox-single-node' else 'split-node', true) }}"
      netbox_api_url: "{{ awx_integration_netbox_url }}"
      vault_netbox_catalog_token: "{{ awx_integration_netbox_catalog_token | default(vault_netbox_catalog_token | default(''), true) }}"
  - name: media-finalise-mxl-videotest-view
    description: "Teardown MXL test-pattern viewer (finalise stage)"
    playbook: "playbooks/teardown-mxl-fabrics-demo.yml"
    project_name: "dmf-runbooks"
    extra_vars:
      # umbrella #277 audit: live/load-bearing here — see
      # media-finalise-mxl-videotestsrc's own comment above.
      mxl_release: mxl-videotest-view
      netbox_api_url: "{{ awx_integration_netbox_url }}"
      vault_netbox_catalog_token: "{{ awx_integration_netbox_catalog_token | default(vault_netbox_catalog_token | default(''), true) }}"
  - name: media-rollback-run
    description: "L3 rollback: return a failed run's surfaces to pre-run state (umbrella #202)"
    playbook: "playbooks/rollback-run.yml"
    project_name: "dmf-runbooks"
    extra_vars:
      netbox_api_url: "{{ awx_integration_netbox_url }}"
      # umbrella #202 WP3 R2c (codex round-1 P1-10): vault_netbox_api_token
      # (the admin token) is DELIBERATELY OMITTED here — a rollback never
      # carries the admin token, only the scoped catalog-writer token
      # (ADR-0032). dmf-runbooks' own defaults/main.yml (R2c-runbooks)
      # correspondingly drops its prior fallback from the catalog token to
      # this one: an absent scoped token now fails closed (a hard assert in
      # l3_run_guard's preflight.yml), rather than silently upgrading to
      # the admin token.
      vault_netbox_catalog_token: "{{ awx_integration_netbox_catalog_token | default(vault_netbox_catalog_token | default(''), true) }}"
      # No l3_run_id / l3_rollback_reason default here — deliberately absent.
      # Both are per-invocation, caller-supplied identity (l3_run_guard's
      # rollback_identity.yml asserts them required + hex32/non-empty); a
      # static default would let a blank launch silently target the wrong
      # run or fabricate a reason.
  - name: media-switch-source
    description: "Reconfigure a viewer's active source (coarse reconnect actuator, umbrella #201 WP4b, spec §6.2 quiesce -> re-point -> select)"
    playbook: "playbooks/switch-mxl-fabrics-demo.yml"
    project_name: "dmf-runbooks"
    # No JT-level extra_vars defaults, deliberately: unlike every other
    # entry above, this playbook touches NEITHER NetBox NOR a fresh Helm
    # install (see its own header) — netbox_api_url/vault_netbox_catalog_token
    # would be dead, unread extra_vars here (the #277 audit's own lesson:
    # never pass a var the target playbook's actual contract doesn't read
    # — verified against dmf-runbooks origin/main). Every value this
    # playbook DOES need (topology_params/receiver_instance/
    # source_instance/reason) is per-request, supplied by dmf-cms's own
    # ReconnectViaAwxActuator at launch time (src/dmf_cms/switch_source.py's
    # own "EXTRA_VARS PAYLOAD CONTRACT") — ask_variables_on_launch (force-set
    # true for every entry in this list, see tasks/main.yml) is what lets
    # those actually reach the job.

# ── Infra job templates (dmfdeploy/dmfdeploy#166 WP-F) ─────────────────────
# Monitoring-apply lane: runs dmf-infra playbooks against hosts:k3s_control
# over SSH — the same execution model as eso-openbao-health-check, NOT the
# media catalog lane. These JTs therefore use AWX's default execution queue
# plus the awx-control-node-ssh Machine credential; they must NEVER get the
# dmf-catalog-cg Container Group, whose pod spec pins jobs to the nmos
# namespace/launcher ServiceAccount (media catalog plumbing only).
# Playbook paths are repo-root-relative for the dmf-infra project (its
# roles_path points into k3s-lab-bootstrap/, unlike dmf-runbooks).
# The prometheus role asserts the env-specific Alertmanager receiver URLs
# (ntfy/watchdog) at run time; they are intentionally not stamped here —
# ask_variables_on_launch lets the operator supply them per launch.
# On constrained sandbox envs prefer bin/run-playbook.sh (no AWX wake cost,
# dmfdeploy#106); these JTs are the committed GitOps lane for full envs.
awx_infra_job_templates:
  - name: monitoring-apply-prometheus
    description: "Apply prometheus role — rules-as-code, are-we-ok suite (dmfdeploy#166)"
    playbook: "k3s-lab-bootstrap/playbooks/vertical-monitoring/100-prometheus.yml"
    project_name: "dmf-infra"
    ask_variables_on_launch: true
  - name: monitoring-apply-grafana
    description: "Apply grafana role — dashboards + providers (dmfdeploy#166)"
    playbook: "k3s-lab-bootstrap/playbooks/vertical-monitoring/120-grafana.yml"
    project_name: "dmf-infra"
    ask_variables_on_launch: true
  - name: monitoring-apply-blackbox
    description: "Apply blackbox-exporter role — probe modules (dmfdeploy#166)"
    playbook: "k3s-lab-bootstrap/playbooks/vertical-monitoring/150-blackbox.yml"
    project_name: "dmf-infra"
    ask_variables_on_launch: true

# ── Shared DMF AWX Execution Environment + Container Group (ADR-0025) ──────
# Per ADR-0025 §8.7(b), media catalog launchers run as AWX EE pods in the
# target namespace through a dedicated Container Group. The Container Group
# overrides pod metadata.namespace to `nmos` and uses the `nmos-cpp-launcher`
# ServiceAccount created by awx-integration tasks.
awx_dmf_catalog_cg_display_name: "DMF Catalog Container Group"

# Single-node facility: one catalog lifecycle job at a time on the
# dmf-catalog-cg queue (umbrella #254; console-side lock is dmf-cms#40,
# this is the AWX-layer backstop). InstanceGroup API field — cannot be
# set via operator extra_settings (see awx-instance.yml.j2 note).
awx_dmf_catalog_cg_max_concurrent_jobs: 1

# These are the EE job pod's scheduling claims on the single constrained
# node — the L3 capacity preflight (umbrella dmfdeploy/dmfdeploy#202 WP0)
# reads them as its ee_reserve; absent/zero requests would make the
# preflight fall back to a blind configured floor (L3 plan §3.2(b)).
# Requests only, no limits. The pre-apply assert in tasks/main.yml only
# accepts whole millicores >= 100m for CPU, and binary Mi >= 256Mi or
# Gi >= 1Gi for memory (narrower than what Kubernetes itself allows — a
# deliberate typo backstop, see the assert's fail_msg).
awx_dmf_catalog_ee_cpu_request: "250m"
awx_dmf_catalog_ee_memory_request: "512Mi"

# The catalog launchers (media-* JTs above) run inside a custom AWX EE pod
# pulled from cluster-internal Zot. Source of truth: ghcr.io/dmfdeploy/awx-ee,
# mirrored to Zot by playbooks/630-zot-seed-platform.yml.
#
# These vars are referenced by:
#   - playbooks/630-zot-seed-platform.yml (pull from GHCR, push to Zot)
#   - awx-integration tasks: register the EE in AWX via
#     /api/v2/execution_environments/ and pin it on each catalog JT via
#     instance_groups + execution_environment fields.
#
# To bump: republish a new GHCR tag (see ../../../../ee/README.md), then
# update awx_ee_catalog_tag here and re-run 630-zot-seed-platform.yml + 693.
awx_ee_catalog_image: "zot.zot.svc.cluster.local:5000/dmf/awx-ee"
awx_ee_catalog_tag: "0.1.1"
awx_ee_catalog_display_name: "DMF AWX EE"
awx_ee_catalog_description: "Shared Ansible EE for DMF Platform catalog launchers (ADR-0025)"

