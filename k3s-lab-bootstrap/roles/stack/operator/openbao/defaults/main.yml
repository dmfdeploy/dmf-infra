---
# OpenBao namespace
openbao_namespace: openbao

# Image (latest stable; bump as needed)
openbao_image: "openbao/openbao:2.5.2"

# Storage
openbao_storage_class: "{{ dmf_storage_class | default('longhorn') }}"
openbao_storage_size: 5Gi

# Replica count. This is a site property: set it in the site inventory.
#   1  A single OpenBao pod. Supported in the sandbox lane only (ADR-0029, the
#      tiered unseal posture). A restart of the pod takes OpenBao offline
#      until it is unsealed, and the pod has no peer to take over. The visible
#      warning that a single-pod site should show is not built yet.
#   3  A Raft cluster. Long-lived sites set 3. HA keeps OpenBao serving while
#      one pod restarts. It does not remove the unseal: a restarted pod is
#      sealed and needs the threshold of shares before the next pod restarts.
# A higher count is also a Raft cluster. 0 and 2 are refused: a Raft cluster of two
# pods cannot lose a pod.
# To grow an installed single-replica site, run
# playbooks/vertical-security/104-openbao-grow-ha.yml. Do not only change this
# value: the StatefulSet's governing Service cannot change in place.
openbao_replicas: 1

# Headless Service that gives every pod a stable DNS name for Raft peer traffic
# (openbao-N.<name>.<namespace>.svc). Used only when openbao_replicas > 1. The
# TLS certificate must cover it: roles/base/cert-manager (cert_manager_openbao_*).
# The cert-manager role reads this same name, with the same default, to build the
# certificate's peer names. The two defaults must stay equal.
openbao_headless_service_name: openbao-internal

# Raft storage config. With one replica this is the node ID. With more than one,
# it is the node ID of pod 0 only: a single-replica install already stores this
# ID in its Raft data. The other pods use their pod name.
openbao_raft_node_id: "1"

# Data directory of the pod: the volume mount, and the path of the raft storage
# stanza. Raft keeps its files in the raft/ directory under it.
openbao_data_path: /openbao/data

# Resources. umbrella dmfdeploy/dmfdeploy#258 platform request-budget audit
# (2026-07-24, data-backed, requests only): measured avg 5m CPU on
# <env> — the 100m request was ~20x the observed average. Trimmed to
# 25m (still 5x the measured avg). Memory request + both limits untouched.
openbao_resources:
  requests:
    cpu: 25m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Networking — cluster-internal only for now
openbao_service_port: 8200
openbao_service_name: openbao

# TLS — cert-manager-issued self-signed cert for internal service DNS and
# loopback access. The secret is created in the openbao namespace and mounted
# into the OpenBao pod.
openbao_tls_secret_name: openbao-tls

# Shamir init
# Number of key shares and threshold. Default: 5 shares, threshold 3.
openbao_shamir_shares: 5
openbao_shamir_threshold: 3
openbao_key_path: /tmp/openbao-keys  # where init keys are written locally
openbao_breakglass_dir: "{{ openbao_key_path | dirname }}"

# Distribute Shamir shares to operator-side break-glass custody (JuiceFS
# shares 1+2, macOS Keychain share 3, USB OPENBAO_A shares 4+5) and assert
# those mounts on a fresh init. True preserves the lab/cloud break-glass model.
# Sandbox / Tier-3 self-recovering profiles (ADR-0031 O4) set this false: no
# JuiceFS/Keychain/USB dependency, shares=1/threshold=1, and the fresh-init
# automation file ({{ openbao_key_path }}.json) is the only key custody —
# written locally (e.g. under ~/.secure).
openbao_breakglass_distribution_enabled: true

# macOS Keychain service that holds share 3 of the 5-share Shamir set.
# Per-environment so multi-env operators don't silently overwrite each
# other's share 3 on init. Default preserves the historical hetzner-arm name.
openbao_keychain_share3_service: openbao-breakglass-share-3

# Directory on the OPENBAO_A USB stick where shares 4 and 5 are written.
# Per-environment so multi-env operators don't silently overwrite each
# other's USB shares 4+5 on init. Default preserves the historical flat
# hetzner-arm layout (USB root). New envs should override to a subdirectory
# (e.g. /Volumes/OPENBAO_A/<env>) and the role will create it before writing.
openbao_usb_dir: /Volumes/OPENBAO_A

# Mount point of the JuiceFS share that holds Shamir shares 1+2 on the
# operator workstation. The role asserts this path is mounted before
# writing share material. Per-environment because each environment has
# its own operator workstation layout. Must be overridden in the private
# inventory (the placeholder default deliberately won't exist).
openbao_juicefs_mount_path: /mnt/secure

# Engines to enable after init
openbao_engines:
  - approle
  - kubernetes
  - userpass
  - pki
  - kv-v2

# ESO AppRole — the role ESO will use to authenticate
openbao_eso_role_name: external-secrets

# born-inventory AppRole — narrow read-only access to the NetBox runtime
# secret. This replaces direct root-token reads in the born-inventory role.
openbao_born_inventory_role_name: born-inventory-netbox-reader
openbao_born_inventory_policy_name: born-inventory-netbox-runtime-reader
openbao_born_inventory_token_ttl: "1h"
openbao_born_inventory_token_max_ttl: "4h"

# PKI config
openbao_pki_path: pki
openbao_pki_max_lease_ttl: "87600h"  # 10 years for root CA

# OpenBao URL for API calls (cluster-internal service DNS)
openbao_internal_url: "https://{{ openbao_service_name }}.{{ openbao_namespace }}.svc.cluster.local:{{ openbao_service_port }}"

# Self-signed cert is trusted via the mounted CA bundle, so do not skip verify.
openbao_skip_tls_verify: false

# Root token — will be disposed after bootstrap
# Root token disposal — set true after bootstrap is complete and app-admin
# secrets have been written. Once set to true, the root token cannot be used
# again for app-admin-facts writes.
openbao_dispose_root_token: true

# Operator userpass retrieval path (Phase 5)
# Human identity for pulling per-app admin credentials and writing the
# app runtime secrets that this repo manages. Password is generated once and
# persisted to {{ openbao_key_path }}.json alongside the Shamir material.
openbao_operator_username: ops-admin
openbao_operator_policy_name: app-admin-writer
openbao_operator_reader_policy_name: app-admin-reader
openbao_operator_runtime_policy_name: app-runtime-writer
openbao_eso_policy_name: eso-reader
openbao_operator_password_length: 32

# Policy reconciliation identity (Phase 5b)
# Separate identity with narrow sys/policies/acl/* permissions for reapplying
# policy-as-code on reruns without the root token.
openbao_policy_reconciler_username: policy-reconciler
openbao_policy_writer_policy_name: policy-writer
openbao_policy_reconciler_password_length: 32

# AppRole reconciliation identity (ADR-0021)
# Dedicated bootstrap-only identity for object-storage AppRole and ESO binding
# reconciliation. Must not write ACL policies or read app secret data.
openbao_approle_reconciler_username: approle-reconciler
openbao_approle_reconciler_policy_name: approle-reconciler-writer
openbao_approle_reconciler_password_length: 32

# Object-storage logicals scoped to approle-reconciler. Keep this intentionally
# local to the OpenBao role — if new logicals are added later, update this list
# and object-storage-credentials together, or promote the list to inventory.
openbao_approle_reconciler_object_storage_logicals:
  - openbao_snapshots
  - app_backups

# Setup-only SecretID issuer (dmfdeploy/dmfdeploy#11, plan step A.2).
# A Kubernetes-auth identity that mints one-use, one-hour SecretIDs for the
# born-inventory AppRole. It is not the periodic rotator. The names and the
# audience are choices of this repo: the plan fixes only the namespace.
openbao_setup_issuer_service_account: setup-issuer
openbao_setup_issuer_k8s_role: setup-issuer
openbao_setup_issuer_policy_name: setup-issuer
openbao_setup_issuer_audience: openbao
openbao_setup_issuer_token_ttl: 5m
openbao_setup_issuer_token_max_ttl: 10m

# Receipt and claim namespace. dmf-infra creates it and grants the executor
# identity. The executor is a ServiceAccount here so that RBAC can bind it:
# `get` on ConfigMaps, `create` and `get` on Leases, and no ConfigMap create.
openbao_setup_requests_namespace: dmf-setup-requests
openbao_setup_executor_service_account: setup-request-executor
# The role id is not a secret. This role publishes it here, on a fresh install
# and on a rerun, for the receipt-driven 694 path to read.
openbao_born_inventory_role_id_configmap: born-inventory-approle

# Rolling-restart guard (tasks/ha-guard.yml). Before a restart the guard checks
# that every pod is unsealed and, on a cluster, that Autopilot shows every
# expected pod as a healthy voter and the cluster has a failure tolerance of at
# least 1. If it cannot read that state, it refuses.
# The token is an ops-admin token. The app-admin-writer policy grants ops-admin
# read on sys/storage/raft/autopilot/state and sys/storage/raft/configuration.
# Pass the token in the environment of the play (OPENBAO_GUARD_TOKEN).
# openbao_guard_require_peers can be false only when openbao_replicas is 1.
openbao_guard_require_peers: true
openbao_guard_token: "{{ lookup('ansible.builtin.env', 'OPENBAO_GUARD_TOKEN') }}"

# Limit on a voter's last contact with the leader, in seconds. Autopilot's own
# threshold is 10 s.
openbao_guard_max_last_contact_seconds: 10

# After a fresh install or the migration adds voters, Autopilot promotes each new
# server after a stabilization period. Wait for the cluster to be healthy for up
# to this long, checking at this interval, before the play fails.
openbao_guard_wait_timeout_seconds: 300
openbao_guard_wait_interval_seconds: 10

# The grow-HA play reissues the OpenBao certificate, then waits for the TLS secret
# to hold a certificate that covers the Raft peers: at most this many reads, with
# this many seconds between them.
openbao_grow_cert_wait_retries: 60
openbao_grow_cert_wait_delay: 5

# Paths (under the secret/ mount) that the migration reads before and after, by
# metadata only. ops-admin can read the metadata of these paths (the
# app-admin-writer policy). Add the paths that matter at the site.
openbao_migration_read_paths:
  - apps/zot/admin
  - apps/authentik/breakglass
  - apps/authentik/bootstrap-passkey
  - apps/awx/control_node_ssh

# OpenBao ends a request after this many seconds. The config sets it on every
# listener (max_request_duration) and as the server-wide default
# (default_max_request_duration). The rotation engine counts on a bound that is
# no longer than its request timeout, and the rotation playbook refuses to run
# when a listener allows more. OpenBao reads the value at start, so restart the
# pods after a change: the playbook also refuses to run until every OpenBao
# container has started after the last update of the config.
openbao_max_request_duration_seconds: 60

# Rotation scheduler: runs the AppRole rotation transaction (see
# playbooks/vertical-orchestration/115-approle-rotation.yml). Its OpenBao
# policy is rendered from the registry into files/policies/rotation-scheduler.hcl.
# The audience is a choice of this repo. The Lease is named by the engine
# (rotation.LEASE_NAME) and lives in the OpenBao namespace.
# The login token is short-lived, and one run takes a few minutes at most.
openbao_rotation_scheduler_service_account: approle-rotation-scheduler
openbao_rotation_scheduler_k8s_role: approle-rotation-scheduler
openbao_rotation_scheduler_policy_name: approle-rotation-scheduler
openbao_rotation_scheduler_audience: openbao
openbao_rotation_scheduler_token_ttl: 20m
openbao_rotation_scheduler_token_max_ttl: 30m
