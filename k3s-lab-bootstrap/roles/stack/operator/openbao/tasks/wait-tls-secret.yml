---
# The secret can hold an older certificate while cert-manager reissues from the
# CA Issuer. A self-signed certificate from before the move can already hold a
# ca.crt that equals itself, so a ca.crt that is present proves nothing: wait for
# the secret that the CA Issuer issued, and for a ca.crt that is not the
# certificate itself.
- name: Wait for the OpenBao TLS secret that the CA issued
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Secret
    name: "{{ openbao_tls_secret_name }}"
    namespace: "{{ openbao_namespace }}"
  register: openbao_tls_secret
  until:
    - openbao_tls_secret.resources | length > 0
    - openbao_tls_secret.resources[0].data['tls.crt'] is defined
    - openbao_tls_secret.resources[0].data['tls.key'] is defined
    - openbao_tls_secret.resources[0].data['ca.crt'] is defined
    - openbao_tls_secret.resources[0].data['ca.crt'] != openbao_tls_secret.resources[0].data['tls.crt']
    - (openbao_tls_secret.resources[0].metadata.annotations | default({}))['cert-manager.io/issuer-name'] | default('') == openbao_tls_issuer_name
  retries: "{{ openbao_tls_secret_wait_retries }}"
  delay: "{{ openbao_tls_secret_wait_delay }}"
  no_log: true
