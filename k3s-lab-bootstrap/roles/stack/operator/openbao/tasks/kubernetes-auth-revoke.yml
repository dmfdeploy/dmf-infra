---
# Revoke one token of a play that trades a root token for a short-lived one, then
# prove that the server refuses it. Included by main.yml for the init token of a fresh install and by the rescue of playbooks/vertical-security/100-openbao.yml,
# each for the root token that is traded and for the short-lived write token. The caller sets
# openbao_namespace, openbao_pod, openbao_k8s_revoke_token and
# openbao_k8s_revoke_flag (the name of the fact that this file sets).
# The flag is true when the revoke worked and the server refuses the token with a
# 403. This file never fails: the caller decides what a token that stays
# valid means. The shared role sends the token to the pod on stdin only.

- name: Revoke the token
  ansible.builtin.include_role:
    name: common/openbao-cli
  vars:
    openbao_cli_operation: revoke the token
    openbao_cli_pod: "{{ openbao_pod }}"
    openbao_cli_namespace: "{{ openbao_namespace }}"
    openbao_cli_token: "{{ openbao_k8s_revoke_token }}"
    openbao_cli_calls:
      - args: [token, revoke, -self]
    openbao_cli_register: _openbao_k8s_revoke
    openbao_cli_allow_failure: true
    openbao_cli_changed: true
    openbao_cli_retries: 3
    openbao_cli_delay: 2
    openbao_cli_until: "{{ openbao_cli_run.rc == 0 }}"

- name: Prove the server refuses the revoked token
  ansible.builtin.include_role:
    name: common/openbao-cli
  vars:
    openbao_cli_operation: look up the revoked token
    openbao_cli_pod: "{{ openbao_pod }}"
    openbao_cli_namespace: "{{ openbao_namespace }}"
    openbao_cli_token: "{{ openbao_k8s_revoke_token }}"
    openbao_cli_calls:
      - args: [token, lookup, -format=json]
    openbao_cli_register: _openbao_k8s_after_revoke
    openbao_cli_allow_failure: true

# Only the server's refusal proves the revoke: the CLI reports OpenBao's answer as
# "Code: 403" with "permission denied". A lookup that fails for another reason, such as
# a lost connection, a missing pod or a local permission error, proves nothing, so the
# flag stays false.
- name: Record whether the token is gone
  ansible.builtin.set_fact:
    "{{ openbao_k8s_revoke_flag }}": >-
      {{ _openbao_k8s_revoke.rc | default(1) == 0
         and _openbao_k8s_after_revoke.rc | default(0) != 0
         and 'Code: 403' in (_openbao_k8s_after_revoke.stderr | default(''))
         and 'permission denied' in (_openbao_k8s_after_revoke.stderr | default('')) }}
