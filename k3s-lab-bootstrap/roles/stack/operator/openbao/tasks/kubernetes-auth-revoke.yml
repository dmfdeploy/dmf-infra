---
# Revoke one token of a play that trades a generate-root token for a short-lived
# one, then prove that the server refuses it. Included by kubernetes-auth-existing.yml
# and by playbooks/vertical-orchestration/120-ops-admin-rotation.yml, each for the
# generate-root token and for the short-lived write token. The caller sets
# openbao_namespace, openbao_pod, openbao_k8s_revoke_token and
# openbao_k8s_revoke_flag (the name of the fact that this file sets).
# The flag is true when the revoke worked and the server refuses the token with a
# 403. This file never fails: the caller decides what a token that stays
# valid means. The token goes to the pod on stdin only.

- name: Revoke the token
  ansible.builtin.shell:
    cmd: >-
      kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
      -n {{ openbao_namespace }}
      exec -i {{ openbao_pod }}
      -- sh -c '
      IFS= read -r BAO_TOKEN;
      export BAO_TOKEN;
      bao token revoke -self'
    stdin: "{{ openbao_k8s_revoke_token }}\n"
  register: _openbao_k8s_revoke
  changed_when: _openbao_k8s_revoke.rc == 0
  failed_when: false
  retries: 3
  delay: 2
  until: _openbao_k8s_revoke.rc == 0
  no_log: true

- name: Prove the server refuses the revoked token
  ansible.builtin.shell:
    cmd: >-
      kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
      -n {{ openbao_namespace }}
      exec -i {{ openbao_pod }}
      -- sh -c '
      IFS= read -r BAO_TOKEN;
      export BAO_TOKEN;
      bao token lookup -format=json'
    stdin: "{{ openbao_k8s_revoke_token }}\n"
  register: _openbao_k8s_after_revoke
  changed_when: false
  failed_when: false
  no_log: true

# Only the server's refusal proves the revoke: the CLI reports OpenBao's answer as
# "Code: 403" with "permission denied". A lookup that fails for another reason, such as
# a lost connection, a missing pod or a local permission error, proves nothing, so the
# flag stays false.
- name: Record whether the token is gone
  ansible.builtin.set_fact:
    "{{ openbao_k8s_revoke_flag }}": >-
      {{ _openbao_k8s_revoke.rc | default(1) == 0
         and _openbao_k8s_after_revoke.rc | default(0) != 0
         and 'Code: 403' in (_openbao_k8s_after_revoke.stderr | default(''))
         and 'permission denied' in (_openbao_k8s_after_revoke.stderr | default('')) }}
