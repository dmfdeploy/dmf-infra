---
# Unseal one pod (openbao_unseal_target) with the threshold of shares. Each
# share goes to the pod on stdin and is submitted through the unseal API
# (`bao write sys/unseal -` with a JSON body on stdin, as dmf-env's
# unseal-openbao.sh does). It never appears in the argument list of any process.
#
# `bao operator unseal -` does not work: that command takes the key as its one
# positional argument and treats `-` as the key itself (OpenBao v2.5.2,
# command/operator_unseal.go lines 105-110).
#
# The two `bao status` reads run in check mode (check_mode: false) because they
# change nothing, and the play needs their output. Without it, check mode skips
# the command, the wait never sees output, and the play fails. The unseal write
# below stays skipped in check mode.
- name: Wait for the pod to report initialized
  ansible.builtin.include_role:
    name: common/openbao-cli
    apply:
      check_mode: false
  vars:
    openbao_cli_operation: wait for the pod to report initialized
    openbao_cli_pod: "{{ openbao_unseal_target }}"
    openbao_cli_namespace: "{{ openbao_namespace }}"
    openbao_cli_calls:
      - args: [status, -format=json]
    openbao_cli_register: _openbao_unseal_status
    # bao status exits 2 while the pod is sealed (command/status.go lines 94-95).
    # The output is what counts.
    openbao_cli_allow_failure: true
    openbao_cli_retries: 60
    openbao_cli_delay: 5
    openbao_cli_until: >-
      {{ openbao_cli_run.stdout | default('') | length > 0 and openbao_cli_run.stdout | default('') | from_json is mapping and (openbao_cli_run.stdout | from_json).initialized | default(false) | bool }}

# Unseal keys are hex or base64. Refuse any other character before a share is sent.
- name: Assert the shares are hex or base64
  ansible.builtin.assert:
    that: openbao_unseal_keys_hex[0:(openbao_shamir_threshold | int)] | map('regex_search', '^[A-Za-z0-9+/=_-]+$') | select('none') | list | length == 0
    fail_msg: An unseal share has a character that is not hex or base64.
  no_log: true
  when: (_openbao_unseal_status.stdout | from_json).sealed | default(true) | bool

# The shared role sends each share to the pod on stdin as the JSON body that
# `bao write sys/unseal -` reads. No process gets a share as an argument. The
# write does not run in check mode.
- name: Unseal the pod with the threshold of shares
  ansible.builtin.include_role:
    name: common/openbao-cli
  vars:
    openbao_cli_operation: unseal the pod with the threshold of shares
    openbao_cli_pod: "{{ openbao_unseal_target }}"
    openbao_cli_namespace: "{{ openbao_namespace }}"
    openbao_cli_calls: >-
      {%- set out = [] -%}
      {%- for item in openbao_unseal_keys_hex[0:(openbao_shamir_threshold | int)] -%}
      {%- set _ = out.append({'item': item, 'args': ['write', '-format=json', 'sys/unseal', '-'], 'input': {'key': item} | to_json}) -%}
      {%- endfor -%}
      {{ out }}
    openbao_cli_register: _openbao_unseal_write
    openbao_cli_changed: true
  when:
    - not ansible_check_mode
    - (_openbao_unseal_status.stdout | from_json).sealed | default(true) | bool

- name: Confirm the pod is unsealed
  ansible.builtin.include_role:
    name: common/openbao-cli
    apply:
      check_mode: false
  vars:
    openbao_cli_operation: confirm the pod is unsealed
    openbao_cli_pod: "{{ openbao_unseal_target }}"
    openbao_cli_namespace: "{{ openbao_namespace }}"
    openbao_cli_calls:
      - args: [status, -format=json]
    openbao_cli_register: _openbao_unseal_after
    openbao_cli_allow_failure: true

- name: Stop when the pod is still sealed
  ansible.builtin.fail:
    msg: The pod {{ openbao_unseal_target }} is still sealed after the unseal.
  when: >-
    _openbao_unseal_after.stdout | default('') | length == 0
    or (_openbao_unseal_after.stdout | from_json).sealed | default(true) | bool
