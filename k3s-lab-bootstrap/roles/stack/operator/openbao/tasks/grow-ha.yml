---
# Grow an installed single-replica OpenBao to a Raft cluster of three pods
# (playbooks/vertical-security/104-openbao-grow-ha.yml). Keeps the data and the
# existing shares. Never initializes. Refuses unless the existing pod is
# unsealed, active and healthy.
#
# Before you run it:
#   1. With openbao_replicas still 1, run vertical-security/100-openbao.yml so
#      the app-admin-writer policy gives ops-admin the two Raft reads, then take
#      an ops-admin token for OPENBAO_GUARD_TOKEN.
#   2. Set openbao_replicas: 3 in the site inventory.
#
# After the play, run the ESO play (vertical-orchestration/100-eso.yml). The play
# reissues the OpenBao certificate with the Raft peer names. The CA signs the new
# certificate, so clients that trust the CA keep trusting it. On a site that still
# runs the older self-signed certificate, run 320-cert-manager.yml first: this
# play does not move a site to the CA. The reissue also reloads the listener
# certificate of the running pod, so pod 0 serves the new certificate before it
# restarts below.
#
# The play supports exactly three replicas and does not support check mode.
#
# There is no automatic resume. The play runs from a single-replica install only,
# and every check that can refuse runs before the first change. If the play stops
# after it changed the StatefulSet, it refuses to run again. Recover by hand as the
# security model doc describes ("Recover an interrupted migration"). A stop after
# the certificate reissue and before the StatefulSet change leaves the install
# single-replica, so the play can run again once that recovery is done.

# The play reads state with commands that check mode skips, and its steps wait on
# each other, so a check-mode run would report a healthy pod as unhealthy. Refuse
# before any read or write.
- name: Refuse check mode
  ansible.builtin.assert:
    that: not ansible_check_mode
    fail_msg: >-
      The grow play does not support check mode (--check). Run it without --check
      on a disposable environment first. Nothing has changed.

- name: Refuse an unsupported replica count
  ansible.builtin.include_tasks: assert-replicas.yml

- name: Assert the site asks for a Raft cluster of three
  ansible.builtin.assert:
    that: openbao_replicas | int == 3
    fail_msg: >-
      openbao_replicas is {{ openbao_replicas }}. The grow play supports exactly 3
      replicas. Set openbao_replicas: 3 in the site inventory before you grow the
      cluster. Nothing has changed.

- name: Refuse when the certificate would not cover the Raft peer names
  ansible.builtin.include_role:
    name: base/cert-manager
    tasks_from: assert-openbao-peer-names.yml

- name: Assert the guard token is set
  ansible.builtin.assert:
    that: openbao_guard_token | default('') | length > 0
    fail_msg: >-
      The checks read the Raft state and need OPENBAO_GUARD_TOKEN, an ops-admin
      token. Set it and run the play again. Nothing has changed.

- name: Read the existing StatefulSet
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: apps/v1
    kind: StatefulSet
    name: openbao
    namespace: "{{ openbao_namespace }}"
  register: _openbao_grow_sts

- name: Refuse unless this is a single-replica install
  ansible.builtin.assert:
    that:
      - _openbao_grow_sts.resources | length == 1
      - _openbao_grow_sts.resources[0].spec.serviceName | default('') == 'openbao'
      - _openbao_grow_sts.resources[0].spec.replicas | default(0) | int == 1
    fail_msg: >-
      Expected one OpenBao StatefulSet that is a single replica with the Service
      `openbao`. This site is not one: either it is already a Raft cluster, or an
      earlier run stopped after it changed the StatefulSet. This play does not
      resume. Recover by hand: unseal every pod with bin/unseal-openbao.sh
      (OPENBAO_POD=<pod>), wait until 102-openbao-ha-guard.yml passes, then run
      105-openbao-verify-ha.yml. The security model doc has the steps ("Recover an
      interrupted migration"). Nothing has changed.

- name: Read the state of the existing pod
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - -n
      - "{{ openbao_namespace }}"
      - exec
      - openbao-0
      - --
      - bao
      - status
      - -format=json
  register: _openbao_grow_status
  changed_when: false
  failed_when: false
  no_log: true

- name: Refuse unless the existing pod is initialized, unsealed and active
  ansible.builtin.assert:
    that:
      - _openbao_grow_status.stdout | default('') | length > 0
      - (_openbao_grow_status.stdout | from_json).initialized | default(false) | bool
      - not ((_openbao_grow_status.stdout | from_json).sealed | default(true) | bool)
      - (_openbao_grow_status.stdout | from_json).is_self | default(false) | bool
    fail_msg: >-
      Refusing to grow OpenBao: openbao-0 is not initialized, unsealed and
      active. This procedure never initializes. Unseal openbao-0 with the
      threshold of shares (bin/unseal-openbao.sh), and run this play again.
      Nothing has changed.

# Before the first change: the play deletes the StatefulSet, and a pod that is left
# behind makes the later workload run look like an install in progress. The check
# runs while the original StatefulSet and the old certificate are in place.
- name: Refuse an image change to 2.6 or later before ops-admin holds the generate-root policy
  ansible.builtin.include_tasks: image-policy-preflight.yml

- name: Check the guard token can read the Raft paths
  ansible.builtin.include_tasks: capabilities-check.yml

- name: Load the unseal shares and the ops-admin password
  ansible.builtin.include_tasks: load-shares.yml

- name: Read the data before the change
  ansible.builtin.include_tasks: data-read.yml
  vars:
    openbao_data_read_label: before

# The baseline must hold at least one path that exists. Check it here, before the
# first change, so a site with nothing to compare finds out before the outage.
- name: Assert the before read found at least one existing path
  ansible.builtin.assert:
    that: _openbao_data_read_before.values() | reject('equalto', 'absent') | list | length > 0
    fail_msg: >-
      No path in openbao_migration_read_paths exists, so the migration would have
      nothing to compare before and after. Add paths that exist, then run the play
      again. Nothing has changed.

# Reissue the certificate with the Raft peer names. The Certificate definition is
# the cert-manager role's, so the DNS name list has one source. The task file
# proves that the CA issued the new certificate and reloads the running pod, so
# the pod's own CLI works after it.
- name: Reissue the OpenBao certificate with the Raft peer names
  ansible.builtin.include_role:
    name: base/cert-manager
    tasks_from: openbao-certificate.yml

# cert-manager can report the Certificate Ready before it replaces the secret, so
# read the certificate itself.
- name: Wait for the TLS secret to hold a certificate that covers the Raft peers
  ansible.builtin.shell:
    cmd: >-
      kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
      -n {{ openbao_namespace }}
      get secret {{ openbao_tls_secret_name }}
      -o jsonpath='{.data.tls\.crt}' |
      base64 -d |
      openssl x509 -noout -ext subjectAltName
  register: _openbao_grow_san
  until:
    - _openbao_grow_san.rc == 0
    - ('*.' ~ openbao_headless_service_name ~ '.' ~ openbao_namespace ~ '.svc.cluster.local') in _openbao_grow_san.stdout
  retries: "{{ openbao_grow_cert_wait_retries }}"
  delay: "{{ openbao_grow_cert_wait_delay }}"
  changed_when: false

# The governing Service of a StatefulSet cannot change in place. Delete the
# StatefulSet and keep its pod and volume (orphan), then create it again in the
# Raft shape at one replica.
# From here on, OpenBao is offline until pod 0 is unsealed.
- name: Delete the StatefulSet and keep its pod and volume
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: absent
    api_version: apps/v1
    kind: StatefulSet
    name: openbao
    namespace: "{{ openbao_namespace }}"
    delete_options:
      propagationPolicy: Orphan
    wait: true

- name: Create the Raft-shaped workload at one replica
  ansible.builtin.include_tasks: workload.yml
  vars:
    # The check ran at the start of this play. Its workload runs follow the reissue of the
    # certificate, after which the in-pod CLI fails TLS until pod 0 restarts.
    openbao_image_policy_checked: true
    openbao_workload_replicas: 1

- name: Read pod 0
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Pod
    name: openbao-0
    namespace: "{{ openbao_namespace }}"
  register: _openbao_grow_pod0_before

# A single-replica install stores node 1 in the Raft configuration at the Service
# address, and OpenBao does not rewrite it when pod 0 restarts with the per-pod
# addresses. With three pods behind the Service, a new leader dials a random pod
# for node 1 and steps down. raft/peers.json makes pod 0 recover its configuration
# at start with node 1 at its per-pod address. OpenBao removes the file once it
# has applied it.
- name: Write the Raft peers file of pod 0
  ansible.builtin.shell:
    cmd: >-
      printf '%s' {{ peers_json | quote }} |
      kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
      -n {{ openbao_namespace }}
      exec -i openbao-0
      -- sh -c 'cat > {{ openbao_data_path }}/raft/peers.json'
  vars:
    peers_json: >-
      {{ [{'id': openbao_raft_node_id | string,
           'address': 'openbao-0.' ~ openbao_headless_service_name ~ '.' ~ openbao_namespace ~ '.svc.cluster.local:8201',
           'non_voter': false}] | to_json }}
  changed_when: true

# Pod 0 has to restart: it loads the new certificate and the per-pod addresses
# only at start. It comes back sealed.
- name: Recreate pod 0
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: absent
    api_version: v1
    kind: Pod
    name: openbao-0
    namespace: "{{ openbao_namespace }}"
    # No wait: the StatefulSet recreates the pod under the same name at once,
    # so a wait for the name to disappear never ends. The next task waits for
    # a pod with a new UID.
    wait: false

- name: Wait for the new pod 0 to run
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Pod
    name: openbao-0
    namespace: "{{ openbao_namespace }}"
  register: _openbao_grow_pod0_after
  until:
    - _openbao_grow_pod0_after.resources | length > 0
    - _openbao_grow_pod0_after.resources[0].metadata.uid != _openbao_grow_pod0_before.resources[0].metadata.uid
    - _openbao_grow_pod0_after.resources[0].status.phase | default('') == 'Running'
    - _openbao_grow_pod0_after.resources[0].status.containerStatuses | default([]) | selectattr('state.running', 'defined') | list | length > 0
  retries: 60
  delay: 5

- name: Unseal pod 0 with the existing shares
  ansible.builtin.include_tasks: unseal-pod.yml
  vars:
    openbao_unseal_target: openbao-0

- name: Wait for pod 0 to lead
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - -n
      - "{{ openbao_namespace }}"
      - exec
      - openbao-0
      - --
      - bao
      - status
      - -format=json
  register: _openbao_grow_leader
  changed_when: false
  failed_when: false
  until:
    - _openbao_grow_leader.stdout | default('') | length > 0
    - (_openbao_grow_leader.stdout | from_json).is_self | default(false) | bool
  retries: 30
  delay: 5
  no_log: true

# Scale only when node 1 is at its per-pod address. With node 1 at the Service
# address, a leader dials a random pod for that peer and steps down.
- name: Read the Raft configuration
  ansible.builtin.shell:
    cmd: >-
      kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
      -n {{ openbao_namespace }}
      exec -i openbao-0
      -- sh -c '
      IFS= read -r BAO_TOKEN;
      export BAO_TOKEN;
      bao read -format=json sys/storage/raft/configuration'
    stdin: "{{ openbao_guard_token }}\n"
  register: _openbao_grow_raft_config
  changed_when: false
  failed_when: false
  no_log: true

- name: Find the address of node 1
  ansible.builtin.set_fact:
    _openbao_grow_node_address: >-
      {%- set out = namespace(address='') -%}
      {%- if _openbao_grow_raft_config.rc | default(1) == 0 and _openbao_grow_raft_config.stdout | default('') is search('^\s*\{') -%}
      {%- for server in (((_openbao_grow_raft_config.stdout | from_json).data | default({})).config | default({})).servers | default([]) -%}
      {%- if server.node_id | string == openbao_raft_node_id | string -%}{%- set out.address = server.address | default('') -%}{%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {{ out.address }}
  no_log: true

- name: Refuse to scale unless node 1 is at its per-pod address
  ansible.builtin.assert:
    that: _openbao_grow_node_address == 'openbao-0.' ~ openbao_headless_service_name ~ '.' ~ openbao_namespace ~ '.svc.cluster.local:8201'
    fail_msg: >-
      Raft node {{ openbao_raft_node_id }} is at
      {{ _openbao_grow_node_address | default('', true) or 'an address that could not be read' }}, not at
      openbao-0.{{ openbao_headless_service_name }}.{{ openbao_namespace }}.svc.cluster.local:8201.
      The play did not scale. Pod 0 is running alone. Follow "Recover an interrupted
      migration" in the security model doc, the branch "Pod 0 is unsealed and node 1
      is at the wrong address", which covers writing raft/peers.json by hand.

- name: Scale the workload to the full replica count
  ansible.builtin.include_tasks: workload.yml
  vars:
    # The check ran at the start of this play. Its workload runs follow the reissue of the
    # certificate, after which the in-pod CLI fails TLS until pod 0 restarts.
    openbao_image_policy_checked: true

- name: Unseal the new pods with the existing shares
  ansible.builtin.include_tasks: unseal-pods.yml
  vars:
    openbao_unseal_pods: "{{ range(1, openbao_replicas | int) | map('string') | map('regex_replace', '^', 'openbao-') | list }}"

- name: Wait for every pod to be a healthy voter
  ansible.builtin.include_tasks: ha-guard-poll.yml

- name: Read the data after the change
  ansible.builtin.include_tasks: data-read.yml
  vars:
    openbao_data_read_label: after

- name: Compare the data before and after
  ansible.builtin.include_tasks: data-compare.yml

- name: Tell the operator the remaining step
  ansible.builtin.debug:
    msg: >-
      The cluster has {{ openbao_replicas }} pods, all unsealed. The migration used the
      automation file to unseal. To prove the recovery shares still work, restart one
      standby pod with 103-openbao-restart-pod.yml and unseal it with the recovery
      shares (bin/unseal-openbao.sh). Then run 102-openbao-ha-guard.yml. Run the ESO
      play (vertical-orchestration/100-eso.yml) now: the ClusterSecretStore stays not
      ready until it trusts the reissued certificate.
