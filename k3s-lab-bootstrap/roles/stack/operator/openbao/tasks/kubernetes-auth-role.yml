---
# Write one Kubernetes-auth role of the OpenBao mount. Included by
# setup-issuer.yml, setup-rotation-scheduler.yml and setup-executor.yml on a fresh install, and by
# kubernetes-auth-standing-roles.yml on an installed environment, so both paths
# write the same fields.
#
# The caller sets openbao_k8s_auth_role (one of the openbao_*_k8s_auth_role
# mappings in defaults/main.yml) and openbao_k8s_auth_token, a root token. The
# shared role sends the token and the request body to the pod on stdin: `bao write
# PATH -` reads the JSON body.

- name: Write the Kubernetes-auth role {{ openbao_k8s_auth_role.name }}
  ansible.builtin.include_role:
    name: common/openbao-cli
  vars:
    openbao_cli_operation: write a Kubernetes-auth role
    openbao_cli_pod: "{{ openbao_pod }}"
    openbao_cli_namespace: "{{ openbao_namespace }}"
    openbao_cli_token: "{{ openbao_k8s_auth_token }}"
    openbao_cli_calls:
      - args: [write, "auth/kubernetes/role/{{ openbao_k8s_auth_role.name }}", "-"]
        input: "{{ {'bound_service_account_names': [openbao_k8s_auth_role.service_account], 'bound_service_account_namespaces': [openbao_k8s_auth_role.namespace], 'audience': openbao_k8s_auth_role.audience, 'token_policies': [openbao_k8s_auth_role.policy], 'token_ttl': openbao_k8s_auth_role.token_ttl, 'token_max_ttl': openbao_k8s_auth_role.token_max_ttl} | to_json }}"
    openbao_cli_register: _openbao_k8s_role_write
    openbao_cli_changed: true
