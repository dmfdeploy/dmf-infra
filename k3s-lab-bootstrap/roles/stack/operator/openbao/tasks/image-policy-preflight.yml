---
# Refuse to roll an installed server to OpenBao 2.6 or later unless the approval
# executor's Kubernetes-auth role holds the generate-root policy. A 2.6 server accepts
# root token generation only from a caller that holds the policy. Only the executor
# holds it (ADR-0051, Amendment 2026-11-18), so a server that runs 2.6 without the
# policy on that role has no caller that can generate a root token. The check runs
# first in workload.yml, and the grow-HA play runs it before its first change, so
# every play that applies or replaces the StatefulSet is covered. The grow-HA play
# sets openbao_image_policy_checked: its later workload run must not call bao again,
# because the certificate it reissued breaks the in-pod CLI until pod 0 restarts.
#
# An install counts as present when the StatefulSet, the pod openbao-0 or the volume
# claim data-openbao-0 exists, so an interrupted migration that left only the pod or
# the volume is not taken for a new install. The check does nothing for a new
# install, when the image does not change, when it is older than 2.6, or when the
# server is not initialized. Otherwise it logs in as policy-reconciler with the
# password of the break-glass file, reads the executor's role with the identity
# verifier policy that policy-reconciler holds, revokes the login token, and stops
# unless the role lists the policy. The password reaches the pod on stdin.
- name: Skip the check when the play has run it already
  ansible.builtin.set_fact:
    _openbao_preflight_skip: "{{ openbao_image_policy_checked | default(false) | bool }}"

- name: Read what an install leaves behind
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ openbao_namespace }}"
  loop:
    - {api_version: apps/v1, kind: StatefulSet, name: openbao}
    - {api_version: v1, kind: Pod, name: openbao-0}
    - {api_version: v1, kind: PersistentVolumeClaim, name: data-openbao-0}
  loop_control:
    label: "{{ item.kind }}"
  register: _openbao_preflight_found
  when: not (_openbao_preflight_skip | bool)

- name: Work out the installed image
  ansible.builtin.set_fact:
    _openbao_preflight_sts_image: >-
      {{
        ((((_openbao_preflight_found.results[0].resources | default([{}]) | first | default({})).spec | default({})).template | default({})).spec | default({})).containers
        | default([{}]) | first | default({}) | json_query('image') | default('', true)
      }}
    _openbao_preflight_pod_image: >-
      {{
        ((_openbao_preflight_found.results[1].resources | default([{}]) | first | default({})).spec | default({})).containers
        | default([{}]) | first | default({}) | json_query('image') | default('', true)
      }}
    _openbao_preflight_has_sts: "{{ (_openbao_preflight_found.results[0].resources | default([]) | length) > 0 }}"
    _openbao_preflight_installed: >-
      {{ _openbao_preflight_found.results | map(attribute='resources') | map('default', []) | map('length') | select('gt', 0) | list | length > 0 }}
  when: not (_openbao_preflight_skip | bool)

# With a StatefulSet, its image decides, and one whose image cannot be read counts
# as unchanged. Without one (an interrupted migration), the image of the orphan pod
# decides, and a pod or volume without a readable image counts as changed.
- name: Decide whether the image changes to 2.6 or later on an installed server
  ansible.builtin.set_fact:
    _openbao_preflight_needed: >-
      {{
        _openbao_preflight_installed | bool
        and (
          (_openbao_preflight_has_sts | bool and (_openbao_preflight_sts_image | length) > 0 and _openbao_preflight_sts_image != openbao_image)
          or (not (_openbao_preflight_has_sts | bool) and _openbao_preflight_pod_image != openbao_image)
        )
        and (
          (openbao_image | regex_search(':(\d+)\.(\d+)', '\1', '\2')) is none
          or (openbao_image | regex_search(':(\d+)\.(\d+)', '\1', '\2'))[0] | int > 2
          or (
            (openbao_image | regex_search(':(\d+)\.(\d+)', '\1', '\2'))[0] | int == 2
            and (openbao_image | regex_search(':(\d+)\.(\d+)', '\1', '\2'))[1] | int >= 6
          )
        )
      }}
  when: not (_openbao_preflight_skip | bool)

- name: Check the policy of the executor role before the image changes
  when: not (_openbao_preflight_skip | bool) and (_openbao_preflight_needed | bool)
  block:
    - name: Read the init status of the running server
      ansible.builtin.include_role:
        name: common/openbao-cli
      vars:
        openbao_cli_operation: read the init status of the running server
        openbao_cli_pod: openbao-0
        openbao_cli_namespace: "{{ openbao_namespace }}"
        openbao_cli_calls:
          - args: [status, -format=json]
        openbao_cli_register: _openbao_preflight_status
        openbao_cli_allow_failure: true

    - name: Stop when the status cannot be read
      ansible.builtin.fail:
        msg: >-
          Cannot read the OpenBao status in openbao-0, so the play cannot tell whether
          the generate-root policy is in place before the image changes to
          {{ openbao_image }}. Check that the pod runs, then run the play again.
      when: >-
        _openbao_preflight_status.stdout | default('') is not match('(?s)\s*\{')
        or 'initialized' not in (_openbao_preflight_status.stdout | from_json)

    - name: Check the policy of the executor role on an initialized server
      when: (_openbao_preflight_status.stdout | from_json).initialized | bool
      block:
        - name: Stop while the server is sealed
          ansible.builtin.fail:
            msg: >-
              openbao-0 is sealed. The play logs in as policy-reconciler to check the
              generate-root policy on the {{ openbao_executor_k8s_role }} role before
              it changes the image, so unseal OpenBao first.
          when: (_openbao_preflight_status.stdout | from_json).sealed | bool

        # The same precedence as the install: the ESO break-glass file when it is
        # set, otherwise the JSON next to the key path.
        - name: Read the break-glass JSON of the operator host
          ansible.builtin.slurp:
            src: "{{ eso_openbao_breakglass_file | default((openbao_key_path | default('')) ~ '.json', true) }}"
          register: _openbao_preflight_breakglass
          delegate_to: localhost
          become: false
          no_log: true

        - name: Log in as policy-reconciler
          ansible.builtin.include_role:
            name: common/openbao-cli
          vars:
            openbao_cli_operation: log in as policy-reconciler
            openbao_cli_pod: openbao-0
            openbao_cli_namespace: "{{ openbao_namespace }}"
            openbao_cli_calls:
              - args: [write, -format=json, "auth/userpass/login/{{ openbao_policy_reconciler_username }}", "-"]
                input: "{{ {'password': (_openbao_preflight_breakglass.content | b64decode | from_json).policy_reconciler_password | default('')} | to_json }}\n"
            openbao_cli_register: _openbao_preflight_login

        - name: Keep the login token and its accessor
          ansible.builtin.set_fact:
            _openbao_preflight_token: "{{ (_openbao_preflight_login.stdout | from_json).auth.client_token }}"
            _openbao_preflight_accessor: "{{ (_openbao_preflight_login.stdout | from_json).auth.accessor | default('unknown') }}"
          no_log: true

        - name: Read the executor's Kubernetes-auth role
          ansible.builtin.include_role:
            name: common/openbao-cli
          vars:
            openbao_cli_operation: read the executor's Kubernetes-auth role
            openbao_cli_pod: openbao-0
            openbao_cli_namespace: "{{ openbao_namespace }}"
            openbao_cli_token: "{{ _openbao_preflight_token }}"
            openbao_cli_calls:
              - args: [read, -format=json, "auth/kubernetes/role/{{ openbao_executor_k8s_role }}"]
            openbao_cli_register: _openbao_preflight_role
            openbao_cli_allow_failure: true
      always:
        - name: Revoke the login token
          ansible.builtin.include_role:
            name: common/openbao-cli
          vars:
            openbao_cli_operation: revoke the login token
            openbao_cli_pod: openbao-0
            openbao_cli_namespace: "{{ openbao_namespace }}"
            openbao_cli_token: "{{ _openbao_preflight_token }}"
            openbao_cli_calls:
              - args: [token, revoke, -self]
            openbao_cli_register: _openbao_preflight_revoke
            openbao_cli_allow_failure: true
            openbao_cli_changed: true
            openbao_cli_retries: 2
            openbao_cli_delay: "{{ openbao_preflight_revoke_delay | default(2) }}"
            # Retrying only gives the call more chances; the task after this one fails when the revoke did not succeed.
            openbao_cli_allow_exhausted_retries: true
            openbao_cli_until: "{{ openbao_cli_run.rc == 0 }}"
          when: _openbao_preflight_token is defined

        - name: Stop because the policy-reconciler login token may still be live
          ansible.builtin.fail:
            msg: >-
              The revoke of the policy-reconciler login token failed three times, so the
              token may stay valid until it expires. Its accessor is
              {{ _openbao_preflight_accessor | default('unknown') }}. Revoke it with
              `bao token revoke -accessor <accessor>`.
          when:
            - _openbao_preflight_token is defined
            - _openbao_preflight_revoke.rc | default(1) != 0

    - name: Stop when the executor role cannot be read
      ansible.builtin.fail:
        msg: >-
          The image changes to {{ openbao_image }}, and the play could not read the
          {{ openbao_executor_k8s_role }} role of the Kubernetes auth method. Check that
          the role exists, and that policy-reconciler holds the
          {{ openbao_identity_verifier_policy_name }} policy. OpenBao 2.6 and later accept
          root token generation only from a caller that holds the
          {{ openbao_generate_root_policy_name }} policy, and only the executor's role
          may hold it. Run this play with -e openbao_image=<the image that runs now>
          until then.
      when:
        - (_openbao_preflight_status.stdout | from_json).initialized | bool
        - _openbao_preflight_role.rc != 0

    - name: Stop until the executor role holds the generate-root policy
      ansible.builtin.fail:
        msg: >-
          The image changes to {{ openbao_image }}, and the {{ openbao_executor_k8s_role }}
          role does not hold the {{ openbao_generate_root_policy_name }} policy. OpenBao
          2.6 and later accept root token generation only from a caller that holds it,
          and only the executor's role may hold it. Rebuild the environment with the
          install of this release, or run this play with
          -e openbao_image=<the image that runs now>. The role README explains why no
          other path to a root token exists.
      when:
        - (_openbao_preflight_status.stdout | from_json).initialized | bool
        - openbao_generate_root_policy_name not in ((_openbao_preflight_role.stdout | from_json).data.token_policies | default([]))
