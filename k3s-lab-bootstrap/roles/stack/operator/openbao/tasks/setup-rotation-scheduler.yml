---
# Rotation scheduler identity: the ServiceAccount, its Lease RBAC, its OpenBao
# policy and its Kubernetes-auth role. Included from main.yml after the setup
# issuer. The OpenBao policy and the RBAC are rendered from the registry by
# lib/approle_lifecycle/scheduler_policy.py, so the grants follow the targets.
#
# The RBAC for the consumer Secrets and the readiness gates lives in other
# namespaces, which other roles create later. The rotation playbook applies it
# before each run (playbooks/vertical-orchestration/115-approle-rotation.yml).

# The gate namespaces of the object-storage targets come from the defaults of
# the object-storage-credentials role, unless the inventory overrides them.
- name: Load the object-storage consumer namespace defaults
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../../base/object-storage-credentials/defaults/main.yml"
    name: _openbao_rotation_object_storage_defaults

- name: Render the rotation scheduler ServiceAccount and Lease RBAC
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - approle_lifecycle.scheduler_policy
      - rbac
      - --registry
      - "{{ role_path }}/../../../../vars/openbao-approle-lifecycle-registry.json"
      - --inventory-json
      - >-
        {{
          {'object_storage_consumer_namespaces':
            object_storage_consumer_namespaces
            | default(_openbao_rotation_object_storage_defaults.object_storage_consumer_namespaces)}
          | to_json
        }}
      - --namespace
      - "{{ openbao_namespace }}"
      - --service-account
      - "{{ openbao_rotation_scheduler_service_account }}"
      - --lease-namespace
      - "{{ openbao_namespace }}"
      - --scope
      - identity
  environment:
    PYTHONPATH: "{{ role_path }}/../../../../lib"
  register: _openbao_rotation_identity_rbac
  changed_when: false
  delegate_to: localhost
  become: false

- name: Apply the rotation scheduler ServiceAccount and Lease RBAC
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ item }}"
  loop: "{{ _openbao_rotation_identity_rbac.stdout | from_json }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"

- name: Write the rotation scheduler policy
  ansible.builtin.shell:
    cmd: >-
      printf '%s\n%s\n' "$OPENBAO_TOKEN" "$POLICY_HCL" |
      kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
      -n {{ openbao_namespace }}
      exec -i {{ openbao_pod }}
      -- sh -c '
      IFS= read -r BAO_TOKEN;
      export BAO_TOKEN;
      bao policy write {{ openbao_rotation_scheduler_policy_name }} -'
  environment:
    OPENBAO_TOKEN: "{{ _openbao_policy_apply_token }}"
    POLICY_HCL: "{{ lookup('ansible.builtin.file', role_path ~ '/files/policies/rotation-scheduler.hcl') }}"
  no_log: true
  when: openbao_is_initialized | bool

# Writing a Kubernetes-auth role needs a privileged token, as for the setup
# issuer: a fresh install writes the role with the initial root token, and a
# rerun leaves it as it is. The identity verifier fails when the role is
# missing.
- name: Write the rotation scheduler Kubernetes-auth role
  ansible.builtin.shell:
    cmd: >-
      printf '%s\n' "$OPENBAO_TOKEN" |
      kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
      -n {{ openbao_namespace }}
      exec -i {{ openbao_pod }}
      -- sh -c '
      IFS= read -r BAO_TOKEN;
      export BAO_TOKEN;
      bao write auth/kubernetes/role/{{ openbao_rotation_scheduler_k8s_role }}
      bound_service_account_names={{ openbao_rotation_scheduler_service_account }}
      bound_service_account_namespaces={{ openbao_namespace }}
      audience={{ openbao_rotation_scheduler_audience }}
      token_policies={{ openbao_rotation_scheduler_policy_name }}
      token_ttl={{ openbao_rotation_scheduler_token_ttl }}
      token_max_ttl={{ openbao_rotation_scheduler_token_max_ttl }}'
  environment:
    OPENBAO_TOKEN: "{{ openbao_root_token }}"
  no_log: true
  when:
    - openbao_init_raw is defined
    - openbao_init_raw.changed | default(false)
