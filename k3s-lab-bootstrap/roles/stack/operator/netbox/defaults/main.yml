---
netbox_namespace: netbox
netbox_storage_size: 1Gi
netbox_storage_class: "{{ dmf_storage_class | default('longhorn') }}"
# Local NetBox superuser — intentionally a fixed non-colliding break-glass
# identity, NOT vault_bootstrap_admin_username. ADR-0028 D3 + per-app survey
# §3.3 + §5 item 2 (2026-05-24): decoupling the local admin from the
# operator's Authentik username crystallises the slogan (C4 — no routine
# break-glass) and mirrors the AWX rename (ADR-0028 follow-on step 2,
# dmf-infra c426dc0). NetBox already deduplicates OIDC logins by email
# (SOCIAL_AUTH_PIPELINE associate_by_email), so no shadow class to remediate
# here; the rename is the symbolic + structural cleanup.
#
# Existing envs that bootstrapped with the prior default MUST override
# this in env inventory before re-running, or plan a one-time live
# migration (create netbox-break-glass via the create-superuser job +
# reassign object ownership). See survey §5 item 2.
netbox_superuser_username: netbox-break-glass
# ADR-0024/0028 canonical break-glass email: per-app, per-env synthetic.
# Must NOT fall back to vault_bootstrap_admin_email (the operator email) —
# NetBox's SOCIAL_AUTH_PIPELINE associate_by_email step would merge the
# operator's OIDC sign-in into this break-glass User row, hijacking the
# break-glass identity (observed live on zy9q-1015 prior to the 2026-05-28
# remediation). bootstrap-secrets.sh seed-bao writes the same pattern to
# secret/apps/netbox/admin.email; vault_netbox_superuser_email below is
# kept as a per-env override hook.
netbox_superuser_email: "{{ vault_netbox_superuser_email | default('netbox-' ~ (dmf_env_id | default('local')) ~ '@' ~ (cert_manager_cluster_domain | default('dmf.example.com'))) }}"
netbox_superuser_password: "{{ vault_netbox_superuser_password | default(vault_bootstrap_admin_password | mandatory) }}"
netbox_path: /netbox
netbox_chart_stage_path: /tmp/netbox-chart
netbox_runtime_secret_path: secret/apps/netbox/runtime
netbox_openbao_namespace: openbao
netbox_openbao_pod_label_selector: "app.kubernetes.io/name=openbao"
netbox_wait_retries: 120
netbox_wait_delay: 5
netbox_oidc_enabled: true
netbox_oidc_provider_name: NetBox
netbox_oidc_issuer_url: "https://{{ authentik_host }}/application/o/netbox"
netbox_oidc_login_url: /oauth/login/oidc/
netbox_oidc_login_label: Sign in with Authentik
netbox_oidc_groups_scope_name: groups
netbox_oidc_admin_group: ops-admin
netbox_sso_pipeline_configmap_name: netbox-sso-pipeline-roles
netbox_sso_pipeline_mount_path: /opt/netbox/netbox/netbox/sso_pipeline_roles.py

# Local-CA lane (sandbox / dmf_tls_mode==local-ca): NetBox's server-side OIDC
# (python-social-auth does discovery/token/userinfo against the Authentik
# *public* host) must trust the in-cluster CA, else login 500s with
# CERTIFICATE_VERIFY_FAILED. Mirrors the zot role: publish dmf-local-ca into the
# netbox ns, mount it, and point requests/urllib at it (via the NGINX Unit app
# environment — Unit does not inherit the container env). The browser-facing
# authorize/redirect stays on the public host (ADR-0023 front-channel), so all
# apps remain externally reachable. No-op on cloud/real-cert lanes.
netbox_local_ca_trust_enabled: "{{ dmf_tls_mode | default('') == 'local-ca' }}"
netbox_local_ca_secret: dmf-local-ca
netbox_local_ca_secret_namespace: cert-manager
netbox_local_ca_configmap: dmf-local-ca
netbox_local_ca_mount_path: /etc/ssl/certs/dmf-local-ca.crt

# NetBox DB, Valkey, and API token pepper are sourced from OpenBao at
# netbox_runtime_secret_path and only fall back to explicit overrides.
netbox_db_password: "{{ vault_netbox_db_password | default('') }}"
netbox_valkey_password: "{{ vault_netbox_valkey_password | default('') }}"
netbox_api_token_pepper: "{{ vault_netbox_api_token_pepper | default('') }}"
netbox_secret_key: "{{ vault_netbox_secret_key | default('') }}"
netbox_superuser_api_token: "{{ vault_netbox_superuser_api_token | default('') }}"

# Exposure model — "host" (cloud lane default) or "path" (airgapped/flypack).
netbox_exposure: host
netbox_host: netbox.dmf.example.com
netbox_ingress_class: traefik-private

# Media persistence access mode - ReadWriteMany for multi-pod cloud
# deployments; set to ReadWriteOnce for single-node / local-path profiles.
netbox_media_access_mode: ReadWriteMany

# NGINX Unit worker pool sizing. Defaults match upstream (4 max / 2 spare)
# for lab/cloud; the sandbox profile prelude overrides these for constrained
# nodes (e.g. 8 GB Pi 4) where CPU-count-based pools exhaust RAM (#93).
netbox_unit_processes_max: 4
netbox_unit_processes_spare: 2

# Main netbox container resource requests/limits. The upstream netbox-chart
# (netbox-community/netbox-chart 7.3.0) declares no chart default of its
# own here (bitnami-common `resourcesPreset: "medium"`, `resources: {}`) —
# our values.yml.j2 previously passed NEITHER through, so the effective
# request was whatever that upstream preset resolves to (observed: 500m
# CPU / 1024Mi memory). umbrella dmfdeploy/dmfdeploy#258 platform
# request-budget audit (J1 gate): two sustained samples on v5on-r8aw
# (10-min idle + 15-min under a loaded source-pod run, 30 samples each)
# measured avg 11m/max 63m CPU and avg 211Mi/max 351Mi memory for the main
# netbox container — the 500m CPU request was the single largest
# over-declaration on the platform's scheduling claim. netbox-worker is
# NOT touched by either #258 round (measured 1m CPU / 24Mi memory,
# already near-idle; the chart DOES expose its own separate worker.
# resources/worker.resourcesPreset knob, just not one either round's
# scope named). valkey/postgresql were left alone in round 1 (matching
# their own chart defaults' 100m/128Mi requests at the time) but ARE
# trimmed in round 2 — see netbox_postgresql_resources/
# netbox_valkey_resources below.
netbox_resources:
  requests:
    # umbrella #299 WP1: 100m -> 50m. Measured p95 11.5m / max 127m against
    # the 1000m limit below, which is untouched — only the scheduling
    # reservation comes down, the burst headroom is unchanged. Trimmed in
    # lockstep with netbox_init_resources: the scheduler charges a pod
    # max(sum(app), max(init)), so trimming only one of the two would buy
    # nothing at all.
    cpu: 50m
    memory: 512Mi
    # Preserved from the chart's former resourcesPreset "medium" — an
    # explicit resources block replaces the preset WHOLESALE, and the
    # preset also carried ephemeral-storage bounds (codex trim-review P2).
    ephemeral-storage: 50Mi
  limits:
    cpu: 1000m
    # 2Gi, not the sustained-use-derived 1024Mi first tried: NetBox's
    # steady state measures ~211Mi avg / 351Mi max (umbrella #258), but
    # every AWX inventory sync pulls /api/schema/?format=json — a burst
    # that OOMKilled the pod at a 1Gi limit (live, 2026-07-24, restart
    # count 2). Requests stay sustained-honest; the limit accommodates
    # the known burst, matching the former preset's value.
    memory: 2Gi
    ephemeral-storage: 2Gi

# postgresql/valkey subchart resource requests/limits. umbrella
# dmfdeploy/dmfdeploy#258 round 2 (2026-07-24, data-backed, requests
# only): both subcharts currently fall through to the bitnami-common
# `resourcesPreset: "nano"` (verified against the vendored netbox-7.3.0
# chart's own postgresql/valkey subchart values.yaml + charts/common's
# _resources.tpl preset table: requests {cpu: 100m, memory: 128Mi,
# ephemeral-storage: 50Mi}, limits {cpu: 150m, memory: 192Mi,
# ephemeral-storage: 2Gi}) — an explicit `resources:` block REPLACES the
# preset wholesale (same "medium" -> explicit lesson as netbox_resources
# above), so every value below except requests.cpu is the nano preset's
# own value, preserved byte-for-byte, not re-derived.
# valkey: measured avg 12m CPU (near-idle pub/sub cache). postgresql:
# measured avg 4m CPU, but kept more conservative (50m, not floored to
# valkey's level) since DB load spikes coincide with app-level bursts
# (the SAME netbox schema-sync burst that OOMKilled netbox_resources'
# memory limit above, per its own comment) — CPU only, not memory-risky
# the way that burst was, but still not floored to the bare measured avg.
netbox_postgresql_resources:
  requests:
    cpu: 50m
    memory: 128Mi
    ephemeral-storage: 50Mi
  limits:
    cpu: 150m
    memory: 192Mi
    ephemeral-storage: 2Gi

netbox_valkey_resources:
  requests:
    cpu: 25m
    memory: 128Mi
    ephemeral-storage: 50Mi
  limits:
    cpu: 150m
    memory: 192Mi
    ephemeral-storage: 2Gi

# umbrella #276: measured request honesty (2026-07-24 sample archive);
# requests-only, no limits. netbox-worker was explicitly out of scope for
# #258 (see netbox_resources' own comment above) — this is its first
# explicit request, off the fresh #276 106-sample archive (med/p95/max
# 1/2/2m CPU, mem max 224Mi).
netbox_worker_resources:
  requests:
    cpu: 10m
    memory: 256Mi

# umbrella #299 WP1: the two INIT containers the chart renders had never
# been wired to a role knob at all, so both silently fell through to the
# bitnami-common `resourcesPreset: "nano"` — cpu 100m each. Since the
# scheduler charges a pod max(sum(app), max(init)), that 100m was setting
# BOTH pods' entire request: netbox despite sum(app)=100m (now 50m), and
# netbox-worker outright, over a sum(app) of just 10m.
#
# Every value below except requests.cpu is the nano preset's own value,
# preserved BYTE-FOR-BYTE, not re-derived — an explicit resources block
# replaces the preset WHOLESALE (the #258 lesson; see netbox_resources'
# and netbox_postgresql_resources' own comments above). Dropping any of
# them would silently unbound these containers' memory and
# ephemeral-storage.
#
# init-dirs (netbox pod) — a mkdir; 50m to match the app container it
# shares the pod's effective request with. Anything at or below 50m gives
# the same effective 50m, so there is nothing to gain by going lower.
netbox_init_resources:
  requests:
    cpu: 50m
    memory: 128Mi
    ephemeral-storage: 50Mi
  limits:
    cpu: 150m
    memory: 192Mi
    ephemeral-storage: 2Gi

# wait-for-backend (netbox-worker pod) — a `kubectl rollout status` POLL
# LOOP. 25m is a deliberate semantic FLOOR, NOT a measurement: the
# #276 archive's 1m/2m figures are the long-running worker APP container,
# and a completed init container cannot be calibrated from that query at
# all. Do not "refine" this down against worker-app numbers.
netbox_worker_wait_for_backend_resources:
  requests:
    cpu: 25m
    memory: 128Mi
    ephemeral-storage: 50Mi
  limits:
    cpu: 150m
    memory: 192Mi
    ephemeral-storage: 2Gi
