---
loki_namespace: monitoring
# 50 GiB sized for 30-day operator retention + 6-month security-stream retention
# on a single-binary lab cluster. Recompute when stream volume changes
# materially. See audit-log-retention-policy.md for the retention contract.
loki_storage_size: 50Gi
loki_storage_class: "{{ dmf_storage_class | default('longhorn') }}"
# True on the single-node sandbox profile, where Loki shares one node and one
# disk with the rest of the stack.
loki_single_node: "{{ (dmf_release_profile | default('')) == 'sandbox-single-node' }}"
# Default retention (also used as the floor for any stream without an explicit
# rule). Aligns with operator activity retention in
# docs/processes/audit-log-retention-policy.md (30 days).
# Single-node: local-path enforces no quota, so loki_storage_size is only a
# request and the chunk store can grow until the node hits disk pressure
# (32G on a 5Gi PVC, umbrella #289). Retention is the effective bound there.
loki_retention: "{{ '72h' if loki_single_node | bool else '720h' }}"
# Per-stream retention overrides applied via limits_config.retention_stream
# below. Security streams (k3s API audit, Authentik audit, app-security) carry
# a 6-month retention (4380h, ≈ 182.5 days); everything else falls through to
# loki_retention. Single-node bounds them too (7 days): an unbounded stream
# defeats the disk bound above.
loki_security_retention: "{{ '168h' if loki_single_node | bool else '4380h' }}"
# umbrella #313: per-stream ingestion caps — below Loki's own 3.0 defaults,
# protecting the monitoring plane from a single runaway stream (#308's own
# mxl status-sidecar spinner peaked at ~9 MB/s from ONE stream). Ingestion
# limits protect Loki/the monitoring plane only — the node itself still pays
# disk I/O and rotation churn regardless of these; that's what the promtail
# limit stage (roles/base/promtail) and the kubelet rotation vars
# (playbooks/300-k3s.yml) are for. Never silent: paired with the mandatory
# LokiPerStreamRateLimitDropping{,Bytes} alerts (roles/base/prometheus/
# templates/rules/alerts.yaml.j2).
loki_per_stream_rate_limit: 1MB
loki_per_stream_rate_limit_burst: 3MB
# Compactor controls (must stay enabled for retention to be enforced; see the
# pre-Tier-A bug where retention_period was set but compactor was disabled).
loki_compactor_retention_delete_delay: 2h
loki_compactor_retention_delete_worker_count: 150
loki_helm_repo: https://grafana.github.io/helm-charts
loki_helm_chart_version: "6.6.2"
loki_wait_retries: 60
loki_wait_delay: 5

# umbrella #276: measured request honesty (2026-07-24 sample archive);
# requests-only, no limits.
loki_resources:
  requests:
    cpu: 100m
    memory: 768Mi

loki_gateway_resources:
  requests:
    cpu: 5m
    memory: 32Mi

loki_canary_resources:
  requests:
    cpu: 5m
    memory: 32Mi
