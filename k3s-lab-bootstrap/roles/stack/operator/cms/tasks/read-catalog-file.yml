---
# Read a single catalog YAML file, parse it, and merge into _cms_catalog_entries.
# Called via include_tasks from main.yml with loop_var _cms_catalog_file_item.

- name: Slurp catalog file content
  ansible.builtin.slurp:
    src: "{{ _cms_catalog_file_item.path }}"
  register: _cms_catalog_slurp
  delegate_to: localhost
  become: false
  failed_when: false

- name: Parse catalog file and merge into entries dict
  when:
    - _cms_catalog_slurp.content is defined
    - _cms_catalog_slurp.content | length > 0
  block:
    - name: Decode and parse catalog YAML
      ansible.builtin.set_fact:
        _cms_catalog_parsed: "{{ _cms_catalog_slurp.content | b64decode | from_yaml }}"

    # umbrella #201 WP3a runtime contract: topology_params instance files
    # (topology_ref targets) live in the same catalog dir and MUST reach the
    # pod's mounted catalog alongside the entries — the console's fail-closed
    # loader refuses a topology deploy whose ref'd file is absent. The
    # console's own entry loader was gate-verified to skip non-entry files
    # cleanly, so mounting them is safe.
    - name: Skip file that is neither a catalog entry nor a topology_params doc
      ansible.builtin.debug:
        msg: "catalog: {{ _cms_catalog_file_item.path }} lacks 'key'/'topology_params' — skipping"
      when:
        - _cms_catalog_parsed.key is not defined
        - _cms_catalog_parsed.topology_params is not defined

    - name: Merge catalog entry or topology_params doc into entries dict
      ansible.builtin.set_fact:
        _cms_catalog_entries: "{{ _cms_catalog_entries | combine({ _cms_catalog_file_item.path | basename: _cms_catalog_parsed }) }}"
      when: _cms_catalog_parsed.key is defined or _cms_catalog_parsed.topology_params is defined
