---
dmf_promsd_namespace: monitoring
dmf_promsd_release_name: dmf-promsd

# Image from cluster-internal Zot (seeded by 630-zot-seed-platform.yml).
dmf_promsd_image_repository: "registry.{{ cert_manager_cluster_domain | default('dmf.example.com') }}/dmf-promsd"
# Image tag: read from the dmf-promsd checkout's VERSION at `origin/main`, NOT
# the operator's working tree (#135, mirrors #119). The image is published to
# GHCR only for released versions on main; reading the local working file meant
# a clone parked on a feature branch silently deployed a stale (or
# never-published) tag. `git show origin/main:VERSION` is deterministic and
# independent of the checked-out branch (offline-safe, last-fetched ref).
# Override with dmf_promsd_image_tag_override for hotfix testing only.
dmf_promsd_image_tag: "{{ dmf_promsd_image_tag_override | default(lookup('pipe', 'git -C ' ~ role_path ~ '/../../../../../../dmf-promsd show origin/main:VERSION') | trim) }}"
dmf_promsd_image_pull_policy: IfNotPresent

# NetBox API — in-cluster svc DNS (ADR-0023, plain HTTP).
# netbox_namespace is defined by the netbox role; fall back to 'netbox'.
dmf_promsd_netbox_url: "http://netbox.{{ netbox_namespace | default('netbox') }}.svc.cluster.local"
dmf_promsd_netbox_validate_certs: false

# Cache TTL — decoupled poll cadence per ADR-0038 (Prometheus refresh
# is 30s, adapter cache ~45s, worst-case churn ≈75s).
dmf_promsd_cache_ttl_seconds: 45

# ESO ExternalSecret
dmf_promsd_eso_secret_name: dmf-promsd-netbox
dmf_promsd_eso_remote_ref_key: "secret/apps/netbox/runtime"
dmf_promsd_eso_remote_ref_property: promsd_api_token
dmf_promsd_eso_refresh_interval: 1h
dmf_promsd_cluster_secret_store_name: "{{ eso_cluster_secret_store_name | default('openbao') }}"
dmf_promsd_external_secret_api_version: "{{ eso_crd_api_version | default('external-secrets.io/v1') }}"

# OpenBao observer endpoint and TLS trust. The server uses a self-signed
# certificate in the openbao namespace; only its public tls.crt is copied to
# this namespace, never the Secret or private key.
dmf_promsd_openbao_address: "https://openbao.{{ openbao_namespace | default('openbao') }}.svc.cluster.local:8200"
dmf_promsd_openbao_auth_mount: kubernetes
dmf_promsd_openbao_auth_role: dmf-promsd-observer
dmf_promsd_openbao_observer_interval_seconds: 60
dmf_promsd_openbao_service_account: dmf-promsd-openbao-observer
dmf_promsd_openbao_token_audience: dmf-openbao-observer
dmf_promsd_openbao_token_expiration_seconds: 600
dmf_promsd_openbao_jwt_mount_path: /var/run/openbao-token
dmf_promsd_openbao_jwt_file: "{{ dmf_promsd_openbao_jwt_mount_path }}/token"
dmf_promsd_openbao_tls_namespace: "{{ openbao_namespace | default('openbao') }}"
dmf_promsd_openbao_tls_secret_name: "{{ openbao_tls_secret_name | default('openbao-tls') }}"
dmf_promsd_openbao_ca_configmap_name: dmf-promsd-openbao-ca
dmf_promsd_openbao_ca_mount_path: /var/run/openbao-ca
dmf_promsd_openbao_ca_file: "{{ dmf_promsd_openbao_ca_mount_path }}/ca.crt"

# Sandbox-sized resources — lightweight FastAPI adapter, no TSDB.
# Sized between alertmanager (20m/64Mi) and promtail (100m/128Mi).
dmf_promsd_resources:
  requests:
    # 50m -> 15m. Measured p95 2.4m / max 2.4m — a
    # NetBox-polling SD adapter with no TSDB, flat by nature. The 200m
    # limit below is untouched.
    cpu: 15m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Probe health endpoints.
dmf_promsd_liveness_path: /healthz
dmf_promsd_readiness_path: /readyz
