---
# The main ClusterSecretStore, with the auth method that eso_openbao_auth_method
# selects. Included by main.yml, and by the render test.

# An update of an existing custom resource patches it, and a patch merges maps: the
# old `appRole` or `kubernetes` key would stay beside the new one, and a store with
# two auth methods is ambiguous. So when the store holds a key other than the selected
# method's, the task replaces it (force). The API server rejects a replace of a custom
# resource that does not carry the current `metadata.resourceVersion`, so the task
# sends the version it read. A writer that changes the store in between makes the
# replace fail with a conflict instead of losing that write. The check after the apply
# fails unless the store holds exactly the selected method.
- name: Read the existing ClusterSecretStore
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: "{{ eso_crd_api_version }}"
    kind: ClusterSecretStore
    name: "{{ eso_cluster_secret_store_name }}"
  register: _eso_css_before

- name: Decide whether the store needs a replace
  ansible.builtin.set_fact:
    _eso_css_replace: "{{ (_eso_css_before.resources | length > 0) and (_eso_css_before.resources[0].spec.provider.vault.auth.keys() | list != [eso_openbao_auth_key]) }}"

- name: Create ClusterSecretStore (OpenBao/Vault provider)
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    force: "{{ _eso_css_replace }}"
    definition:
      apiVersion: "{{ eso_crd_api_version }}"
      kind: ClusterSecretStore
      metadata:
        name: "{{ eso_cluster_secret_store_name }}"
        resourceVersion: "{{ _eso_css_before.resources[0].metadata.resourceVersion if _eso_css_replace else omit }}"
      spec:
        provider:
          vault:
            server: "{{ eso_openbao_url }}"
            path: "{{ eso_openbao_kv_mount }}"
            version: "{{ eso_openbao_kv_version }}"
            caBundle: "{{ eso_openbao_ca_bundle | b64encode if eso_openbao_ca_bundle | length > 0 else omit }}"
            auth: "{{ eso_openbao_auth_block }}"

- name: Read the ClusterSecretStore back
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: "{{ eso_crd_api_version }}"
    kind: ClusterSecretStore
    name: "{{ eso_cluster_secret_store_name }}"
  register: _eso_css_after

- name: Assert the store holds exactly the selected auth method
  ansible.builtin.assert:
    that:
      - _eso_css_after.resources | length == 1
      - _eso_css_after.resources[0].spec.provider.vault.auth.keys() | list == [eso_openbao_auth_key]
    fail_msg: >-
      The ClusterSecretStore {{ eso_cluster_secret_store_name }} does not hold
      exactly the {{ eso_openbao_auth_method }} auth block.
