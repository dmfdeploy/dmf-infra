---
# Write the policy of the snapshot job. The openbao role applies its policies as
# policy-reconciler on every run after the first. This file does the same: the
# initial root token is revoked when the openbao role ends, so no root token
# exists by the time this role runs.
#
# The write happens only when the stored policy differs from the file, so a rerun
# with the policy in place changes nothing. Any failed read or write stops the
# play.

- name: Establish an OpenBao policy-reconciler session
  ansible.builtin.include_role:
    name: common/openbao-session
  vars:
    openbao_session_mode: policy-reconciler
    openbao_session_namespace: "{{ openbao_namespace }}"

- name: Read the openbao-raft-snapshot policy
  ansible.builtin.include_role:
    name: common/openbao-cli
  vars:
    openbao_cli_operation: read the openbao-raft-snapshot policy
    openbao_cli_pod: "{{ _openbao_session_pod }}"
    openbao_cli_namespace: "{{ openbao_namespace }}"
    openbao_cli_token: "{{ _openbao_session_client_token }}"
    openbao_cli_calls:
      - args: [read, -format=json, "sys/policies/acl/{{ openbao_raft_snapshot_policy_name }}"]
    openbao_cli_register: _openbao_raft_snapshot_policy_read
    openbao_cli_tolerate_stderr: ["No value found"]

# The policy text comes from a file that a lookup finds through the path of the
# running role. Render it here, in this role, before the shared role runs.
- name: Render the openbao-raft-snapshot policy text
  ansible.builtin.set_fact:
    _openbao_raft_snapshot_policy_text: "{{ openbao_raft_snapshot_policy_text }}"
  no_log: true

- name: Write the openbao-raft-snapshot policy
  ansible.builtin.include_role:
    name: common/openbao-cli
  vars:
    openbao_cli_operation: write the openbao-raft-snapshot policy
    openbao_cli_pod: "{{ _openbao_session_pod }}"
    openbao_cli_namespace: "{{ openbao_namespace }}"
    openbao_cli_token: "{{ _openbao_session_client_token }}"
    openbao_cli_calls:
      - args: [policy, write, "{{ openbao_raft_snapshot_policy_name }}", "-"]
        input: "{{ _openbao_raft_snapshot_policy_text | string }}"
    openbao_cli_register: _openbao_raft_snapshot_policy_write
    openbao_cli_changed: true
  when: >-
    _openbao_raft_snapshot_policy_read.rc != 0
    or ((_openbao_raft_snapshot_policy_read.stdout | from_json).data.policy | trim)
       != (_openbao_raft_snapshot_policy_text | trim)
