---
# NetworkPolicy defaults for the OpenBao ingress boundary.

network_policies_openbao_namespace: openbao
network_policies_openbao_service_name: openbao
network_policies_openbao_allow_cluster_peer_namespace: openbao
network_policies_openbao_allow_eso_namespace: external-secrets
# Label of the approval executor's pods (openbao_executor_pod_label in the openbao
# role). The executor runs in the OpenBao namespace.
network_policies_openbao_allow_executor_pod_label: approval-executor
