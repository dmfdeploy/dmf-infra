# Rule tests for dmf-promsd's bounded OpenBao AppRole lifecycle metrics.
# Render alerts.yaml.j2 as described in test_awx_replica_divergence_424.promtool.yml.
rule_files:
  - rendered_alerts.yml
  - ../files/rules/recording.yaml
evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'dmf_openbao_approle_secret_id_expires_at_seconds{role="external-secrets",target="external-secrets"}'
        values: "30000x20"
      - series: 'dmf_openbao_approle_secret_id_ttl_seconds{role="external-secrets",target="external-secrets"}'
        values: "90000x20"
      - series: 'dmf_openbao_approle_rotation_metadata_available{target="external-secrets"}'
        values: "1x20"
    promql_expr_test:
      - expr: dmf:openbao_approle_rotation_due
        eval_time: 1m
        exp_samples:
          - labels: 'dmf:openbao_approle_rotation_due{role="external-secrets",target="external-secrets"}'
            value: 1
    alert_rule_test:
      - eval_time: 16m
        alertname: OpenBaoAppRoleRotationDue
        exp_alerts:
          - exp_labels:
              severity: info
              category: security
              role: external-secrets
              target: external-secrets
            exp_annotations:
              summary: OpenBao AppRole rotation due
              description: At least two thirds of the active SecretID lifetime has elapsed.
              runbook_url: https://github.com/dmfdeploy/dmf-runbooks/blob/main/docs/alerts.md#openbao-approle-rotation

  - interval: 1m
    input_series:
      - series: 'dmf_openbao_approle_rotation_metadata_available{target="external-secrets"}'
        values: "1x1620"
      - series: 'dmf_openbao_approle_rotation_latest_run_timestamp_seconds{role="external-secrets",target="external-secrets",kind="manual",outcome="success"}'
        values: "1x1620"
      - series: 'dmf_openbao_approle_rotation_last_scheduled_success_seconds{role="external-secrets",target="external-secrets"}'
        values: "1x1620"
    alert_rule_test:
      - eval_time: 27h
        alertname: OpenBaoAppRoleScheduledRotationHeartbeatMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              category: security
              role: external-secrets
              target: external-secrets
            exp_annotations:
              summary: Scheduled rotation heartbeat missing
              description: No successful scheduled rotation is recorded within 26 hours. Manual runs do not reset this schedule heartbeat.
              runbook_url: https://github.com/dmfdeploy/dmf-runbooks/blob/main/docs/alerts.md#openbao-approle-rotation

  - interval: 1m
    input_series:
      - series: 'dmf_openbao_approle_secret_id_expires_at_seconds{role="external-secrets",target="external-secrets"}'
        values: "518400x20"
      - series: 'dmf_openbao_approle_secret_id_ttl_seconds{role="external-secrets",target="external-secrets"}'
        values: "2592000x20"
      - series: 'dmf_openbao_approle_rotation_metadata_available{target="external-secrets"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: OpenBaoAppRoleSecretIDExpiryWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              category: security
              role: external-secrets
              target: external-secrets
            exp_annotations:
              summary: OpenBao AppRole SecretID nearing expiry
              description: Less than 25% but at least 10% of the active SecretID lifetime remains.
              runbook_url: https://github.com/dmfdeploy/dmf-runbooks/blob/main/docs/alerts.md#openbao-approle-rotation

  - interval: 1m
    input_series:
      - series: 'dmf_openbao_approle_secret_id_expires_at_seconds{role="external-secrets",target="external-secrets"}'
        values: "100000x10"
      - series: 'dmf_openbao_approle_secret_id_ttl_seconds{role="external-secrets",target="external-secrets"}'
        values: "2592000x10"
      - series: 'dmf_openbao_approle_rotation_metadata_available{target="external-secrets"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: OpenBaoAppRoleSecretIDExpiryCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              category: security
              role: external-secrets
              target: external-secrets
            exp_annotations:
              summary: OpenBao AppRole SecretID near expiry
              description: Less than 10% of the active SecretID lifetime remains.
              runbook_url: https://github.com/dmfdeploy/dmf-runbooks/blob/main/docs/alerts.md#openbao-approle-rotation

  # Null starting value: metadata is available and the heartbeat series is
  # absent. Neither heartbeat alert fires inside the 26h grace; the
  # never-recorded alert fires once the grace has passed.
  - interval: 1m
    input_series:
      - series: 'dmf_openbao_approle_rotation_metadata_available{target="external-secrets"}'
        values: "1x1700"
    alert_rule_test:
      - eval_time: 16m
        alertname: OpenBaoAppRoleScheduledRotationHeartbeatMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: OpenBaoAppRoleScheduledRotationHeartbeatNeverRecorded
        exp_alerts: []
      - eval_time: 25h
        alertname: OpenBaoAppRoleScheduledRotationHeartbeatNeverRecorded
        exp_alerts: []
      - eval_time: 26h30m
        alertname: OpenBaoAppRoleScheduledRotationHeartbeatNeverRecorded
        exp_alerts:
          - exp_labels:
              severity: critical
              category: security
              target: external-secrets
            exp_annotations:
              summary: Scheduled rotation heartbeat never recorded
              description: Rotation metadata has been available for 26 hours with no successful scheduled rotation recorded. Manual runs do not reset this schedule heartbeat.
              runbook_url: https://github.com/dmfdeploy/dmf-runbooks/blob/main/docs/alerts.md#openbao-approle-rotation

  # Within grace: the last scheduled success is 25h old at the evaluation.
  - interval: 1m
    input_series:
      - series: 'dmf_openbao_approle_rotation_metadata_available{target="external-secrets"}'
        values: "1x1620"
      - series: 'dmf_openbao_approle_rotation_last_scheduled_success_seconds{role="external-secrets",target="external-secrets"}'
        values: "0x1620"
    alert_rule_test:
      - eval_time: 25h
        alertname: OpenBaoAppRoleScheduledRotationHeartbeatMissing
        exp_alerts: []
      - eval_time: 25h
        alertname: OpenBaoAppRoleScheduledRotationHeartbeatNeverRecorded
        exp_alerts: []

  # The two availability alerts stay at info until the metadata writer and
  # the observer identity exist on every environment.
  - interval: 1m
    input_series:
      - series: 'up{job="dmf-promsd-approle-rotation"}'
        values: "0x10"
      - series: 'dmf_openbao_approle_rotation_metadata_available{target="external-secrets"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenBaoAppRoleObserverDown
        exp_alerts:
          - exp_labels:
              severity: info
              category: security
              job: dmf-promsd-approle-rotation
            exp_annotations:
              summary: OpenBao AppRole lifecycle observer is unavailable
              description: Prometheus cannot scrape the dmf-promsd lifecycle observer for 5m. Rotation metadata freshness and expiry alerts cannot be evaluated.
              runbook_url: https://github.com/dmfdeploy/dmf-runbooks/blob/main/docs/alerts.md#openbao-approle-rotation
      - eval_time: 15m
        alertname: OpenBaoAppRoleMetadataUnavailable
        exp_alerts:
          - exp_labels:
              severity: info
              category: security
              target: external-secrets
            exp_annotations:
              summary: OpenBao rotation metadata unavailable
              description: The observer has no current valid metadata for this configured runtime target. Cached expiry and run-state series are withheld.
              runbook_url: https://github.com/dmfdeploy/dmf-runbooks/blob/main/docs/alerts.md#openbao-approle-rotation
