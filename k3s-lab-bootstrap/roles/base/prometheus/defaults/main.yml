---
prometheus_namespace: monitoring
# 50Gi sized for 30-day retention. Recompute if scrape volume grows materially.
# Rule of thumb: a small 3-node DMF lab produces ~1GB/day of TSDB blocks at the
# default 1m scrape; 30 days ≈ 30GB, +5GB WAL/buffer ≈ 35GB, headroom to 50Gi.
prometheus_storage_size: 50Gi
prometheus_storage_class: "{{ dmf_storage_class | default('longhorn') }}"
# Retention settings:
# - retentionSize controls TSDB blocks only, NOT the WAL
# - WAL can use ~300MB before compaction (2h default)
# - 40GB blocks + 1GB WAL + 9GB headroom = 50GB
# Operator-debug retention only; not a compliance audit trail (those go to
# Loki + S3 per docs/processes/audit-log-retention-policy.md).
prometheus_retention: 30d
prometheus_retention_size: 40GB
prometheus_path: /prometheus
prometheus_helm_repo: https://prometheus-community.github.io/helm-charts
prometheus_helm_chart_version: "25.8.0"

# Resource requests/limits to steer scheduling and avoid overcommit.
# umbrella dmfdeploy/dmfdeploy#258 platform request-budget audit (J1 gate):
# two sustained samples on v5on-r8aw (10-min idle + 15-min under a loaded
# source-pod run, 30 samples each) measured avg 11m/max 45m CPU and
# avg 855Mi/max 879Mi memory — the 200m CPU request was ~4.5x the observed
# max, pure over-declaration inflating the platform's scheduling claim on
# the single constrained node. Trimmed CPU request to 100m (still >2x the
# measured max spike). Memory request stays 1024Mi — honest against the
# measured 855Mi avg with headroom for spikes, not blindly copied down.
# Limits unchanged.
prometheus_resources:
  requests:
    # umbrella #299 WP1: 100m -> 35m. Measured p95 11.5m / max 49m against
    # the 500m limit below, which is untouched — scrape-storm burst headroom
    # is unchanged, only the scheduling reservation comes down.
    cpu: 35m
    memory: 1024Mi
  limits:
    cpu: 500m
    memory: 1536Mi

# umbrella #276: measured request honesty (2026-07-24 sample archive);
# requests-only, no limits.
prometheus_kube_state_metrics_resources:
  requests:
    cpu: 10m
    memory: 48Mi

prometheus_node_exporter_resources:
  requests:
    cpu: 10m
    memory: 32Mi

# umbrella #276: the configmap-reload SIDECAR only — the main server
# container's own prometheus_resources above is untouched.
prometheus_configmap_reload_resources:
  requests:
    cpu: 5m
    memory: 32Mi

# Alertmanager + minimum alert rules.
# Set webhook URLs via inventory or -e. Leave empty to disable alerting entirely
# (chart still installs Prometheus; Alertmanager component is not deployed).
prometheus_alertmanager_enabled: true
prometheus_alertmanager_storage_size: 512Mi
prometheus_alertmanager_storage_class: "{{ dmf_storage_class | default('longhorn') }}"

# ntfy topic URL for real alerts — full https URL including topic, e.g.
# https://ntfy.dmf.example.com/homelab-alerts
# Alertmanager POSTs its native JSON payload to this URL; ntfy publishes the
# raw body as a notification. If you want prettier titles/priorities, deploy
# a bridge (xenrox/ntfy-alertmanager) between AM and ntfy — the URL stays the
# same at the ntfy end; only the bridge target changes on the AM side.
prometheus_alertmanager_ntfy_url: ""

# Raw Alertmanager webhook JSON is unreadable in ntfy. When enabled, deploy a
# small in-cluster formatter bridge and point Alertmanager at that service.
prometheus_ntfy_bridge_enabled: true
prometheus_ntfy_bridge_name: ntfy-alertmanager-bridge
prometheus_ntfy_bridge_image: python:3.13-alpine
prometheus_ntfy_bridge_replicas: 1

# healthchecks.io ping URL for the Watchdog dead-man's switch. The Watchdog rule
# fires constantly; Alertmanager pings this URL on every group interval. If
# Alertmanager (or Prometheus, or the cluster) dies, pings stop and
# healthchecks.io raises an external alert.
# The Watchdog RULE itself deploys unconditionally (it is also the console's
# are-we-ok liveness proof); only this external ping path needs Alertmanager.
prometheus_alertmanager_watchdog_url: ""

# Alert thresholds (override in inventory when lab characteristics differ).
prometheus_alert_pv_full_threshold: 0.85
prometheus_alert_crashloop_for: 10m
prometheus_alert_node_down_for: 5m

# Are-we-OK suite thresholds (dmfdeploy/dmfdeploy#166, templates/rules/
# alerts.yaml.j2). First-guess values tuned for a node that is NORMALLY near
# the edge (warn-before-crit + debounce); the OQ-5 live baselining pass may
# move them — override per env in inventory, don't edit the rule template.
prometheus_alert_mem_avail_warn_ratio: 0.10
prometheus_alert_mem_avail_crit_ratio: 0.05
# Sustained swap in+out pages/s (~4 MB/s at 4k pages) — dmfdeploy#106 signature.
prometheus_alert_swap_io_pages_rate: 1000
prometheus_alert_load_per_core: 4.0
prometheus_alert_iowait_ratio: 0.25
prometheus_alert_temp_warn_celsius: 70
prometheus_alert_temp_crit_celsius: 80
# runbook_url base for every alert annotation (anchors = lowercase alertname).
prometheus_alert_runbook_base: "https://github.com/dmfdeploy/dmf-runbooks/blob/main/docs/alerts.md"

# Runaway-workload guard thresholds (dmfdeploy/dmfdeploy#313, templates/
# rules/alerts.yaml.j2's dmf-runaway-workload group). First-guess values —
# override per env in inventory, don't edit the rule template. Catches
# #308's own live numbers (~40k lines/min, ~170m CPU) and would have caught
# the promtail 1.53-core/76h episode via the CPU-ratio pair.
prometheus_alert_log_line_rate_warn_per_min: 1000
prometheus_alert_log_line_rate_crit_per_min: 10000
prometheus_alert_log_byte_rate_warn_bytes_per_sec: 262144   # 256 KiB/s
prometheus_alert_log_byte_rate_crit_bytes_per_sec: 1048576  # 1 MiB/s
prometheus_alert_cpu_over_request_warn_ratio: 2.0
prometheus_alert_cpu_over_request_crit_ratio: 3.0
# Shared `for:` debounce for the three mandatory drop alerts (promtail's own
# limit stage + Loki's per-stream limits) — these are never-silent guards,
# not saturation signals, so a single short debounce covers all three.
prometheus_alert_ingestion_drop_for: 2m

# Static blackbox probe lanes (dmfdeploy/dmfdeploy#166 WP-D) — the four probe
# lanes from plan D5 that have NO NetBox object (ADR-0038 covers platform
# apps via dmf-promsd; these are infrastructure anchors below/outside that
# model). Rendered into the `dmf-static-probes` job in scrape_configs.yml.j2;
# each entry's `module` must exist in blackbox_modules (base/blackbox-exporter)
# and `lane`/`name` become the lane/probe_name labels the alert suite and
# dashboards key on. Entries with an empty target are skipped at render.
# LAN-gateway lane intentionally ships no default: cloud envs have no LAN.
# Add per env in inventory, e.g.:
#   - { name: lan-gateway, lane: lan-gateway, module: icmp, target: "<lan-gateway>" }
# LOCK-STEP: the default probe_name set below is mirrored by
# monitoring_verify_required_probes (playbooks/vertical-monitoring/
# 195-are-we-ok-verify.yml) and the verdict expression in
# roles/base/grafana/files/dmf-are-we-ok.json — change all three together.
prometheus_static_probe_interval: 60s
prometheus_static_probe_targets:
  - name: internet-cloudflare
    lane: internet
    module: icmp
    target: "1.1.1.1"
  - name: internet-google
    lane: internet
    module: icmp
    target: "8.8.8.8"
  - name: cluster-dns
    lane: cluster-dns
    module: dns
    target: "kube-dns.kube-system.svc.cluster.local:53"
  - name: cluster-ingress
    lane: ingress
    module: tcp_connect
    target: "traefik.kube-system.svc.cluster.local:443"
  # sd-pipeline lane: /healthz = liveness (feeds PromsdDown), /readyz =
  # boolean cache freshness (feeds PromsdStale; Amendment A — /healthz is
  # always 200 and can never carry freshness).
  - name: promsd-live
    lane: sd-pipeline
    module: http_2xx
    target: "http://dmf-promsd.monitoring.svc.cluster.local:8000/healthz"
  - name: promsd-ready
    lane: sd-pipeline
    module: http_2xx
    target: "http://dmf-promsd.monitoring.svc.cluster.local:8000/readyz"
  - name: netbox-http
    lane: sd-pipeline
    module: http_2xx
    target: "http://netbox.netbox.svc.cluster.local/"
