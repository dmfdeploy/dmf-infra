---
# Create one ClusterSecretStore for each credential in _os_credentials. Each store
# trusts the OpenBao CA certificate, read from the CA's own Secret, never the
# OpenBao certificate itself. A renewal of the OpenBao certificate then changes
# nothing the stores trust, and a renewal of the CA reaches them on the next run.
# The CA's names and the wait for the CA come from the cert-manager role, and the
# namespace follows this role's variable.
# A site that trusts the endpoint another way sets
# object_storage_eso_openbao_external_trust, and the stores then carry no bundle.
# Without it, a site that has no OpenBao CA yet stops with the instruction to run
# 320-cert-manager.yml.
- name: Read the OpenBao CA certificate
  ansible.builtin.include_role:
    name: base/cert-manager
    tasks_from: openbao-ca-bundle.yml
  vars:
    cert_manager_openbao_namespace: "{{ openbao_namespace }}"
  when:
    - object_storage_eso_openbao_url is match('^https://')
    - not (object_storage_eso_openbao_external_trust | bool)

- name: Set the OpenBao CA bundle for the stores
  ansible.builtin.set_fact:
    _os_ca_b64: "{{ (cert_manager_openbao_ca_bundle_pem | b64encode) if (cert_manager_openbao_ca_bundle_pem is defined and not (object_storage_eso_openbao_external_trust | bool)) else '' }}"
  no_log: true

- name: Create ClusterSecretStore
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: "{{ object_storage_eso_crd_api_version }}"
      kind: ClusterSecretStore
      metadata:
        name: "openbao-{{ item.logical_dashed }}"
      spec:
        provider:
          vault:
            server: "{{ object_storage_eso_openbao_url }}"
            path: "{{ object_storage_openbao_kv_mount }}"
            version: "{{ object_storage_openbao_kv_version }}"
            caBundle: "{{ _os_ca_b64 if _os_ca_b64 | length > 0 else omit }}"
            auth:
              appRole:
                path: "{{ object_storage_openbao_approle_mount }}"
                roleId: "{{ item.role_id }}"
                secretRef:
                  name: "{{ item.logical_dashed }}-openbao-approle"
                  namespace: "{{ object_storage_eso_namespace }}"
                  key: id
  loop: "{{ _os_credentials }}"
  loop_control:
    label: "{{ item.logical }}"
  no_log: true

