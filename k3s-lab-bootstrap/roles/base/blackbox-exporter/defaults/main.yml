---
blackbox_namespace: monitoring
blackbox_helm_repo: https://prometheus-community.github.io/helm-charts
blackbox_helm_chart_version: "11.11.0"

# fullnameOverride ensures the Service is named `blackbox` (matching the
# vendored prometheus scrape config which targets `blackbox.monitoring.svc`).
blackbox_fullname_override: blackbox

# Blackbox probe modules — must match the NetBox choice set
# (dmf_blackbox_probe_modules). Six modules cover the DMF probe lanes.
blackbox_modules:
  # In-cluster DNS health lane (dmfdeploy/dmfdeploy#166 WP-D): the probe
  # TARGET is the DNS server (CoreDNS), which resolves query_name below.
  dns:
    prober: dns
    timeout: 5s
    dns:
      query_name: kubernetes.default.svc.cluster.local
      query_type: A
      transport_protocol: udp
      preferred_ip_protocol: ip4
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []
      method: GET
      preferred_ip_protocol: ip4
  # For targets whose healthy root response is a redirect that must not be
  # dereferenced (ADR-0038 Amendment B). Canonical case: Grafana answers /
  # with 302 → /login, and following it chains through OAuth auto-login to
  # the external local-CA auth URL, which fails TLS verification. With
  # follow_redirects off the probe never leaves the in-cluster target.
  http_2xx_302:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200, 301, 302, 303, 307, 308]
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: false
  http_2xx_insecure:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []
      method: GET
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true
  tcp_connect:
    prober: tcp
    timeout: 5s
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

# ICMP probes need CAP_NET_RAW: chart 11.11.0's default securityContext
# drops ALL capabilities, so the icmp module fails silently without this.
# Adds NET_RAW (only) back to the blackbox container — no other privilege
# broadening. Set false on envs that strip the icmp lanes.
blackbox_allow_icmp: true

# Sandbox-sized resources — blackbox is lightweight (dispatches probes,
# no TSDB or heavy state). Sized above alertmanager (20m/64Mi) since it
# runs multiple prober goroutines, but well under Prometheus.
blackbox_resources:
  requests:
    # umbrella #299 WP1: 50m -> 10m. Measured p95 1.0m / max 1.1m — the
    # prober goroutines are almost entirely I/O wait. The 100m limit below
    # is untouched, so a probe fan-out can still burst 10x its request.
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
