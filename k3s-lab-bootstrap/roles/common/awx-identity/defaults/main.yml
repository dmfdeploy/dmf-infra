---
# The two inputs that name the AWX instance for the platform
# (dmfdeploy/dmfdeploy#1027). The NetBox seed, the Prometheus alert rules, the
# Grafana dashboard and the AWX deployer each list this role as a dependency,
# so every play that uses one of them reads these two names and no others.
# Set them in the inventory or with -e. Role defaults have the lowest
# precedence, so an inventory value wins.
#
# Nothing derived from them is stored. The Service name, the port and the probe
# instance come from the filters in filter_plugins/awx_identity.py, at the point
# of use, so no variable can move one reader without the others.
awx_namespace: awx
awx_instance_name: awx
