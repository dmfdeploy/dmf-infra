---
# Runs before the consumer's own tasks. The consumers repeat the presence check
# as their first task, so a play that drops this dependency still fails there.
# The presence check comes first so that a missing or empty value names both
# inputs, whichever of them is wrong.
- name: Check that the AWX namespace and instance name are set
  ansible.builtin.assert:
    that:
      - awx_namespace is defined and awx_namespace is not none and (awx_namespace | string | length) > 0
      - awx_instance_name is defined and awx_instance_name is not none and (awx_instance_name | string | length) > 0
    fail_msg: >-
      awx_namespace and awx_instance_name must both be set to a non-empty
      name. Set them in the inventory or with -e.
    quiet: true

# Both go into PromQL strings in the NetboxProbeLaneDown and AWXReplicaDivergence
# rules and in the platform-services dashboard query, so they must be plain
# Kubernetes names: no quote, backslash, brace, dollar sign or newline. The
# filters in this role check the same shape where they are used.
# \Z anchors the end of the string; $ would also accept a trailing newline.
- name: Check the shape of the AWX namespace and instance name
  ansible.builtin.assert:
    that:
      - awx_namespace is match('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\Z')
      - awx_instance_name is match('^(?=.{1,253}\Z)[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*\Z')
    fail_msg: >-
      awx_namespace must be a DNS label and awx_instance_name a DNS subdomain,
      because the alert rules and the dashboard embed them.
    quiet: true
