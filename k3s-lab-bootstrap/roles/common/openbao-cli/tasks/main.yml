---
# The one place that runs the OpenBao command-line tool in a pod. Include it with
# `ansible.builtin.include_role: {name: openbao-cli}` and these variables:
#
#   openbao_cli_operation   what the call does, in a few words. Failure messages
#                           name it. Required.
#   openbao_cli_pod         the pod to run in. Required.
#   openbao_cli_namespace   default "openbao".
#   openbao_cli_token       the token for the call. Leave it out for a login, a
#                           status read or any call that needs none.
#   openbao_cli_calls       a list with one entry per call, run in order. Each entry
#                           has `args` (the words after `bao`) and may have `input`
#                           (the text `bao` reads from stdin for an argument of `-`,
#                           `key=-` or `password=-`) and `item` (anything the caller
#                           wants back next to that call's result).
#   openbao_cli_register    the name of the fact that receives the result. Required.
#                           It holds `results`, a list with `item`, `rc`, `stdout`
#                           and `stderr` per call. With one call, `rc`, `stdout` and
#                           `stderr` are also set at the top.
#   openbao_cli_allow_failure   true when the caller reads `rc` itself. The default
#                           is to fail on a non-zero exit code, and the calls after
#                           the failing one do not run. With it, every call runs.
#   openbao_cli_allow_exhausted_retries  true when the caller judges the last attempt
#                           itself. Without it, a retry that runs out fails the
#                           caller, even with `openbao_cli_allow_failure`.
#   openbao_cli_tolerate_stderr  a list of texts. A non-zero exit whose stderr holds
#                           one of them is not a failure (for example "No value
#                           found" for a path that does not exist).
#   openbao_cli_require_output  true to fail on an empty stdout.
#   openbao_cli_changed     true when a successful call changes OpenBao. Default false.
#   openbao_cli_retries, openbao_cli_delay, openbao_cli_until
#                           retry a call until `openbao_cli_until` is true. Write it
#                           as a template, "{{ openbao_cli_run.rc == 0 }}", which
#                           reads the attempt as `openbao_cli_run`. Ansible fills
#                           the template in on each attempt, not when the caller
#                           sets the variable.
#
# In check mode the command does not run. The result then has rc 0, no output and
# `changed` false, and nothing fails.
#
# Everything the call needs goes to the pod on stdin, one value per line: the
# token, the number of words, each word, then `input`. The program text below never
# changes, so no value is ever part of a program or of an argument list. A value
# cannot hold a newline, and the input check refuses one. Ansible expands `$NAME` in
# every argument of the command module, so a value in an argument list could be
# rewritten. Stdin is not expanded.
#
# Pipelining is on for the call alone, so Ansible does not copy a module file that
# holds the token to the node. `ANSIBLE_DEBUG` still prints module input, and the
# operator chooses to turn it on.
- name: Collect the reasons that the OpenBao command cannot run
  ansible.builtin.set_fact:
    _openbao_cli_invalid: >-
      {%- set bad = [] -%}
      {%- if openbao_cli_operation | default('') | length == 0 -%}{%- set _ = bad.append('no operation is named') -%}{%- endif -%}
      {%- if openbao_cli_pod | default('') | length == 0 -%}{%- set _ = bad.append('no pod is named') -%}{%- endif -%}
      {%- if openbao_cli_register | default('') | length == 0 -%}{%- set _ = bad.append('no result name is given') -%}{%- endif -%}
      {%- if (openbao_cli_token | default('') | string) is search('[\r\n]') -%}{%- set _ = bad.append('the token holds a line break') -%}{%- endif -%}
      {%- if openbao_cli_calls | default([]) is not sequence or openbao_cli_calls | default([]) is string or openbao_cli_calls | default([]) | length == 0 -%}
      {%- set _ = bad.append('there is no call') -%}
      {%- else -%}
      {%- for c in openbao_cli_calls -%}
      {%- if c.args is not defined or c.args is not sequence or c.args is string or c.args | length == 0 -%}
      {%- set _ = bad.append('call ' ~ loop.index ~ ' has no words') -%}
      {%- else -%}
      {%- if c.args | map('string') | select('search', '[\r\n]') | list | length > 0 -%}{%- set _ = bad.append('call ' ~ loop.index ~ ' has a word with a line break') -%}{%- endif -%}
      {%- if c.input is not defined and (c.args | map('string') | select('equalto', '-') | list | length > 0 or c.args | map('string') | select('search', '=-$') | list | length > 0) -%}
      {%- set _ = bad.append('call ' ~ loop.index ~ ' reads stdin but has no input') -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {{ bad }}
  no_log: true

- name: "Stop when the OpenBao command cannot run: {{ openbao_cli_operation | default('no operation named') }}"
  ansible.builtin.fail:
    msg: >-
      The OpenBao command "{{ openbao_cli_operation | default('no operation named') }}"
      cannot run: {{ _openbao_cli_invalid | join('; ') }}.
  when: _openbao_cli_invalid | length > 0

- name: Start the list of results
  ansible.builtin.set_fact:
    _openbao_cli_results: []
  no_log: true

- name: "Run the calls: {{ openbao_cli_operation }}"
  ansible.builtin.include_tasks: step.yml
  vars:
    openbao_cli_index: 0

- name: "Publish the result: {{ openbao_cli_operation }}"
  ansible.builtin.set_fact:
    "{{ openbao_cli_register }}": >-
      {%- set top = {'results': _openbao_cli_results} -%}
      {%- if _openbao_cli_results | length == 1 -%}
      {%- set _ = top.update({'rc': _openbao_cli_results[0].rc, 'stdout': _openbao_cli_results[0].stdout, 'stderr': _openbao_cli_results[0].stderr, 'changed': _openbao_cli_results[0].changed}) -%}
      {%- endif -%}
      {{ top }}
  no_log: true
