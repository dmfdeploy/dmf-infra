---
# Turns the captured `ak shell` stdout in _ak_oauth_exec into the credentials
# dict named by authentik_oauth_result_var. Separate from main.yml so that a
# fixture can run it without a cluster.
- name: Parse OAuth2Provider credentials (sentinel-delimited)
  ansible.builtin.set_fact:
    "{{ authentik_oauth_result_var }}": >-
      {{ (_ak_oauth_exec.stdout
          | regex_search('__AK_JSON__(.*?)__AK_JSON__', '\1') | first)
         | from_json }}
  no_log: true
