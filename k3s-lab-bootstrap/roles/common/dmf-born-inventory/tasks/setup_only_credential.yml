---
- name: Claim receipt and run the born-inventory SecretID transaction
  block:
    - name: Validate and atomically claim the setup request
      ansible.builtin.script: consume_setup_request.py
      environment:
        DMF_SETUP_REQUEST_ID: "{{ lookup('env', 'DMF_SETUP_REQUEST_ID') }}"
        DMF_SETUP_REQUEST_ENV_ID: "{{ dmf_env_id }}"
      register: _dmf_born_inventory_receipt_result
      changed_when: true
      no_log: true

    - name: Capture validated setup attribution
      ansible.builtin.set_fact:
        _dmf_born_inventory_setup_c5: "{{ _dmf_born_inventory_receipt_result.stdout | from_json }}"
      no_log: true

    - name: Discover OpenBao pod for setup credential issuance
      kubernetes.core.k8s_info:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: v1
        kind: Pod
        namespace: "{{ dmf_born_inventory_openbao_namespace }}"
        label_selectors:
          - "{{ dmf_born_inventory_openbao_pod_label_selector }}"
      register: _dmf_born_inventory_openbao_pod_info
      no_log: true

    - name: Require an OpenBao pod for setup credential issuance
      ansible.builtin.assert:
        that:
          - _dmf_born_inventory_openbao_pod_info.resources | length > 0
        fail_msg: OpenBao is unavailable for the setup inventory request.

    - name: Set OpenBao pod fact for setup credential issuance
      ansible.builtin.set_fact:
        _dmf_born_inventory_openbao_pod: "{{ _dmf_born_inventory_openbao_pod_info.resources[0].metadata.name }}"
      no_log: true

    - name: Request a short-lived audience-bound issuer JWT
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/rancher/k3s/k3s.yaml
          - -n
          - "{{ openbao_namespace }}"
          - create
          - token
          - "{{ openbao_born_inventory_setup_issuer_service_account }}"
          - --duration={{ openbao_born_inventory_setup_issuer_token_ttl }}
          - --audience={{ openbao_born_inventory_setup_issuer_audience }}
      register: _dmf_born_inventory_issuer_jwt_raw
      changed_when: true
      failed_when: false
      no_log: true

    - name: Require the setup issuer ServiceAccount and TokenRequest to be available
      ansible.builtin.assert:
        that:
          - _dmf_born_inventory_issuer_jwt_raw.rc | int == 0
          - _dmf_born_inventory_issuer_jwt_raw.stdout | trim | length > 0
        fail_msg: >-
          The born-inventory setup issuer ServiceAccount is unavailable. This
          cluster needs the reviewed privileged setup-issuer migration before
          a fresh setup receipt can be consumed; request a new receipt after
          that migration.

    - name: Authenticate setup issuer to OpenBao Kubernetes auth
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/rancher/k3s/k3s.yaml
          - -n
          - "{{ dmf_born_inventory_openbao_namespace }}"
          - exec
          - -i
          - "{{ _dmf_born_inventory_openbao_pod }}"
          - --
          - sh
          - -c
          - >-
            IFS= read -r ISSUER_JWT;
            bao write -format=json auth/kubernetes/login
            role={{ openbao_born_inventory_setup_issuer_auth_role }}
            jwt="$ISSUER_JWT"
      args:
        stdin: "{{ _dmf_born_inventory_issuer_jwt_raw.stdout | trim }}\n"
      environment:
        BAO_ADDR: https://127.0.0.1:8200
      register: _dmf_born_inventory_issuer_login_raw
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require the setup issuer Kubernetes auth role to be provisioned
      ansible.builtin.assert:
        that:
          - _dmf_born_inventory_issuer_login_raw.rc | int == 0
        fail_msg: >-
          The born-inventory setup issuer auth role is unavailable. This
          cluster needs the reviewed privileged setup-issuer migration before
          a fresh setup receipt can be consumed; the consumed receipt cannot
          be replayed, so request a new receipt after that migration.

    - name: Capture scoped OpenBao issuer token
      ansible.builtin.set_fact:
        _dmf_born_inventory_issuer_token: "{{ (_dmf_born_inventory_issuer_login_raw.stdout | from_json).auth.client_token }}"
      no_log: true

    - name: Generate one-use born-inventory SecretID candidate in memory
      ansible.builtin.set_fact:
        _dmf_born_inventory_secret_id_candidate: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Issue a caller-supplied one-hour one-use SecretID
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/rancher/k3s/k3s.yaml
          - -n
          - "{{ dmf_born_inventory_openbao_namespace }}"
          - exec
          - -i
          - "{{ _dmf_born_inventory_openbao_pod }}"
          - --
          - sh
          - -c
          - >-
            IFS= read -r BAO_TOKEN;
            IFS= read -r SECRET_ID;
            export BAO_TOKEN;
            bao write -format=json
            auth/approle/role/{{ openbao_born_inventory_role_name }}/custom-secret-id
            secret_id="$SECRET_ID" ttl=1h num_uses=1
      args:
        stdin: "{{ _dmf_born_inventory_issuer_token }}\n{{ _dmf_born_inventory_secret_id_candidate }}\n"
      environment:
        BAO_ADDR: https://127.0.0.1:8200
      register: _dmf_born_inventory_custom_id_raw
      changed_when: true
      no_log: true

    - name: Capture and verify the bounded SecretID response
      ansible.builtin.set_fact:
        _dmf_born_inventory_custom_id: "{{ (_dmf_born_inventory_custom_id_raw.stdout | from_json).data }}"
        _dmf_born_inventory_secret_id_accessor: "{{ ((_dmf_born_inventory_custom_id_raw.stdout | from_json).data.secret_id_accessor) | default('') }}"
      no_log: true

    - name: Fail closed unless OpenBao confirmed exact SecretID bounds
      ansible.builtin.assert:
        that:
          - _dmf_born_inventory_custom_id.secret_id == _dmf_born_inventory_secret_id_candidate
          - _dmf_born_inventory_custom_id.secret_id_ttl | int == 3600
          - _dmf_born_inventory_custom_id.secret_id_num_uses | int == 1
          - _dmf_born_inventory_secret_id_accessor | length > 0
        fail_msg: OpenBao did not confirm the required one-hour, one-use setup credential.

    - name: Log into OpenBao with the fresh born-inventory SecretID
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/rancher/k3s/k3s.yaml
          - -n
          - "{{ dmf_born_inventory_openbao_namespace }}"
          - exec
          - -i
          - "{{ _dmf_born_inventory_openbao_pod }}"
          - --
          - sh
          - -c
          - >-
            IFS= read -r SECRET_ID;
            bao write -format=json auth/approle/login
            role_id={{ _dmf_born_inventory_openbao_role_id }}
            secret_id="$SECRET_ID"
      args:
        stdin: "{{ _dmf_born_inventory_secret_id_candidate }}\n"
      environment:
        BAO_ADDR: https://127.0.0.1:8200
      register: _dmf_born_inventory_openbao_login_raw
      changed_when: false
      no_log: true

    - name: Capture short-lived born-inventory OpenBao token
      ansible.builtin.set_fact:
        _dmf_born_inventory_openbao_client_token: "{{ (_dmf_born_inventory_openbao_login_raw.stdout | from_json).auth.client_token }}"
      no_log: true

    - name: Read NetBox runtime secret with the fresh setup identity
      ansible.builtin.shell:
        cmd: >-
          printf '%s\n' "$OPENBAO_TOKEN" |
          kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
          -n {{ dmf_born_inventory_openbao_namespace }}
          exec -i {{ _dmf_born_inventory_openbao_pod }}
          -- sh -c '
          IFS= read -r BAO_TOKEN;
          export BAO_TOKEN;
          bao read -format=json secret/data/apps/netbox/runtime'
      register: _dmf_born_inventory_runtime_secret_raw
      changed_when: false
      failed_when: false
      environment:
        BAO_ADDR: https://127.0.0.1:8200
        OPENBAO_TOKEN: "{{ _dmf_born_inventory_openbao_client_token }}"
      no_log: true

  always:
    - name: Recover the SecretID accessor if issuance returned an incomplete response
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/rancher/k3s/k3s.yaml
          - -n
          - "{{ dmf_born_inventory_openbao_namespace }}"
          - exec
          - -i
          - "{{ _dmf_born_inventory_openbao_pod }}"
          - --
          - sh
          - -c
          - >-
            IFS= read -r BAO_TOKEN;
            IFS= read -r SECRET_ID;
            export BAO_TOKEN;
            bao write -format=json
            auth/approle/role/{{ openbao_born_inventory_role_name }}/secret-id/lookup
            secret_id="$SECRET_ID"
      args:
        stdin: "{{ _dmf_born_inventory_issuer_token | default('') }}\n{{ _dmf_born_inventory_secret_id_candidate | default('') }}\n"
      environment:
        BAO_ADDR: https://127.0.0.1:8200
      register: _dmf_born_inventory_accessor_lookup_raw
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - _dmf_born_inventory_issuer_token is defined
        - _dmf_born_inventory_secret_id_candidate is defined
        - _dmf_born_inventory_openbao_pod is defined

    - name: Capture recovered SecretID accessor for cleanup
      ansible.builtin.set_fact:
        _dmf_born_inventory_secret_id_accessor: >-
          {{ ((_dmf_born_inventory_accessor_lookup_raw.stdout | from_json).data.secret_id_accessor) | default('') }}
      no_log: true
      when:
        - _dmf_born_inventory_accessor_lookup_raw is defined
        - _dmf_born_inventory_accessor_lookup_raw.rc | int == 0

    - name: Revoke the consumed born-inventory SecretID accessor
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/rancher/k3s/k3s.yaml
          - -n
          - "{{ dmf_born_inventory_openbao_namespace }}"
          - exec
          - -i
          - "{{ _dmf_born_inventory_openbao_pod }}"
          - --
          - sh
          - -c
          - >-
            IFS= read -r BAO_TOKEN;
            IFS= read -r ACCESSOR;
            export BAO_TOKEN;
            bao write auth/approle/role/{{ openbao_born_inventory_role_name }}/secret-id-accessor/destroy
            secret_id_accessor="$ACCESSOR"
      args:
        stdin: "{{ _dmf_born_inventory_issuer_token | default('') }}\n{{ _dmf_born_inventory_secret_id_accessor | default('') }}\n"
      environment:
        BAO_ADDR: https://127.0.0.1:8200
      register: _dmf_born_inventory_accessor_destroy_raw
      changed_when: true
      no_log: true
      when:
        - _dmf_born_inventory_issuer_token is defined
        - _dmf_born_inventory_secret_id_accessor | default('') | length > 0

    - name: Clear setup credential material from Ansible facts
      ansible.builtin.set_fact:
        _dmf_born_inventory_issuer_jwt_raw: null
        _dmf_born_inventory_issuer_login_raw: null
        _dmf_born_inventory_issuer_token: null
        _dmf_born_inventory_secret_id_candidate: null
        _dmf_born_inventory_custom_id_raw: null
        _dmf_born_inventory_custom_id: null
        _dmf_born_inventory_accessor_lookup_raw: null
        _dmf_born_inventory_secret_id_accessor: null
        _dmf_born_inventory_openbao_login_raw: null
        _dmf_born_inventory_openbao_client_token: null
      no_log: true
