---
# Mirror one image whole (every platform) and prove the destination holds the
# source's exact index digest.
#
# Why: an index's attestation signs the INDEX digest. `skopeo copy` without
# --all keeps only one platform, which stores a different manifest, so the
# attestation no longer verifies and a node of the other architecture cannot
# pull (dmfdeploy/dmfdeploy#808). The digest is therefore compared on the RAW
# manifest bytes: plain `skopeo inspect` resolves an index to a single
# platform and would hide the difference.
#
# The task takes typed inputs only and builds every skopeo argument itself,
# so nothing a caller passes can add, remove or override an option.
#
# The digest check is its own file, zot-seed-mirror-verify.yml, so the test
# can run it alone against a copy made another way.
#
# Shared by playbooks/630-zot-seed-platform.yml and
# tests/test-zot-seed-index-mirror.yml (lockstep: if this file drifts, the
# test breaks).
#
# Inputs (set by the includer):
#   mirror_label            text for messages
#   mirror_src_ref          skopeo source reference (docker://..., oci:...)
#   mirror_dest_ref         skopeo destination reference
#   mirror_dest_tls_verify  verify destination TLS (boolean, required)
#   mirror_dest_authfile    destination auth file path (optional)
#   mirror_force            copy even when the digests already match (bool, optional)
# Output:
#   mirror_changed          true when a copy ran
#
# Needs skopeo >= 1.9 (Debian 12): `copy --all`, `--preserve-digests` and
# `inspect --raw` all predate it. `--multi-arch` is newer and not used.

- name: "Validate the inputs and build the destination arguments ({{ mirror_label }})"
  # Runs before any read or write of the destination.
  ansible.builtin.include_tasks: zot-mirror-dest-args.yml

- name: "Validate the source reference ({{ mirror_label }})"
  ansible.builtin.assert:
    that:
      - mirror_src_ref is string
      - mirror_src_ref | length > 0
      - not mirror_src_ref.startswith('-')
    fail_msg: "mirror_src_ref for {{ mirror_label }} must be a reference."
    quiet: true

- name: "Define the digest command ({{ mirror_label }})"
  ansible.builtin.include_tasks: zot-mirror-digest-argv.yml

- name: "Read the source index digest ({{ mirror_label }})"
  ansible.builtin.command:
    argv: "{{ _mirror_digest_argv + [mirror_src_ref] }}"
  register: _mirror_src_digest
  changed_when: false

- name: "Read the destination index digest ({{ mirror_label }})"
  # A missing destination is the normal first-run state, so a failure here
  # means "copy"; the copy below reports any real registry or auth error.
  ansible.builtin.command:
    argv: "{{ _mirror_digest_argv + _mirror_dest_inspect_args + [mirror_dest_ref] }}"
  register: _mirror_dest_digest
  changed_when: false
  failed_when: false

- name: "Copy the image ({{ mirror_label }})"
  ansible.builtin.command:
    argv: >-
      {{ ['skopeo', 'copy', '--all', '--preserve-digests', '--retry-times=5']
         + _mirror_dest_copy_args
         + [mirror_src_ref, mirror_dest_ref] }}
  register: _mirror_copy
  when: >-
    (mirror_force | default(false) | bool)
    or _mirror_dest_digest.rc != 0
    or (_mirror_dest_digest.stdout | trim) != (_mirror_src_digest.stdout | trim)
  changed_when: true

- name: "Verify the destination holds the source index ({{ mirror_label }})"
  # The digest captured before the copy is the only expectation.
  ansible.builtin.include_tasks: zot-seed-mirror-verify.yml
  vars:
    mirror_expected_digest: "{{ _mirror_src_digest.stdout | trim }}"

- name: "Record whether a copy ran ({{ mirror_label }})"
  ansible.builtin.set_fact:
    mirror_changed: "{{ _mirror_copy is not skipped }}"
