---
# DMF lifecycle: Operate stage (EBU white paper p.4).
# Operate is the steady state of a deployed facility. Nothing gets installed
# here, so these plays only read: they change nothing on the cluster.
# The deploy plays for the console, born-inventory and Zot run in the install
# path (bootstrap-*-provision-post-seed.yml and bootstrap-*-configure.yml).
# tests/test_lifecycle_operate_read_only.py fails if an inclusion reaches a
# playbook named 6xx-* or vertical-security/1xx-*, any role, or a task file
# outside playbooks/lifecycle/tasks. It does not detect a deploy playbook with
# another name or an inline mutating task. Review covers both.

# Endpoint probes: console /healthz, NetBox /api/, Zot /v2/.
- import_playbook: playbooks/lifecycle/operate-health-probes.yml
  tags: [lifecycle-operate, verify, health]

# Catalog drift detector: verifies NetBox lifecycle tags agree with Helm
# release presence for all dmf-media/catalog/*.yaml entries.
# References ADR-0012 (stage split) + ADR-0014 (AWX project layout).
- import_playbook: playbooks/lifecycle/operate-catalog-drift.yml
  tags: [lifecycle-operate, verify, catalog, drift]
