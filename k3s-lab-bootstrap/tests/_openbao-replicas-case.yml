---
# One case of the replica-count check on the role's normal path
# (test-openbao-grow-ha.yml). Case `via: role` runs the role's main.yml with the
# fake cluster: a count of 2 or 0 must refuse at its first task, before any change.
# Case `via: check` runs assert-replicas.yml, the file that main.yml and grow-ha.yml
# both include: a count of 1 or 3 must pass.
- name: "replicas {{ case.replicas }} — make a state directory"
  ansible.builtin.tempfile:
    state: directory
    prefix: openbao-replicas-
  register: _replicas_state
  changed_when: false

- name: "replicas {{ case.replicas }} — run the check"
  block:
    - name: Run the openbao role
      ansible.builtin.include_role:
        name: stack/operator/openbao
      vars:
        openbao_replicas: "{{ case.replicas }}"
      when: case.via == 'role'
    - name: Run assert-replicas.yml
      ansible.builtin.include_tasks: ../roles/stack/operator/openbao/tasks/assert-replicas.yml
      vars:
        openbao_replicas: "{{ case.replicas }}"
      when: case.via == 'check'
    - name: Record a pass
      ansible.builtin.set_fact:
        _outcome: pass
        _message: ""
  rescue:
    - name: Record the refusal
      ansible.builtin.set_fact:
        _outcome: refuse
        _message: "{{ ansible_failed_result.msg | default('') }}"
  environment:
    FAKE_STATE: "{{ _replicas_state.path }}"

- name: "replicas {{ case.replicas }} — look for changes to the cluster"
  ansible.builtin.stat:
    path: "{{ _replicas_state.path }}/k8s-mutations.log"
  register: _replicas_mutations

- name: "replicas {{ case.replicas }} — assert the outcome"
  ansible.builtin.assert:
    that:
      - _outcome == case.expect
      - case.expect == 'pass' or 'A two-pod Raft cluster cannot lose a pod' in _message
      - not _replicas_mutations.stat.exists
    fail_msg: "replicas {{ case.replicas }}: outcome {{ _outcome }}, message '{{ _message }}', changes logged: {{ _replicas_mutations.stat.exists }}"
    success_msg: "replicas {{ case.replicas }}: {{ _outcome }}"
