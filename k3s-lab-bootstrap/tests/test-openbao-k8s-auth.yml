---
# Tests of ESO's main store on Kubernetes auth.
#
#   1. The StatefulSet with the variable off equals the render from before
#      Kubernetes auth (tests/fixtures/openbao-statefulset-single-replica.json). With
#      it on, only serviceAccountName is added.
#   2. The ClusterSecretStore with approle equals the object that the role applied
#      before Kubernetes auth (tests/fixtures/eso-store-approle-before-kubernetes-auth.json,
#      without its resourceVersion), and a switch in either direction leaves exactly one
#      auth method. A replace that carries a stale resourceVersion fails and leaves the
#      store as it was.
#   3. The config step writes the reviewer config without a CA and a stored token, reads
#      it back, writes nothing on a rerun, and fails when the mount ignores the fields.
#   4. The installed-environment path writes with a temporary root token and revokes it
#      before it exits, also when a step fails; with no token it writes nothing. It writes the
#      Kubernetes-auth roles of the setup issuer and the rotation scheduler once when they
#      are missing, writes nothing for roles that exist and leaves them as they are, and, when a
#      ServiceAccount or a policy is missing, writes no role, fails with the names and revokes
#      the token.
#   5. The verifier's refresh probe passes when ESO publishes the synced resource version
#      that it computes for the annotated metadata, with Ready, and then the later
#      attempts set no further annotation. It fails after its attempts when the status
#      stays as it was, and when the status carries the version of other metadata. It
#      fails before the first annotation, with a message about the ESO version, when the
#      status does not equal the version that the probe computes for the current
#      metadata. No clock is part of the comparison. It refuses an ExternalSecret whose
#      annotation value embeds the marker text: the compatibility read fails with a message
#      about the marker, the stale-status collision does not pass, and the read that
#      decides an attempt counts such an object as not refreshed.
#   6. The verifier's PKI probe passes when the ESO token has no capability on the PKI
#      issue path (`deny`, or an empty list) and fails, naming the path, when the token
#      still holds a grant there. The token reaches the pod on stdin, not as an argument.
#   7. The verifier's reads of the policy and the role, which need no ESO login. The
#      policy check passes with the policy text that the role writes, and fails, naming
#      the stanza or the capability, when the live policy holds a PKI stanza or a
#      capability beyond read and list. The role check passes with token_policies equal
#      to ["eso-reader"] and fails, naming the policies, with a second policy. Neither
#      check sends a token as an argument or calls the AppRole login or a SecretID path.
#
# The fake kubectl, bao and kubernetes.core modules stand in for the cluster. They
# are in tests/fixtures. Run locally, from k3s-lab-bootstrap:
#   PATH="$PWD/tests/fixtures/fake-kubectl:$PATH" \
#   ANSIBLE_COLLECTIONS_PATH="$PWD/tests/fixtures/fake-collections:$HOME/.ansible/collections" \
#   ansible-playbook tests/test-openbao-k8s-auth.yml

- name: Kubernetes auth for ESO's main store
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    _tpl: "{{ playbook_dir }}/../roles/stack/operator/openbao/templates"
    _eso: "{{ playbook_dir }}/../roles/base/external-secrets"
    openbao_storage_class: longhorn
    _root: fake-root-token-1
  vars_files:
    - ../roles/stack/operator/openbao/defaults/main.yml
    - ../roles/base/external-secrets/defaults/main.yml
    - ../roles/base/external-secrets/vars/main.yml
  tasks:
    - name: Make a state directory for the fake cluster
      ansible.builtin.tempfile:
        state: directory
        prefix: openbao-k8s-auth-
      register: _state
      changed_when: false

    # ── 1. StatefulSet ──────────────────────────────────────────────────────
    - name: Variable off — render the StatefulSet
      ansible.builtin.set_fact:
        _sts_off: "{{ lookup('ansible.builtin.template', _tpl ~ '/statefulset.yml.j2') | from_yaml }}"

    - name: Variable on — render the StatefulSet
      ansible.builtin.set_fact:
        _sts_on: "{{ lookup('ansible.builtin.template', _tpl ~ '/statefulset.yml.j2') | from_yaml }}"
      vars:
        openbao_kubernetes_reviewer_enabled: true

    - name: Rollback of the ESO switch alone — render the StatefulSet
      ansible.builtin.set_fact:
        _sts_rollback: "{{ lookup('ansible.builtin.template', _tpl ~ '/statefulset.yml.j2') | from_yaml }}"
      vars:
        openbao_kubernetes_reviewer_enabled: true
        openbao_eso_auth_method: approle

    - name: ESO switch on, reviewer off — render the StatefulSet
      ansible.builtin.set_fact:
        _sts_switch_only: "{{ lookup('ansible.builtin.template', _tpl ~ '/statefulset.yml.j2') | from_yaml }}"
      vars:
        openbao_eso_auth_method: kubernetes

    - name: Assert off equals the old render and on only adds the ServiceAccount
      ansible.builtin.assert:
        that:
          - _sts_off == (lookup('ansible.builtin.file', 'fixtures/openbao-statefulset-single-replica.json') | from_json)
          - _sts_off.spec.template.spec.serviceAccountName is not defined
          - _sts_on.spec.template.spec.serviceAccountName == 'openbao'
          - _sts_on.spec.template.spec | dict2items | rejectattr('key', 'equalto', 'serviceAccountName') | items2dict == _sts_off.spec.template.spec
          - _sts_on.spec.template.spec.containers == _sts_off.spec.template.spec.containers
          # The reviewer identity has its own switch: the ESO switch alone changes nothing,
          # and flipping the ESO switch back keeps the ServiceAccount.
          - _sts_switch_only == _sts_off
          - _sts_rollback == _sts_on

    # ── 2. ClusterSecretStore ───────────────────────────────────────────────
    - name: Apply the store in each order and keep what the cluster holds
      ansible.builtin.include_tasks: _openbao-k8s-auth-store-case.yml
      loop:
        - { name: approle on a new store, method: approle, store: new }
        - { name: kubernetes on a new store, method: kubernetes, store: new }
        - { name: kubernetes over an approle store, method: kubernetes, store: approle }
        - { name: approle over a kubernetes store, method: approle, store: kubernetes }
        - { name: kubernetes over a kubernetes store, method: kubernetes, store: kubernetes }
      loop_control:
        loop_var: case
        index_var: case_index
        label: "{{ case.name }}"

    - name: Replace with a stale resourceVersion and keep what the cluster holds
      ansible.builtin.include_tasks: _openbao-k8s-auth-store-stale-case.yml

    # ── 3. The config step ──────────────────────────────────────────────────
    - name: Run the config step
      ansible.builtin.include_tasks: _openbao-k8s-auth-config-case.yml
      loop:
        - name: fresh mount
          check: fresh
        - name: rerun writes nothing
          check: rerun
        - name: old config with a stored token and a CA is replaced
          check: replaced
        - name: a mount that ignores the reviewer fields fails the read-back
          check: ignores
          env: {FAKE_K8S_IGNORES_REVIEWER_FIELDS: "yes"}
        - name: an identity that is not root cannot write
          check: not-root
          token: fake-ops-token
        - name: reviewer only, ESO on AppRole, writes the config and no role
          check: reviewer-only
          method: approle
          dir: config-reviewer-only
      loop_control:
        loop_var: case
        index_var: case_index
        label: "{{ case.name }}"

    # ── 4. The installed-environment path ───────────────────────────────────
    - name: Run the installed-environment path
      ansible.builtin.include_tasks: _openbao-k8s-auth-case.yml
      loop:
        - name: token, everything works
          token: "{{ _root }}"
          expect: pass
          wrote: true
          revoked: true
          rbac: true
          config_writes: 1
          records: 1
          role: true
          eso_role_written: "true"
          standing_role_writes: 2
        - name: rerun with a new token writes and records nothing more
          state: 0
          token: fake-root-token-2
          expect: pass
          wrote: true
          revoked: true
          config_writes: 1
          records: 1
          standing_role_writes: 2
        - name: no token
          expect: pass
          rbac: true
          wrote: false
          revoked: false
        - name: token, the role write fails
          token: "{{ _root }}"
          env: {FAKE_K8S_WRITE_FAILS: "yes"}
          expect: fail
          wrote: true
          revoked: true
        - name: token that is not a root token
          token: fake-ops-token
          expect: fail
          wrote: false
          revoked: true
        - name: token, a pod is sealed
          token: "{{ _root }}"
          env: {FAKE_SEALED: openbao-0}
          expect: fail
          wrote: false
          revoked: true
        - name: token, the reviewer variable is off
          token: "{{ _root }}"
          reviewer: false
          expect: fail
          wrote: false
          revoked: true
        - name: token, the cluster is not ready
          token: "{{ _root }}"
          readiness_fails: true
          expect: fail
          wrote: false
          revoked: true
        - name: token, the pod is missing
          token: "{{ _root }}"
          no_pod: true
          expect: fail
          wrote: false
          revoked: false
          message: was NOT revoked
          nothing_ran_except_lookup: true
        - name: token, the pod lookup fails
          token: "{{ _root }}"
          env: {FAKE_K8S_INFO_FAILS: "yes"}
          expect: fail
          wrote: false
          revoked: false
          message: was NOT revoked
          nothing_ran_except_lookup: true
        - name: reviewer on, ESO on AppRole, token
          token: "{{ _root }}"
          method: approle
          expect: pass
          wrote: true
          revoked: true
          config_writes: 1
          role: false
          standing_role_writes: 2
        - name: token, both standing roles exist already
          token: "{{ _root }}"
          roles_present: [setup-issuer, approle-rotation-scheduler]
          present_role_ttl: 99
          expect: pass
          wrote: true
          revoked: true
          standing_role_writes: 0
        - name: token, one standing role exists already
          token: "{{ _root }}"
          roles_present: [setup-issuer]
          present_role_ttl: 99
          expect: pass
          wrote: true
          revoked: true
          standing_role_writes: 1
        - name: token, a standing ServiceAccount is missing
          token: "{{ _root }}"
          missing_sa: [approle-rotation-scheduler]
          expect: fail
          wrote: true
          revoked: true
          standing_role_writes: 0
          message: "Missing ServiceAccounts in namespace openbao: approle-rotation-scheduler"
        - name: token, a standing policy is missing
          token: "{{ _root }}"
          missing_policy: [setup-issuer]
          expect: fail
          wrote: true
          revoked: true
          standing_role_writes: 0
          message: "Missing policies: setup-issuer"
      loop_control:
        loop_var: case
        index_var: case_index
        label: "{{ case.name }}"

    - name: Assert the outcome of every installed-environment case
      ansible.builtin.assert:
        that:
          - _outcomes | length == 15
          - _outcomes | rejectattr('ok') | list | length == 0
        fail_msg: "{{ _outcomes | rejectattr('ok') | map(attribute='name') | join('; ') }}"

    # With the variable off, the workload creates no ServiceAccount, ClusterRole or
    # binding for OpenBao.
    - name: Variable off — prepare the fake cluster
      ansible.builtin.copy:
        src: fixtures/k8s-seed/
        dest: "{{ _state.path }}/workload-off/k8s/"
        mode: preserve
      changed_when: false

    - name: Variable off — apply the workload
      environment:
        FAKE_STATE: "{{ _state.path }}/workload-off"
      block:
        - name: Run workload.yml
          ansible.builtin.include_role:
            name: stack/operator/openbao
            tasks_from: workload.yml
          vars:
            openbao_eso_auth_method: approle
            openbao_kubernetes_reviewer_enabled: false
            openbao_tls_secret_wait_retries: 2
            openbao_tls_secret_wait_delay: 0

    - name: Variable off — read the calls to the cluster
      ansible.builtin.slurp:
        src: "{{ _state.path }}/workload-off/k8s-mutations.log"
      register: _workload_off

    - name: Variable off — assert no RBAC object and the StatefulSet applied
      ansible.builtin.assert:
        that:
          - "'present StatefulSet openbao' in (_workload_off.content | b64decode)"
          - "'ServiceAccount' not in (_workload_off.content | b64decode)"
          - "'ClusterRole' not in (_workload_off.content | b64decode)"

    # The workload waits for the TLS secret that the CA issued. The secret from before
    # the move to the CA is self-signed and holds a ca.crt that equals its own
    # certificate: the wait must refuse it, and the StatefulSet must not apply.
    - name: Self-signed TLS secret — prepare the fake cluster
      ansible.builtin.copy:
        src: fixtures/k8s-seed/
        dest: "{{ _state.path }}/workload-selfsigned/k8s/"
        mode: preserve
      changed_when: false

    - name: Self-signed TLS secret — put the old secret in place
      ansible.builtin.copy:
        content: >-
          {{ {'metadata': {'annotations': {'cert-manager.io/issuer-name': 'openbao-selfsigned'}},
              'data': {'tls.crt': ('old-selfsigned' | b64encode), 'tls.key': 'ZmFrZQ==', 'ca.crt': ('old-selfsigned' | b64encode)}} | to_json }}
        dest: "{{ _state.path }}/workload-selfsigned/k8s/Secret-openbao-tls.json"
        mode: "0644"
      changed_when: false

    - name: Self-signed TLS secret — apply the workload
      environment:
        FAKE_STATE: "{{ _state.path }}/workload-selfsigned"
      block:
        - name: Run workload.yml
          ansible.builtin.include_role:
            name: stack/operator/openbao
            tasks_from: workload.yml
          vars:
            openbao_eso_auth_method: approle
            openbao_kubernetes_reviewer_enabled: false
            openbao_tls_secret_wait_retries: 2
            openbao_tls_secret_wait_delay: 0
        - name: Record a pass
          ansible.builtin.set_fact:
            _selfsigned_outcome: pass
      rescue:
        - name: Record the refusal
          ansible.builtin.set_fact:
            _selfsigned_outcome: refuse

    - name: Self-signed TLS secret — read the calls to the cluster
      ansible.builtin.slurp:
        src: "{{ _state.path }}/workload-selfsigned/k8s-mutations.log"
      register: _workload_selfsigned
      failed_when: false

    - name: Self-signed TLS secret — the workload refuses and applies no StatefulSet
      ansible.builtin.assert:
        that:
          - _selfsigned_outcome == 'refuse'
          - "'present StatefulSet openbao' not in (_workload_selfsigned.content | default('') | b64decode)"

    # ── 5. The verifier's refresh probe ─────────────────────────────────────
    # The fake kubectl writes the status as ESO does after a sync, as it annotates the
    # ExternalSecret. FAKE_ES_SYNC selects the behavior (see the fake kubectl). Each case
    # has its own fake cluster. The fixtures start with the status that ESO has written
    # for the object as it is: the probe's first check requires it.
    - name: Refresh probe — make the fake clusters' directories
      ansible.builtin.file:
        path: "{{ _state.path }}/{{ item }}/k8s"
        state: directory
        mode: "0755"
      loop: [refresh, refresh-held, refresh-other, refresh-scheme, refresh-hidden, refresh-collide, refresh-hidden-late]
      changed_when: false

    - name: Refresh probe — write the ExternalSecrets
      ansible.builtin.copy:
        content: >-
          {{
            {
              'metadata': {'name': 'probe-target', 'namespace': 'probe-ns', 'generation': 1, 'annotations': item.annotations},
              'spec': {'secretStoreRef': {'name': 'openbao', 'kind': 'ClusterSecretStore'}}
            } | to_json
          }}
        dest: "{{ _state.path }}/{{ item.dir }}/k8s/ExternalSecret-probe-target.json"
        mode: "0644"
      loop:
        - {dir: refresh, annotations: {}}
        - {dir: refresh-held, annotations: {}}
        - {dir: refresh-other, annotations: {}}
        - {dir: refresh-scheme, annotations: {}}
        - {dir: refresh-hidden, annotations: {a: "x force-sync:verify-1-1"}}
        - {dir: refresh-collide, annotations: {a: "x force-sync:verify-1-1"}}
        - {dir: refresh-hidden-late, annotations: {a: "x force-sync:verify-1-2"}}
      changed_when: false

    # The refreshTime of the synced status is later than any threshold that a clock-based
    # probe could take.
    - name: Refresh probe — give them the status that ESO writes after a sync
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/fixtures/eso_sync_version.py"
          - "{{ _state.path }}/{{ item.dir }}/k8s/ExternalSecret-probe-target.json"
          - "{{ item.scheme }}"
      loop:
        - {dir: refresh, scheme: eso}
        - {dir: refresh-held, scheme: eso}
        - {dir: refresh-other, scheme: eso}
        - {dir: refresh-scheme, scheme: other}
        - {dir: refresh-hidden, scheme: eso}
        - {dir: refresh-collide, scheme: eso}
        - {dir: refresh-hidden-late, scheme: eso}
      changed_when: false

    - name: Refresh probe — run the attempts as the verifier does
      environment:
        FAKE_STATE: "{{ _state.path }}/refresh"
      block:
        - name: Run verify-main-store-refresh.yml
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-main-store-refresh.yml
          loop: [1, 2, 3]
          loop_control:
            loop_var: _verify_attempt
          vars:
            verify_main_store_sync_target: {namespace: probe-ns, name: probe-target}
            _verify_run_id: "1"

    - name: Refresh probe — read the calls to kubectl
      ansible.builtin.slurp:
        src: "{{ _state.path }}/refresh/events.log"
      register: _refresh_events

    - name: Refresh probe — assert the refresh was seen after the annotation
      ansible.builtin.assert:
        that:
          - _verify_refreshed | bool
          - "'kubectl annotate externalsecret probe-target force-sync=verify-1-1' in (_refresh_events.content | b64decode)"
        fail_msg: A sync after the forced annotation was not counted.

    - name: Refresh probe — assert a first-attempt success sets exactly one annotation
      ansible.builtin.assert:
        that:
          - (_refresh_events.content | b64decode).splitlines() | select('search', '^kubectl annotate ') | list | length == 1
        fail_msg: An attempt after a successful refresh set another force-sync annotation.

    # The annotation lands and the status stays as it was, with Ready from before: the
    # probe makes all three attempts and fails.
    - name: Refresh probe — clear the verdict of the first run
      ansible.builtin.set_fact:
        _verify_refreshed: false

    - name: Refresh probe — run the attempts against a store that does not sync
      environment:
        FAKE_STATE: "{{ _state.path }}/refresh-held"
        FAKE_ES_SYNC: hold
      block:
        - name: Run verify-main-store-refresh.yml with the status held
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-main-store-refresh.yml
          loop: [1, 2, 3]
          loop_control:
            loop_var: _verify_attempt
          vars:
            verify_main_store_sync_target: {namespace: probe-ns, name: probe-target}
            _verify_run_id: "1"
            _verify_refresh_retries: 2
            _verify_refresh_delay: 1

    - name: Refresh probe — read the calls to kubectl when the status is held
      ansible.builtin.slurp:
        src: "{{ _state.path }}/refresh-held/events.log"
      register: _held_events

    - name: Refresh probe — assert a held status is not a refresh
      ansible.builtin.assert:
        that:
          - not (_verify_refreshed | bool)
          - (_held_events.content | b64decode).splitlines() | select('search', '^kubectl annotate ') | list | length == 3
        fail_msg: A forced sync that left the status as it was counted as a refresh, or an attempt did not run.

    # ESO publishes the version of an earlier change while the probe's annotation waits:
    # the status differs from the one before the annotation and is Ready, and the probe
    # still fails because the version is not the one for the annotated metadata.
    - name: Refresh probe — clear the verdict of the held run
      ansible.builtin.set_fact:
        _verify_refreshed: false

    - name: Refresh probe — run the attempts against a store that publishes other metadata
      environment:
        FAKE_STATE: "{{ _state.path }}/refresh-other"
        FAKE_ES_SYNC: other
      block:
        - name: Run verify-main-store-refresh.yml with the version of other metadata
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-main-store-refresh.yml
          loop: [1, 2, 3]
          loop_control:
            loop_var: _verify_attempt
          vars:
            verify_main_store_sync_target: {namespace: probe-ns, name: probe-target}
            _verify_run_id: "1"
            _verify_refresh_retries: 2
            _verify_refresh_delay: 1

    - name: Refresh probe — read the calls to kubectl when ESO publishes other metadata
      ansible.builtin.slurp:
        src: "{{ _state.path }}/refresh-other/events.log"
      register: _other_events

    - name: Refresh probe — assert the version of other metadata is not a refresh
      ansible.builtin.assert:
        that:
          - not (_verify_refreshed | bool)
          - (_other_events.content | b64decode).splitlines() | select('search', '^kubectl annotate ') | list | length == 3
        fail_msg: A status for other metadata counted as the refresh, or an attempt did not run.

    # The status starts with a version that the probe does not compute: it fails before
    # it sets an annotation, with the message about the ESO version.
    - name: Refresh probe — run the first attempt against a store with another hash scheme
      environment:
        FAKE_STATE: "{{ _state.path }}/refresh-scheme"
        FAKE_ES_SYNC: scheme
      block:
        - name: Run verify-main-store-refresh.yml with another hash scheme
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-main-store-refresh.yml
          loop: [1]
          loop_control:
            loop_var: _verify_attempt
          vars:
            verify_main_store_sync_target: {namespace: probe-ns, name: probe-target}
            _verify_run_id: "1"
            _verify_refresh_retries: 2
            _verify_refresh_delay: 1
        - name: Refresh probe — fail when the probe judged a status it cannot compute
          ansible.builtin.fail:
            msg: The probe ran against a status with another hash scheme without failing.
      rescue:
        - name: Refresh probe — assert the failure names the ESO version
          ansible.builtin.assert:
            that:
              - "'probably builds the value differently from v2.3.0' in ansible_failed_result.msg"
            fail_msg: "The failure did not name the ESO version: {{ ansible_failed_result.msg | default('') }}"

    - name: Refresh probe — assert the scheme check failed before any annotation
      ansible.builtin.stat:
        path: "{{ _state.path }}/refresh-scheme/events.log"
      register: _scheme_events

    - name: Refresh probe — assert nothing was annotated
      ansible.builtin.assert:
        that: not _scheme_events.stat.exists
        fail_msg: The probe set an annotation although it could not judge the status.

    # An annotation value embeds the marker text, so other metadata could render as this
    # run's annotation. The compatibility read refuses the object with a message about the
    # marker, before any annotation.
    - name: Refresh probe — run the first attempt against metadata that embeds the marker
      environment:
        FAKE_STATE: "{{ _state.path }}/refresh-hidden"
      block:
        - name: Run verify-main-store-refresh.yml with metadata that embeds the marker
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-main-store-refresh.yml
          loop: [1]
          loop_control:
            loop_var: _verify_attempt
          vars:
            verify_main_store_sync_target: {namespace: probe-ns, name: probe-target}
            _verify_run_id: "1"
            _verify_refresh_retries: 2
            _verify_refresh_delay: 1
        - name: Refresh probe — fail when the probe judged metadata that embeds the marker
          ansible.builtin.fail:
            msg: The probe ran against metadata that embeds the marker without failing.
      rescue:
        - name: Refresh probe — assert the failure says the metadata could hide the marker
          ansible.builtin.assert:
            that:
              - "'because its metadata could hide the marker' in ansible_failed_result.msg"
            fail_msg: "The failure did not name the marker: {{ ansible_failed_result.msg | default('') }}"

    - name: Refresh probe — look for calls to kubectl when the metadata embeds the marker
      ansible.builtin.stat:
        path: "{{ _state.path }}/refresh-hidden/events.log"
      register: _hidden_events

    - name: Refresh probe — assert nothing was annotated when the metadata embeds the marker
      ansible.builtin.assert:
        that: not _hidden_events.stat.exists
        fail_msg: The probe set an annotation although the metadata could hide the marker.

    # The stale-status collision: the status is Ready with the version of the metadata that
    # embeds the marker, and another writer cuts the marker text out of the value as the
    # probe annotates, so the status equals the version of the metadata that the probe then
    # reads. The probe must not pass.
    - name: Refresh probe — clear the verdict
      ansible.builtin.set_fact:
        _verify_refreshed: false

    - name: Refresh probe — run the attempts against a stale status that collides
      environment:
        FAKE_STATE: "{{ _state.path }}/refresh-collide"
        FAKE_ES_SYNC: collide
      block:
        - name: Run verify-main-store-refresh.yml with a status that collides
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-main-store-refresh.yml
          loop: [1, 2, 3]
          loop_control:
            loop_var: _verify_attempt
          vars:
            verify_main_store_sync_target: {namespace: probe-ns, name: probe-target}
            _verify_run_id: "1"
            _verify_refresh_retries: 2
            _verify_refresh_delay: 1
        - name: Refresh probe — fail when the collision counted as a refresh
          ansible.builtin.fail:
            msg: A stale status that collides with the annotated metadata counted as the refresh.
          when: _verify_refreshed | bool
      rescue:
        - name: Refresh probe — assert the collision was refused by the compatibility read
          ansible.builtin.assert:
            that:
              - not (_verify_refreshed | bool)
              - "'because its metadata could hide the marker' in ansible_failed_result.msg"
            fail_msg: "The collision was not refused: {{ ansible_failed_result.msg | default('') }}"

    - name: Refresh probe — look for calls to kubectl when the status collides
      ansible.builtin.stat:
        path: "{{ _state.path }}/refresh-collide/events.log"
      register: _collide_events

    - name: Refresh probe — assert nothing was annotated when the status collides
      ansible.builtin.assert:
        that: not _collide_events.stat.exists
        fail_msg: The probe set an annotation although the metadata could hide the marker.

    # A later attempt skips the compatibility read. The read that decides the attempt still
    # refuses metadata that embeds the marker, though the status equals the computed version.
    - name: Refresh probe — clear the verdict of the collision run
      ansible.builtin.set_fact:
        _verify_refreshed: false

    - name: Refresh probe — run a later attempt against metadata that embeds the marker
      environment:
        FAKE_STATE: "{{ _state.path }}/refresh-hidden-late"
      block:
        - name: Run verify-main-store-refresh.yml for attempt 2 with metadata that embeds the marker
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-main-store-refresh.yml
          loop: [2]
          loop_control:
            loop_var: _verify_attempt
          vars:
            verify_main_store_sync_target: {namespace: probe-ns, name: probe-target}
            _verify_run_id: "1"
            _verify_refresh_retries: 2
            _verify_refresh_delay: 1

    - name: Refresh probe — assert metadata that embeds the marker is not a refresh
      ansible.builtin.assert:
        that: not (_verify_refreshed | bool)
        fail_msg: An object whose metadata could hide the marker counted as the refresh.

    # ── 6. The verifier's PKI probe ─────────────────────────────────────────
    # The fake bao answers `bao token capabilities` for a token named fake-eso* as
    # eso-reader would: ["deny"] on the PKI path unless FAKE_ESO_PKI_GRANT sets a grant.
    - name: PKI probe — set what the verifier holds after the ESO login
      ansible.builtin.set_fact:
        verify_openbao_namespace: openbao
        _verify_openbao_pod: openbao-0
        verify_eso_pki_probe_path: pki/issue/internal-ca
        _verify_eso_auth: {client_token: fake-eso-token}
      no_log: true

    - name: PKI probe — pass when the token has no grant
      environment:
        FAKE_STATE: "{{ _state.path }}/pki-none"
      block:
        - name: Run verify-eso-no-pki.yml against a token without a grant
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-eso-no-pki.yml

    # The grant that the role's eso-reader policy holds on the PKI mount, read from the
    # task that writes the policy (tests/fixtures/eso_reader_pki_capabilities.py). A token
    # of that policy passes only while the policy grants nothing there.
    - name: PKI probe — read the grant of the policy that the role writes
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/fixtures/eso_reader_pki_capabilities.py"
      register: _policy_pki_grant
      changed_when: false

    - name: PKI probe — pass with the policy that the role writes
      environment:
        FAKE_STATE: "{{ _state.path }}/pki-policy"
        FAKE_ESO_PKI_GRANT: "{{ _policy_pki_grant.stdout | trim }}"
      block:
        - name: Run verify-eso-no-pki.yml against a token of the role's policy
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-eso-no-pki.yml

    - name: PKI probe — pass when the answer is an empty list
      environment:
        FAKE_STATE: "{{ _state.path }}/pki-empty"
        FAKE_ESO_PKI_GRANT: "[]"
      block:
        - name: Run verify-eso-no-pki.yml against an empty answer
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-eso-no-pki.yml

    - name: PKI probe — fail, naming the path, when the token still holds the grant
      environment:
        FAKE_STATE: "{{ _state.path }}/pki-grant"
        FAKE_ESO_PKI_GRANT: '["create", "update"]'
      block:
        - name: Run verify-eso-no-pki.yml against a token that holds the grant
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-eso-no-pki.yml
        - name: PKI probe — fail when the probe passed a token that holds the grant
          ansible.builtin.fail:
            msg: The probe passed a token that holds a grant on the PKI issue path.
      rescue:
        - name: PKI probe — assert the failure names the path and the grant
          ansible.builtin.assert:
            that:
              - "'pki/issue/internal-ca' in ansible_failed_result.msg"
              - "'create' in ansible_failed_result.msg"
              - "'passed a token' not in ansible_failed_result.msg"
            fail_msg: "The failure did not name the path: {{ ansible_failed_result.msg | default('') }}"

    - name: PKI probe — read the argument lists that the fake bao logged
      ansible.builtin.slurp:
        src: "{{ _state.path }}/pki-grant/bao-argv.log"
      register: _pki_argv

    - name: PKI probe — assert the probe asked about the PKI path and sent no token as an argument
      ansible.builtin.assert:
        that:
          - "'token capabilities -format=json pki/issue/internal-ca' in (_pki_argv.content | b64decode)"
          - "'fake-eso-token' not in (_pki_argv.content | b64decode)"
        fail_msg: The probe did not ask about the PKI path, or a token reached an argument list.

    # ── 7. The verifier's policy and role reads (no ESO login) ──────────────
    # The policy text comes from the task that writes it
    # (tests/fixtures/eso_reader_policy_hcl.py). The fake bao serves it to the
    # policy-reconciler token and serves the role's token_policies to the scheduler token.
    - name: ESO reads — set what the verifier holds
      ansible.builtin.set_fact:
        verify_openbao_namespace: openbao
        _verify_openbao_pod: openbao-0
        verify_eso_pki_mount: pki
        verify_eso_policy_name: eso-reader
        verify_eso_approle_role: external-secrets
        _verify_token_policy_reconciler: fake-policy-token
        _verify_token_rotation_scheduler: fake-scheduler-token
      no_log: true

    - name: ESO reads — read the policy that the role writes
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/fixtures/eso_reader_policy_hcl.py"
      register: _role_policy
      changed_when: false

    - name: ESO reads — write the live policy variants
      ansible.builtin.copy:
        dest: "{{ _state.path }}/{{ item.key }}.hcl"
        content: "{{ item.value }}\n"
        mode: "0600"
      loop: "{{ _variants | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        _variants:
          role: "{{ _role_policy.stdout | trim }}"
          pki-stanza: |-
            {{ _role_policy.stdout | trim }}
            path "pki/issue/internal-ca" {
              capabilities = ["create", "update"]
            }
          pki-glob: |-
            {{ _role_policy.stdout | trim }}
            path "+/issue/internal-ca" {
              capabilities = ["read"]
            }
          wide-capability: |-
            {{ _role_policy.stdout | trim }}
            path "secret/data/apps/extra" {
              capabilities = ["read", "update"]
            }
          commented-pki: |-
            {{ _role_policy.stdout | trim }}
            # path "pki/issue/internal-ca" is not granted
          empty: "# no stanzas"

    - name: ESO reads — the policy check passes with the policy that the role writes
      environment:
        FAKE_STATE: "{{ _state.path }}/read-policy-ok"
        FAKE_ESO_POLICY_FILE: "{{ _state.path }}/role.hcl"
      block:
        - name: Run verify-eso-reader-policy.yml against the role's policy
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-eso-reader-policy.yml

    - name: ESO reads — the policy check passes when a comment mentions a PKI path
      environment:
        FAKE_STATE: "{{ _state.path }}/read-policy-comment"
        FAKE_ESO_POLICY_FILE: "{{ _state.path }}/commented-pki.hcl"
      block:
        - name: Run verify-eso-reader-policy.yml against a policy with a PKI comment
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-eso-reader-policy.yml

    - name: ESO reads — the policy check fails for each live policy that grants too much
      ansible.builtin.include_tasks: _openbao-eso-policy-fail-case.yml
      loop:
        - {name: pki-stanza, expect: "pki/issue/internal-ca"}
        - {name: pki-glob, expect: "+/issue/internal-ca"}
        - {name: wide-capability, expect: "update"}
        - {name: empty, expect: "0 path stanzas"}
      loop_control:
        loop_var: _case
        label: "{{ _case.name }}"

    - name: ESO reads — the role check passes with only eso-reader
      environment:
        FAKE_STATE: "{{ _state.path }}/read-role-ok"
      block:
        - name: Run verify-eso-role-policies.yml against a role with eso-reader only
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-eso-role-policies.yml

    - name: ESO reads — the role check fails with a second policy, naming it
      environment:
        FAKE_STATE: "{{ _state.path }}/read-role-two"
        FAKE_ESO_ROLE_POLICIES: '["eso-reader", "default"]'
      block:
        - name: Run verify-eso-role-policies.yml against a role with two policies
          ansible.builtin.include_tasks: ../playbooks/tasks/verify-eso-role-policies.yml
        - name: ESO reads — fail when the role check passed two policies
          ansible.builtin.fail:
            msg: The role check passed a role with a second policy.
      rescue:
        - name: ESO reads — assert the failure names the policies
          ansible.builtin.assert:
            that:
              - "'default' in ansible_failed_result.msg"
              - "'passed a role' not in ansible_failed_result.msg"
            fail_msg: "The failure did not name the policies: {{ ansible_failed_result.msg | default('') }}"

    - name: ESO reads — read the argument lists that the fake bao logged
      ansible.builtin.slurp:
        src: "{{ _state.path }}/{{ item }}/bao-argv.log"
      register: _eso_reads_argv
      loop: [read-policy-ok, read-role-ok]

    - name: ESO reads — assert no token reached an argument and no ESO login was made
      ansible.builtin.assert:
        that:
          - "'read -format=json sys/policies/acl/eso-reader' in (_eso_reads_argv.results[0].content | b64decode)"
          - "'read -format=json auth/approle/role/external-secrets' in (_eso_reads_argv.results[1].content | b64decode)"
          - "'fake-policy-token' not in (_eso_reads_argv.results[0].content | b64decode)"
          - "'fake-scheduler-token' not in (_eso_reads_argv.results[1].content | b64decode)"
          - "'login' not in (_eso_reads_argv.results[0].content | b64decode)"
          - "'login' not in (_eso_reads_argv.results[1].content | b64decode)"
          - "'secret-id' not in (_eso_reads_argv.results[1].content | b64decode)"
        fail_msg: A token reached an argument list, or a read did not ask for the object, or an ESO login or SecretID path was called.
