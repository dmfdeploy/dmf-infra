---
# Discrimination test for index-preserving mirroring (dmfdeploy/dmfdeploy#808).
#
# Builds a two-platform index (amd64 + arm64) as a local OCI layout, then runs
# the SAME task file as 630-zot-seed-platform.yml against it:
#   1. whole-index copy        -> destination digest equals source, no failure
#   2. repeat                  -> no copy (idempotent), digest still equal
#   3. single-platform copy made directly, then only the digest check
#                              -> the check FAILS (the #808 defect)
#   4. the verify step uses the digest captured before the copy and never
#      re-reads the source, even when the source tag has moved
#   5. a string `mirror_dest_tls_verify` -> rejected before any destination
#      read or write
#   6. old free-form flag variables (`mirror_copy_flags`,
#      `mirror_copy_extra_flags: ["-a=false"]`) -> no effect, whole index copied
#
# Needs skopeo and python3 on the machine; no registry, network or container
# runtime. It does not exercise Zot or GHCR themselves (auth, TLS, HTTP).
#
# Run locally:
#   ansible-playbook tests/test-zot-seed-index-mirror.yml

- name: Discrimination test — whole-index mirror keeps the index digest (#808)
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Create a scratch directory
      ansible.builtin.tempfile:
        state: directory
        prefix: zot-index-test-
      register: _scratch

    - name: Run the cases
      block:
        - name: Build the two-platform source index
          ansible.builtin.command:
            argv:
              - python3
              - -I
              - "{{ playbook_dir }}/make_two_platform_index.py"
              - "{{ _scratch.path }}/src"
              - v1
          changed_when: true

        - name: Assert the fixture index lists two platforms
          ansible.builtin.command:
            argv: [skopeo, inspect, --raw, "oci:{{ _scratch.path }}/src:v1"]
          register: _fixture
          changed_when: false

        - name: Check the fixture
          ansible.builtin.assert:
            that:
              - (_fixture.stdout | from_json).manifests | length == 2
              - (_fixture.stdout | from_json).manifests | map(attribute='platform.architecture') | sort == ['amd64', 'arm64']

        - name: Define the digest command
          ansible.builtin.include_tasks: ../tasks/zot-mirror-digest-argv.yml
          vars:
            mirror_label: test

        - name: Capture the source index digest
          ansible.builtin.command:
            argv: "{{ _mirror_digest_argv + ['oci:' ~ _scratch.path ~ '/src:v1'] }}"
          register: _src_digest
          changed_when: false

        - name: Case 1 — whole-index copy succeeds and copies
          ansible.builtin.include_tasks: ../tasks/zot-seed-mirror-index.yml
          vars:
            mirror_label: whole-index
            mirror_src_ref: "oci:{{ _scratch.path }}/src:v1"
            mirror_dest_ref: "oci:{{ _scratch.path }}/dst:v1"
            mirror_dest_tls_verify: true

        - name: Case 1 — assert a copy ran
          ansible.builtin.assert:
            that: mirror_changed | bool

        - name: Case 2 — repeat is idempotent
          ansible.builtin.include_tasks: ../tasks/zot-seed-mirror-index.yml
          vars:
            mirror_label: whole-index-repeat
            mirror_src_ref: "oci:{{ _scratch.path }}/src:v1"
            mirror_dest_ref: "oci:{{ _scratch.path }}/dst:v1"
            mirror_dest_tls_verify: true

        - name: Case 2 — assert no copy ran
          ansible.builtin.assert:
            that: not (mirror_changed | bool)

        - name: Case 3 — a single-platform copy must fail the digest check
          block:
            - name: Mirror one platform only, outside the shared task
              ansible.builtin.command:
                argv:
                  - skopeo
                  - copy
                  - --override-arch=arm64
                  - --override-os=linux
                  - "oci:{{ _scratch.path }}/src:v1"
                  - "oci:{{ _scratch.path }}/dst-single:v1"
              changed_when: true
            - name: Run only the digest check, expecting the source index digest
              ansible.builtin.include_tasks: ../tasks/zot-seed-mirror-verify.yml
              vars:
                mirror_label: single-platform
                mirror_src_ref: "oci:{{ _scratch.path }}/src:v1"
                mirror_dest_ref: "oci:{{ _scratch.path }}/dst-single:v1"
                mirror_dest_tls_verify: true
                mirror_expected_digest: "{{ _src_digest.stdout | trim }}"
            - name: Fail if the mismatch went unnoticed
              ansible.builtin.fail:
                msg: single-platform copy passed the digest check
          rescue:
            - name: Assert the failure was the digest check
              ansible.builtin.assert:
                that:
                  - "'Digest mismatch for single-platform' in ansible_failed_result.msg"
                quiet: true

        - name: Case 4 — verify uses the captured digest, not a fresh source read
          block:
            - name: Move the source tag to a different (single-platform) image
              ansible.builtin.command:
                argv:
                  - skopeo
                  - copy
                  - --override-arch=arm64
                  - --override-os=linux
                  - "oci:{{ _scratch.path }}/src:v1"
                  - "oci:{{ _scratch.path }}/src-moved:v1"
              changed_when: true
            - name: Verify the whole-index destination against the captured digest
              # mirror_src_ref names the moved source; a verify step that
              # read it would compare against the wrong digest and fail.
              ansible.builtin.include_tasks: ../tasks/zot-seed-mirror-verify.yml
              vars:
                mirror_label: moved-source
                mirror_src_ref: "oci:{{ _scratch.path }}/src-moved:v1"
                mirror_dest_ref: "oci:{{ _scratch.path }}/dst:v1"
                mirror_dest_tls_verify: true
                mirror_expected_digest: "{{ _src_digest.stdout | trim }}"

        - name: Case 5 — a string TLS value is rejected before any destination access
          block:
            - name: Mirror with mirror_dest_tls_verify as a string
              ansible.builtin.include_tasks: ../tasks/zot-seed-mirror-index.yml
              vars:
                mirror_label: string-tls
                mirror_src_ref: "oci:{{ _scratch.path }}/src:v1"
                mirror_dest_ref: "oci:{{ _scratch.path }}/dst-str:v1"
                mirror_dest_tls_verify: "false"
            - name: Fail if the string was accepted
              ansible.builtin.fail:
                msg: string mirror_dest_tls_verify was accepted
          rescue:
            - name: Assert the input check rejected it
              ansible.builtin.assert:
                that:
                  - "'Mirror inputs for string-tls are invalid' in ansible_failed_result.msg"
                quiet: true
            - name: Check that the destination was not created
              ansible.builtin.stat:
                path: "{{ _scratch.path }}/dst-str"
              register: _str_dst
            - name: Assert the destination does not exist
              ansible.builtin.assert:
                that: not _str_dst.stat.exists
                quiet: true

        - name: Case 6 — old free-form flag variables change nothing
          ansible.builtin.include_tasks: ../tasks/zot-seed-mirror-index.yml
          vars:
            mirror_copy_flags: []
            mirror_copy_extra_flags: ["-a=false", "--override-arch=arm64"]
            mirror_label: old-flags
            mirror_src_ref: "oci:{{ _scratch.path }}/src:v1"
            mirror_dest_ref: "oci:{{ _scratch.path }}/dst-old:v1"
            mirror_dest_tls_verify: true

        - name: Case 6 — assert the whole index was copied and verified
          ansible.builtin.assert:
            that: mirror_changed | bool

      always:
        - name: Remove the scratch directory
          ansible.builtin.file:
            path: "{{ _scratch.path }}"
            state: absent
