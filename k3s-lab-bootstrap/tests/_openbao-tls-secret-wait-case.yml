---
# One case of test-openbao-tls-secret-wait.yml.
- name: "{{ case.name }} — make the fake object directory"
  ansible.builtin.file:
    path: "{{ _state.path }}/{{ case_index }}/k8s"
    state: directory
    mode: "0700"

- name: "{{ case.name }} — write the secret"
  ansible.builtin.copy:
    content: "{{ _secret | to_json }}"
    dest: "{{ _state.path }}/{{ case_index }}/k8s/Secret-openbao-tls.json"
    mode: "0600"
  vars:
    _data: >-
      {{ {'tls.crt': (case.tls | b64encode), 'tls.key': 'ZmFrZQ=='}
         | combine({'ca.crt': (case.ca | b64encode)} if case.ca is defined else {}) }}
    _secret:
      metadata:
        annotations:
          cert-manager.io/issuer-name: "{{ case.issuer }}"
      data: "{{ _data }}"

- name: "{{ case.name }} — run the wait"
  block:
    - name: Run wait-tls-secret.yml (the real file)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/stack/operator/openbao/tasks/wait-tls-secret.yml"
      vars:
        openbao_namespace: openbao
        openbao_tls_secret_wait_retries: 2
        openbao_tls_secret_wait_delay: 0
    - name: Record a pass
      ansible.builtin.set_fact:
        _outcome: pass
  rescue:
    - name: Record the refusal
      ansible.builtin.set_fact:
        _outcome: refuse
  environment:
    FAKE_STATE: "{{ _state.path }}/{{ case_index }}"

- name: "{{ case.name }} — the wait is accepted or refused as expected"
  ansible.builtin.assert:
    that: _outcome == case.expect
    fail_msg: "{{ case.name }}: {{ _outcome }}"
