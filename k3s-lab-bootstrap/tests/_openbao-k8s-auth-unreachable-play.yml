---
# Played by test_openbao_k8s_auth_unreachable.py. It runs the installed-environment path
# against the fake cluster of _openbao-k8s-auth-case.yml once, with the host made
# UNREACHABLE by the fake kubernetes.core at the object that FAKE_K8S_UNREACHABLE names.
# Ansible then stops all tasks for the host, the `always` section included, and the play
# ends with exit status 4. It cannot run inside test-openbao-k8s-auth.yml, where it would
# end the whole play. The test passes the state directory and the token with -e.
- name: Run the installed-environment path until the host is unreachable
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    _state:
      path: "{{ unreachable_state }}"
  vars_files:
    - ../roles/stack/operator/openbao/defaults/main.yml
    - ../roles/base/external-secrets/defaults/main.yml
    - ../roles/base/external-secrets/vars/main.yml
  tasks:
    - name: Run the case
      ansible.builtin.include_tasks: _openbao-k8s-auth-case.yml
      loop:
        - name: unreachable
          token: "{{ unreachable_token }}"
          state: 0
          env: {FAKE_K8S_UNREACHABLE: "{{ unreachable_at }}"}
      loop_control:
        loop_var: case
        index_var: case_index
        label: "{{ case.name }}"
