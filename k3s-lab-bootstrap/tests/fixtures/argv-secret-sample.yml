---
# Fixture for test_openbao_no_secret_argv.py: a secret in a command argument, in each of the
# five forms that a task can use. The check must fail on every one. Not run by anything.
- name: A password in an argv list
  ansible.builtin.command:
    argv:
      - awx-manage
      - update_password
      - --password
      - "{{ admin_password }}"

- name: A token in a free-form command
  ansible.builtin.command: kubectl --token {{ service_account_token }} get pods

- name: A secret in a shell script
  ansible.builtin.shell: |
    K3S_TOKEN="{{ join_token }}" \
    /tmp/install.sh server

- name: A password in a cmd string
  ansible.builtin.shell:
    cmd: >-
      mysql -u admin -p'{{ database_password }}' -e "SELECT 1"
      --api-key {{ monitoring_api_key }}

- name: A secret in the arguments of a script task
  ansible.builtin.script: files/rotate.sh --secret {{ rotation_secret }}
