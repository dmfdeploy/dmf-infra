---
# Test of the wait for the OpenBao TLS secret before the workload applies
# (roles/stack/operator/openbao/tasks/wait-tls-secret.yml). The secret from before
# the move to the CA is self-signed and can already hold a ca.crt that equals its own
# certificate, so a ca.crt that is present proves nothing. The wait must accept only a
# secret that the CA Issuer issued.
#
# Cases: the self-signed secret (ca.crt equals tls.crt, issuer openbao-selfsigned) is
# refused; a secret that names the CA Issuer, with a ca.crt that differs from its
# certificate, is accepted; a secret that names the CA Issuer but has no ca.crt, and one
# whose ca.crt equals its certificate, are refused.
#
# Run locally, from k3s-lab-bootstrap:
#   ANSIBLE_COLLECTIONS_PATH="$PWD/tests/fixtures/fake-collections" \
#   PATH="$PWD/tests/fixtures/fake-kubectl:$PATH" ansible-playbook tests/test-openbao-tls-secret-wait.yml

- name: Test of the wait for the OpenBao TLS secret
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../roles/stack/operator/openbao/defaults/main.yml
  tasks:
    - name: Make a state directory for the fake cluster
      ansible.builtin.tempfile:
        state: directory
        prefix: openbao-tls-wait-
      register: _state
      changed_when: false

    - name: Run the cases
      ansible.builtin.include_tasks: _openbao-tls-secret-wait-case.yml
      loop:
        - name: The self-signed secret from before the move
          expect: refuse
          issuer: openbao-selfsigned
          tls: self-signed
          ca: self-signed
        - name: A secret that the CA Issuer issued
          expect: pass
          issuer: openbao-ca
          tls: leaf
          ca: ca-root
        - name: The CA Issuer is named, and ca.crt is missing
          expect: refuse
          issuer: openbao-ca
          tls: leaf
        - name: The CA Issuer is named, and ca.crt equals the certificate
          expect: refuse
          issuer: openbao-ca
          tls: leaf
          ca: leaf
      loop_control:
        loop_var: case
        index_var: case_index
        label: "{{ case.name }}"
