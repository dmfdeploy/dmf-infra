---
# Tests of the identity verifier's four checks (playbooks/tasks/verify-identity-holders.yml,
# verify-policy-digests.yml, verify-generate-root-grants.yml and verify-revoker-running.yml)
# against the fake bao, the fake kubernetes.core and the identity fixture:
#
#   - the clean fixture passes, also when the approval executor and the revoker are not
#     installed, and when a live policy has one trailing newline more than its file;
#   - an auth mount outside the allowlist fails and the message names the mount and its type:
#     an unknown type, a second mount of a listed type, a second Kubernetes mount, and a
#     listed mount with another type;
#   - an empty sys/auth answer, one without the token/ mount, and an entry without a type
#     fail: the verifier must have read the inventory of enabled methods;
#   - generate-root on a userpass user, an AppRole role, a token role (listed, or by a
#     glob), an identity entity, a group, a group below a group, a group three deep,
#     an entity through a group, or a Kubernetes role other than the executor's fails and
#     names the principal, as does the executor's role holding the revoker's policy;
#   - the revoker's policy on a Kubernetes role other than the revoker's fails;
#   - the executor's and the revoker's names on another Kubernetes mount hold nothing: with the
#     allowlist widened to reach the holder check, the grant fails, and the role does not count
#     as installed;
#   - a catalogue policy on any principal fails, the executor's role included;
#   - ops-admin holding generate-root fails, and the message says that the install never
#     attaches it;
#   - a policy that differs from its file fails and names the policy, and so does a
#     policy that is missing;
#   - a policy other than the executor's that grants a path under sys/generate-root fails and
#     names the policy and the path: an exact path, a prefix, `sys/*`, `*`, a `+` segment, a
#     stanza after one with nested braces, a JSON policy. A path with an escape that decodes to a generate-root path (`\/`, `\u0073`) or
#     with an escape that does not decode, a deny stanza, a quoted path in a comment, a capabilities
#     list with an inline comment and a `]` in a comment fail too: the scan reads every quoted
#     string and ignores capabilities. A policy for other sys paths, a comment that names
#     generate-root without quotes, and a path with regex characters pass;
#   - a revoker Deployment that is missing, at zero replicas or without a ready replica fails.
#
#   - a userpass user and an ACL policy whose name holds `'`, `;`, `$(...)` and a space are read
#     under that exact name and judged like any other (the user holds generate-root, the policy
#     names its path), and the shell does not run the name: the marker file that it would
#     create does not exist. A clean principal and policy with such names pass.
#
# Run locally, from k3s-lab-bootstrap:
#   PATH="$PWD/tests/fixtures/fake-kubectl:$PATH" \
#   ANSIBLE_COLLECTIONS_PATH="$PWD/tests/fixtures/fake-collections:$HOME/.ansible/collections" \
#   ansible-playbook tests/test-openbao-identity-verifier.yml
#
# CI runs the cases in slices. Add `-e case_shards=2 -e case_shard=1` (then `case_shard=2`) to
# run the cases at every second position, starting at the first (then the second). With neither
# variable, every case runs.

- name: Identity verifier
  hosts: localhost
  gather_facts: false
  connection: local
  vars_files:
    - ../roles/stack/operator/openbao/defaults/main.yml
    - ../playbooks/vars/identity-verifier.yml
  vars:
    verify_openbao_namespace: openbao
    case_shards: 1
    case_shard: 1
    _verify_openbao_pod: openbao-0
    _verify_token_identity_reader: fake-reader
    # What a fresh install holds once the executor and the revoker are installed and
    # ops-admin no longer carries generate-root.
    _clean_identity:
      auth_methods:
        token/: {type: token}
        kubernetes/: {type: kubernetes}
        userpass/: {type: userpass}
        approle/: {type: approle}
      userpass_users:
        ops-admin: {token_policies: [app-admin-writer, app-runtime-writer]}
        policy-reconciler: {token_policies: [policy-writer, identity-verifier]}
        approle-reconciler: {token_policies: [approle-reconciler-writer]}
      approle_roles:
        external-secrets: {token_policies: [eso-reader]}
      entities:
        E1: {name: alice, policies: [default]}
      groups:
        G1: {name: operators, policies: [app-admin-reader], member_entity_ids: [E1]}
    _clean_k8s_roles:
      approval-executor: [generate-root]
      token-revoker: [token-revoker]
      setup-issuer: [setup-issuer]
      approle-rotation-scheduler: [approle-rotation-scheduler]
      external-secrets: [eso-reader]
  tasks:
    # The real allowlist, resolved now: a case that replaces it must not template against itself.
    - name: Keep the real mount allowlist
      ansible.builtin.set_fact:
        _allowed_mounts_real: "{{ verify_identity_allowed_auth_mounts }}"

    - name: Make a state directory for the fake cluster
      ansible.builtin.tempfile:
        state: directory
        prefix: openbao-identity-verifier-
      register: _state
      changed_when: false

    - name: Run each case
      ansible.builtin.include_tasks: _openbao-identity-case.yml
      when: (_case_index % (case_shards | int)) == (case_shard | int) - 1
      loop_control:
        loop_var: _case
        index_var: _case_index
        label: "{{ _case.name }}"
      loop:
        - {name: clean}
        - {name: clean-with-a-final-newline-more, drift: {generate-root: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../roles/stack/operator/openbao/files/policies/generate-root.hcl') }}\n\n\n"}}
        - {name: extra-auth-method, patch: {auth_methods: {ldap/: {type: ldap}}}, expect: ["ldap/", "type ldap"]}
        - {name: empty-auth-answer, replace: {auth_methods: {}}, expect: ["did not list the enabled auth methods"]}
        - {name: auth-answer-without-the-token-mount, replace: {auth_methods: {userpass/: {type: userpass}}}, expect: ["did not list the enabled auth methods"]}
        - {name: auth-entry-without-a-type, replace: {auth_methods: {token/: {type: token}, ldap/: {}}}, expect: ["did not list the enabled auth methods"]}
        - {name: extra-auth-method-oidc-mount, patch: {auth_methods: {oidc/: {type: oidc}}}, expect: ["oidc/", "type oidc"]}
        - {name: second-userpass-mount, patch: {auth_methods: {userpass-two/: {type: userpass}}}, expect: ["userpass-two/", "type userpass"]}
        - {name: second-kubernetes-mount, patch: {auth_methods: {k8s-two/: {type: kubernetes}}}, expect: ["k8s-two/", "type kubernetes"]}
        - {name: listed-mount-with-another-type, patch: {auth_methods: {approle/: {type: userpass}}}, expect: ["approle/", "type userpass"]}
        - name: executor-role-on-a-second-mount-holds-generate-root
          allowed_mounts: {token/: token, userpass/: userpass, kubernetes/: kubernetes, approle/: approle, k8s-two/: kubernetes}
          patch: {auth_methods: {k8s-two/: {type: kubernetes}}}
          k8s_mounts: {k8s-two/: {approval-executor: [generate-root]}}
          expect: ["Kubernetes role k8s-two/approval-executor holds generate-root"]
        - name: revoker-role-on-a-second-mount-holds-its-policy
          allowed_mounts: {token/: token, userpass/: userpass, kubernetes/: kubernetes, approle/: approle, k8s-two/: kubernetes}
          patch: {auth_methods: {k8s-two/: {type: kubernetes}}}
          k8s_mounts: {k8s-two/: {token-revoker: [token-revoker]}}
          expect: ["Kubernetes role k8s-two/token-revoker holds token-revoker"]
        - name: executor-role-only-on-a-second-mount-is-not-installed
          allowed_mounts: {token/: token, userpass/: userpass, kubernetes/: kubernetes, approle/: approle, k8s-two/: kubernetes}
          patch: {auth_methods: {k8s-two/: {type: kubernetes}}}
          k8s: {approval-executor: null, token-revoker: null}
          k8s_mounts: {k8s-two/: {approval-executor: [], token-revoker: []}}
          notes: ["approval executor role approval-executor is not installed", "token revoker role token-revoker is not installed"]
        # Names that hold shell syntax. Each is read as the path it is, found and judged like any
        # other name, and the shell never runs it: the case then looks for the marker file.
        - name: userpass-name-with-shell-syntax-is-read-as-a-name
          patch: {userpass_users: {"x'; cd $(printenv FAKE_STATE); touch MARKER; echo $(touch MARKER) '": {token_policies: [default, generate-root]}}}
          expect: ["userpass user userpass/x'; cd $(printenv FAKE_STATE); touch MARKER; echo $(touch MARKER) ' holds generate-root"]
          marker: MARKER
        - name: policy-name-with-shell-syntax-is-read-as-a-name
          policies: {"x'; cd $(printenv FAKE_STATE); touch MARKER; echo $(touch MARKER) '": "path \"sys/generate-root-token/attempt\" {\n  capabilities = [\"update\"]\n}\n"}
          expect: ["x'; cd $(printenv FAKE_STATE); touch MARKER; echo $(touch MARKER) ' (path \"sys/generate-root-token/attempt\")"]
          marker: MARKER
        - name: names-with-shell-syntax-that-hold-nothing-pass
          patch: {userpass_users: {"x'; cd $(printenv FAKE_STATE); touch MARKER; echo $(touch MARKER) '": {token_policies: [default]}}}
          policies: {"x'; cd $(printenv FAKE_STATE); touch MARKER; echo $(touch MARKER) '": "path \"secret/data/x\" {\n  capabilities = [\"read\"]\n}\n"}
          marker: MARKER
        - {name: userpass-user-generate-root, patch: {userpass_users: {mallory: {token_policies: [default, generate-root]}}}, expect: ["userpass user userpass/mallory holds generate-root"]}
        - {name: approle-role-generate-root, patch: {approle_roles: {rogue: {token_policies: [generate-root]}}}, expect: ["AppRole role approle/rogue holds generate-root"]}
        - {name: token-role-generate-root, patch: {token_roles: {minter: {allowed_policies: [generate-root]}}}, expect: ["token role token/minter holds generate-root"]}
        - {name: token-role-glob, patch: {token_roles: {minter: {allowed_policies_glob: ["generate-*"]}}}, expect: ["token role token/minter holds generate-root"]}
        - {name: entity-generate-root, patch: {entities: {E2: {name: bob, policies: [generate-root]}}}, expect: ["identity entity bob (E2) holds generate-root"]}
        - {name: group-generate-root, patch: {groups: {G2: {name: admins, policies: [generate-root]}}}, expect: ["identity group admins (G2) holds generate-root"]}
        - name: nested-group-generate-root
          patch: {groups: {P: {name: parent, policies: [generate-root], member_group_ids: [C]}, C: {name: child, policies: []}}}
          expect: ["identity group child (C) holds generate-root through a group"]
        - name: group-three-deep-generate-root
          patch: {groups: {A: {name: top, policies: [generate-root], member_group_ids: [B]}, B: {name: middle, policies: [], member_group_ids: [C]}, C: {name: bottom, policies: []}}}
          expect: ["identity group bottom (C) holds generate-root through a group"]
        - name: entity-through-group-generate-root
          patch: {groups: {G2: {name: admins, policies: [generate-root], member_entity_ids: [E1]}}}
          expect: ["identity entity alice (E1) holds generate-root through a group"]
        - {name: other-k8s-role-generate-root, k8s: {intruder: [generate-root]}, expect: ["Kubernetes role kubernetes/intruder holds generate-root"]}
        - {name: executor-role-holds-revoker-policy, k8s: {approval-executor: [generate-root, token-revoker]}, expect: ["Kubernetes role kubernetes/approval-executor holds token-revoker"]}
        - {name: other-k8s-role-revoker-policy, k8s: {intruder: [token-revoker]}, expect: ["Kubernetes role kubernetes/intruder holds token-revoker"]}
        - {name: revoker-role-holds-generate-root, k8s: {token-revoker: [token-revoker, generate-root]}, expect: ["Kubernetes role kubernetes/token-revoker holds generate-root"]}
        - {name: userpass-user-revoker-policy, patch: {userpass_users: {mallory: {token_policies: [token-revoker]}}}, expect: ["userpass user userpass/mallory holds token-revoker"]}
        - {name: userpass-user-catalogue-policy, patch: {userpass_users: {mallory: {token_policies: [catalogue-ops-admin-password-rotation]}}}, expect: ["userpass user userpass/mallory holds catalogue-ops-admin-password-rotation"]}
        - {name: catalogue-policy-not-in-the-catalogue-file, patch: {approle_roles: {rogue: {token_policies: [catalogue-made-up]}}}, expect: ["AppRole role approle/rogue holds the catalogue-* policies"]}
        - {name: executor-role-holds-catalogue-policy, k8s: {approval-executor: [generate-root, catalogue-ops-admin-password-rotation]}, expect: ["Kubernetes role kubernetes/approval-executor holds catalogue-ops-admin-password-rotation"]}
        - {name: group-catalogue-glob, patch: {groups: {G2: {name: admins, policies: ["catalogue-*"]}}}, expect: ["identity group admins (G2) holds the catalogue-* policies"]}
        - {name: ops-admin-generate-root, patch: {userpass_users: {ops-admin: {token_policies: [app-admin-writer, app-runtime-writer, generate-root]}}}, expect: ["userpass user userpass/ops-admin holds generate-root", "ADR-0051", "the install never attaches it"]}
        - {name: policy-drift, drift: {generate-root: "path \"sys/*\" {\n  capabilities = [\"sudo\"]\n}\n"}, expect: ["generate-root differs from files/policies/generate-root.hcl"]}
        - {name: catalogue-policy-drift, drift: {catalogue-ops-admin-password-rotation: "# changed\n"}, expect: ["catalogue-ops-admin-password-rotation differs from files/policies/catalogue/ops-admin-password-rotation.hcl"]}
        - {name: policy-missing, drift: {token-revoker: null}, expect: ["token-revoker is missing from OpenBao"]}
        - {name: revoker-without-a-ready-replica, revoker: {spec: {replicas: 1}, status: {readyReplicas: 0}}, expect: ["token revoker token-revoker in openbao is not running with a ready replica"]}
        - {name: revoker-stopped, revoker: {spec: {replicas: 0}}, expect: ["is not running with a ready replica"]}
        - {name: revoker-missing, revoker: null, expect: ["is not running with a ready replica"]}
        - {name: other-policy-grants-the-attempt-path, policies: {rogue: "path \"sys/generate-root-token/attempt\" {\n  capabilities = [\"update\"]\n}\n"}, expect: ["rogue (path \"sys/generate-root-token/attempt\")", "Only the approval executor's policy may name"]}
        - {name: other-policy-grants-the-update-path-by-prefix, policies: {rogue: "path \"sys/generate-root-token/*\" {\n  capabilities = [\"update\", \"read\"]\n}\n"}, expect: ["rogue (path \"sys/generate-root-token/*\")"]}
        - {name: other-policy-grants-all-of-sys, policies: {rogue: "path \"sys/*\" {\n  capabilities = [\"sudo\"]\n}\n"}, expect: ["rogue (path \"sys/*\")"]}
        - {name: other-policy-grants-a-prefix-of-the-endpoint, policies: {rogue: "path \"sys/generate-root*\" {\n  capabilities = [\"update\"]\n}\n"}, expect: ["rogue (path \"sys/generate-root*\")"]}
        - {name: other-policy-grants-through-a-segment-wildcard, policies: {rogue: "path \"sys/+/attempt\" {\n  capabilities = [\"update\"]\n}\n"}, expect: ["rogue (path \"sys/+/attempt\")"]}
        - {name: other-policy-grants-all-paths, policies: {rogue: "path \"*\" {\n  capabilities = [\"update\"]\n}\n"}, expect: ["rogue (path \"*\")"]}
        - {name: grant-after-a-stanza-with-nested-braces, policies: {rogue: "path \"secret/data/x\" {\n  capabilities = [\"create\"]\n  allowed_parameters = {\n    \"a\" = []\n  }\n}\npath \"sys/generate-root-token/update\" {\n  capabilities = [\"update\"]\n}\n"}, expect: ["rogue (path \"sys/generate-root-token/update\")"]}
        - {name: grant-in-a-json-policy, policies: {rogue: "{\"path\": {\"sys/generate-root-token/attempt\": {\"capabilities\": [\"update\"]}}}"}, expect: ["rogue (path \"sys/generate-root-token/attempt\")"]}
        - {name: a-deny-stanza-fails-too, policies: {guard: "path \"sys/generate-root-token/*\" {\n  capabilities = [\"deny\"]\n}\n"}, expect: ["guard (path \"sys/generate-root-token/*\")"]}
        - {name: a-quoted-path-in-a-comment-fails, policies: {note: "# path \"sys/generate-root-token/attempt\" { capabilities = [\"update\"] }\npath \"secret/data/x\" {\n  capabilities = [\"read\"]\n}\n"}, expect: ["note (path \"sys/generate-root-token/attempt\")"]}
        - {name: inline-comment-with-deny-after-update, policies: {rogue: "path \"sys/generate-root-token/attempt\" { capabilities = [\"update\", # deny\n] }"}, expect: ["rogue (path \"sys/generate-root-token/attempt\")"]}
        - {name: bracket-in-a-block-comment-in-the-capabilities, policies: {rogue: "path \"sys/generate-root/update\" {\n  capabilities = [\"update\", /* ] */ \"read\"]\n}\n"}, expect: ["rogue (path \"sys/generate-root/update\")"]}
        - {name: wildcard-star-under-sys-fails-with-odd-spacing, policies: {rogue: "path   \"sys/*\"{capabilities=[\"update\"]}"}, expect: ["rogue (path \"sys/*\")"]}
        - {name: segment-wildcard-in-a-line-comment, policies: {rogue: "// path \"sys/+/attempt\"\npath \"secret/data/x\" {\n  capabilities = [\"read\"]\n}\n"}, expect: ["rogue (path \"sys/+/attempt\")"]}
        - {name: json-policy-with-update-path, policies: {rogue: "{\"path\": {\"sys/generate-root/update\": {\"capabilities\": [\"update\"]}}}"}, expect: ["rogue (path \"sys/generate-root/update\")"]}
        - {name: json-escaped-slashes-in-a-path, policies: {rogue: "{\"path\": {\"sys\\/generate-root-token\\/attempt\": {\"capabilities\": [\"update\"]}}}"}, expect: ["rogue (path \"sys\\/generate-root-token\\/attempt\")"]}
        - {name: hcl-unicode-escape-in-a-path, policies: {rogue: "path \"\\u0073ys/generate-root-token/attempt\" {\n  capabilities = [\"update\"]\n}\n"}, expect: ["rogue (path \"\\u0073ys/generate-root-token/attempt\")"]}
        - {name: string-with-an-escape-json-does-not-know, policies: {rogue: "path \"sys\\x2fgenerate-root/update\" {\n  capabilities = [\"update\"]\n}\n"}, expect: ["rogue (string \"sys\\x2fgenerate-root/update\" that does not decode)"]}
        - {name: unrelated-paths-and-an-unquoted-comment-pass, policies: {other: "# keeps generate-root out of reach\npath \"secret/data/foo\" {\n  capabilities = [\"read\"]\n}\n"}}
        - {name: regex-metacharacters-in-a-path-do-not-widen-the-match, policies: {other: "path \"sys/(.*)\" {\n  capabilities = [\"read\"]\n}\n"}}
        - {name: a-policy-for-other-sys-paths-passes, policies: {other: "path \"sys/policies/acl/*\" {\n  capabilities = [\"read\", \"list\"]\n}\npath \"sys/capabilities-self\" {\n  capabilities = [\"update\"]\n}\n"}}
