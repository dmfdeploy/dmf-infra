---
# Fixtures of one case of test-openbao-grow-ha.yml: the fake objects that
# k8s_info returns, and the break-glass JSON that load-shares.yml reads.
- name: Set the case directory
  ansible.builtin.set_fact:
    _case_dir: "{{ _state.path }}/{{ case_index }}"
    openbao_key_path: "{{ _state.path }}/{{ case_index }}/breakglass"

- name: Make the fake object directory
  ansible.builtin.file:
    path: "{{ _case_dir }}/k8s"
    state: directory
    mode: "0700"

- name: Write the fake StatefulSet
  ansible.builtin.copy:
    content: >-
      {{ {'spec': {'serviceName': ('openbao' if (case.sts | default('single')) == 'single' else 'openbao-internal'),
                   'replicas': (1 if (case.sts | default('single')) in ['single', 'half'] else 3)}} | to_json }}
    dest: "{{ _case_dir }}/k8s/StatefulSet-openbao.json"
    mode: "0600"

- name: Write the fake TLS secret
  ansible.builtin.copy:
    content: '{"data": {"tls.crt": "ZmFrZQ==", "tls.key": "ZmFrZQ=="}}'
    dest: "{{ _case_dir }}/k8s/Secret-openbao-tls.json"
    mode: "0600"

- name: Write the fake pod 0
  ansible.builtin.copy:
    content: >-
      {{ {'metadata': {'name': 'openbao-0', 'uid': 'uid-openbao-0-0'},
          'status': {'phase': 'Running', 'containerStatuses': [{'state': {'running': {}}}]}} | to_json }}
    dest: "{{ _case_dir }}/k8s/Pod-openbao-0.json"
    mode: "0600"

- name: Write the fake OpenBao Certificate
  ansible.builtin.copy:
    content: '{"status": {"conditions": [{"type": "Ready", "status": "True"}]}}'
    dest: "{{ _case_dir }}/k8s/Certificate-openbao.json"
    mode: "0600"

- name: Write the fake break-glass JSON
  ansible.builtin.copy:
    content: '{"unseal_keys_hex": ["0123456789abcdef0123456789abcdef"], "ops_admin_password": "s3cret-test-password"}'
    dest: "{{ openbao_key_path }}.json"
    mode: "0600"
