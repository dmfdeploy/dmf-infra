---
# Fixtures of one case of test-openbao-grow-ha.yml: the fake objects that
# k8s_info returns, the Kubernetes-auth role that the guard's login probe uses, and the
# break-glass JSON that load-shares.yml reads.
- name: Set the case directory
  ansible.builtin.set_fact:
    _case_dir: "{{ _state.path }}/{{ case_index }}"
    openbao_key_path: "{{ _state.path }}/{{ case_index }}/breakglass"

- name: Make the fake object directory
  ansible.builtin.file:
    path: "{{ _case_dir }}/k8s"
    state: directory
    mode: "0700"

- name: Write the fake StatefulSet
  ansible.builtin.copy:
    content: >-
      {{ {'spec': {'serviceName': ('openbao' if (case.sts | default('single')) == 'single' else 'openbao-internal'),
                   'replicas': (1 if (case.sts | default('single')) in ['single', 'half'] else 3),
                   'template': {'spec': ({'serviceAccountName': openbao_service_account} | combine({'containers': [{'name': 'openbao', 'image': case.sts_image}]} if case.sts_image is defined else {}))}}} | to_json }}
    dest: "{{ _case_dir }}/k8s/StatefulSet-openbao.json"
    mode: "0600"

# The secret that the install had before the move to the CA: self-signed, so its
# ca.crt is its own certificate.
- name: Write the fake TLS secret
  ansible.builtin.copy:
    content: >-
      {"metadata": {"annotations": {"cert-manager.io/issuer-name": "openbao-selfsigned", "cert-manager.io/issuer-kind": "Issuer"}},
       "data": {"tls.crt": "ZmFrZQ==", "tls.key": "ZmFrZQ==", "ca.crt": "ZmFrZQ=="}}
    dest: "{{ _case_dir }}/k8s/Secret-openbao-tls.json"
    mode: "0600"

- name: Write the fake pod 0
  ansible.builtin.copy:
    content: >-
      {{ {'metadata': {'name': 'openbao-0', 'uid': 'uid-openbao-0-0'},
          'status': {'phase': 'Running', 'containerStatuses': [{'state': {'running': {}}}]}} | to_json }}
    dest: "{{ _case_dir }}/k8s/Pod-openbao-0.json"
    mode: "0600"

- name: Write the fake OpenBao Certificate
  ansible.builtin.copy:
    content: '{"metadata": {"generation": 1}, "status": {"conditions": [{"type": "Ready", "status": "True", "observedGeneration": 1}]}}'
    dest: "{{ _case_dir }}/k8s/Certificate-openbao.json"
    mode: "0600"

- name: Write the fake break-glass JSON
  ansible.builtin.copy:
    content: >-
      {"unseal_keys_hex": ["0123456789abcdef0123456789abcdef"], "ops_admin_password": "s3cret-test-password",
       "policy_reconciler_password": "s3cret-test-password"}
    dest: "{{ openbao_key_path }}.json"
    mode: "0600"

# The image check reads the executor's role as policy-reconciler. The role holds the
# generate-root policy unless the case says otherwise, and the stored record of the
# reconciler's login token holds the identity-verifier policy.
- name: Make the fake token directory and the Kubernetes-auth role directory
  ansible.builtin.file:
    path: "{{ _case_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [tokens, k8s-auth]

- name: Write the token revoker's Kubernetes-auth role into the fake mount
  ansible.builtin.copy:
    content: >-
      {{ {'bound_service_account_names': [openbao_revoker_service_account],
          'bound_service_account_namespaces': [openbao_namespace],
          'token_policies': [openbao_revoker_policy_name], 'token_ttl': 120} | to_json }}
    dest: "{{ _case_dir }}/k8s-auth/role-{{ openbao_revoker_k8s_role }}.json"
    mode: "0600"

- name: Write the executor role of the fake OpenBao
  ansible.builtin.copy:
    content: "{{ {'token_policies': case.executor_policies | default(['generate-root'])} | to_json }}"
    dest: "{{ _case_dir }}/k8s-auth/role-{{ openbao_executor_k8s_role }}.json"
    mode: "0600"

- name: Write the stored record of the policy-reconciler login token
  ansible.builtin.copy:
    content: '{"policies": ["default", "identity-verifier"], "orphan": true, "created": 1800000000, "ttl": 0, "uses_left": null}'
    dest: "{{ _case_dir }}/tokens/fake-reconciler-token.json"
    mode: "0600"
