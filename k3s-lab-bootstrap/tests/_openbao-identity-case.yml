---
# One case of the identity verifier's checks. The caller sets _case:
#   name      the case's name; it names the state directory of the fake
#   patch     identity fixture entries to add to or replace in the clean fixture
#   replace   top-level fixture keys to replace as a whole (patch merges into them)
#   k8s       Kubernetes roles (name: list of policies) to add to or replace in the clean set
#   k8s_mounts  roles on a further Kubernetes mount: mount (with its trailing slash): {name: policies}
#   allowed_mounts  the mount allowlist to use in place of the real one, to reach checks that
#             come after the allowlist check
#   notes     text that the installed-roles note must hold, all of it
#   drift     policy name: the live text, in place of the file's text. null: the policy is missing
#   policies  extra live policies, name: text, that the role does not write
#   revoker   the revoker Deployment object (default: one ready replica). null: none exists
#   expect    text that the failure message must hold, all of it. Empty: the case must pass.
#   marker    a file name that must not exist in the state directory or the working directory after the checks, whether
#             they pass or fail: a name that holds shell syntax must not have run
- name: "Identity verifier — {{ _case.name }}"
  environment:
    FAKE_STATE: "{{ _state.path }}/{{ _case.name }}"
    FAKE_POLICY_WRITER: "1"
    FAKE_BAO_PATH_ON_STDIN: "1"
  # Each task in the block gets this limit, so a task that stops responding fails the case.
  timeout: "{{ case_task_timeout }}"
  block:
    - name: "Identity verifier — {{ _case.name }}: make the state directory"
      ansible.builtin.file:
        path: "{{ _state.path }}/{{ _case.name }}/{{ item }}"
        state: directory
        mode: "0700"
      loop: [tokens, k8s-auth, policies, k8s]

    - name: "Identity verifier — {{ _case.name }}: seed the reader's token"
      ansible.builtin.copy:
        dest: "{{ _state.path }}/{{ _case.name }}/tokens/fake-reader.json"
        content: '{"policies": ["identity-verifier", "policy-writer"], "orphan": true, "created": 1800000000, "ttl": 0, "uses_left": null}'
        mode: "0600"

    - name: "Identity verifier — {{ _case.name }}: write the identity fixture"
      ansible.builtin.copy:
        dest: "{{ _state.path }}/{{ _case.name }}/identity.json"
        content: "{{ _clean_identity | combine(_case.patch | default({}), recursive=true) | combine(_case.replace | default({})) | to_json }}"
        mode: "0600"

    - name: "Identity verifier — {{ _case.name }}: write the Kubernetes roles"
      ansible.builtin.copy:
        dest: "{{ _state.path }}/{{ _case.name }}/k8s-auth/role-{{ item.key }}.json"
        content: "{{ {'token_policies': item.value} | to_json }}"
        mode: "0600"
      loop: "{{ _clean_k8s_roles | combine(_case.k8s | default({})) | dict2items | rejectattr('value', 'none') | list }}"
      loop_control:
        label: "{{ item.key }}"

    - name: "Identity verifier — {{ _case.name }}: make the directories of further Kubernetes mounts"
      ansible.builtin.file:
        path: "{{ _state.path }}/{{ _case.name }}/k8s-auth-{{ item | regex_replace('/$', '') }}"
        state: directory
        mode: "0700"
      loop: "{{ (_case.k8s_mounts | default({})).keys() | list }}"

    - name: "Identity verifier — {{ _case.name }}: write the roles of further Kubernetes mounts"
      ansible.builtin.copy:
        dest: "{{ _state.path }}/{{ _case.name }}/k8s-auth-{{ item.mount | regex_replace('/$', '') }}/role-{{ item.name }}.json"
        content: "{{ {'token_policies': item.policies} | to_json }}"
        mode: "0600"
      loop: >-
        {{ _mount_roles }}
      loop_control:
        label: "{{ item.mount }}{{ item.name }}"
      vars:
        _mount_roles: >-
          {%- set ns = namespace(found=[]) -%}
          {%- for mount, roles in (_case.k8s_mounts | default({})).items() -%}
          {%- for name, policies in roles.items() -%}
          {%- set ns.found = ns.found + [{'mount': mount, 'name': name, 'policies': policies}] -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ ns.found }}

    - name: "Identity verifier — {{ _case.name }}: write the live policies"
      ansible.builtin.copy:
        dest: "{{ _state.path }}/{{ _case.name }}/policies/{{ item.name }}"
        content: "{{ (_case.drift | default({}))[item.name] | default(lookup('ansible.builtin.file', verify_role_path ~ '/' ~ item.file) ~ '\n', true) }}"
        mode: "0600"
      loop: "{{ verify_policy_files }}"
      loop_control:
        label: "{{ item.name }}"
      when: (_case.drift | default({}))[item.name] is not defined or (_case.drift | default({}))[item.name] is not none

    - name: "Identity verifier — {{ _case.name }}: write the extra live policies"
      ansible.builtin.copy:
        dest: "{{ _state.path }}/{{ _case.name }}/policies/{{ item.key }}"
        content: "{{ item.value }}"
        mode: "0600"
      loop: "{{ (_case.policies | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: "Identity verifier — {{ _case.name }}: write the revoker Deployment"
      ansible.builtin.copy:
        dest: "{{ _state.path }}/{{ _case.name }}/k8s/Deployment-token-revoker.json"
        content: "{{ _case.revoker | default({'spec': {'replicas': 1}, 'status': {'readyReplicas': 1}}) | to_json }}"
        mode: "0600"
      when: _case.revoker is not defined or _case.revoker is not none

    - name: "Identity verifier — {{ _case.name }}: run the checks"
      ansible.builtin.include_tasks: "{{ item }}"
      vars:
        verify_identity_allowed_auth_mounts: "{{ _case.allowed_mounts | default(_allowed_mounts_real) }}"
      loop:
        - ../playbooks/tasks/verify-identity-holders.yml
        - ../playbooks/tasks/verify-policy-digests.yml
        - ../playbooks/tasks/verify-generate-root-grants.yml
        - ../playbooks/tasks/verify-revoker-running.yml

    - name: "Identity verifier — {{ _case.name }}: assert the installed-roles note"
      ansible.builtin.assert:
        that: item in (_verify_identity_notes | join(' | '))
        fail_msg: "The note did not hold {{ item }}: {{ _verify_identity_notes | default('') }}"
      loop: "{{ _case.notes | default([]) }}"

    - name: "Identity verifier — {{ _case.name }}: fail when the checks passed a case that must fail"
      ansible.builtin.fail:
        msg: The verifier passed a case that must fail.
      when: _case.expect | default([]) | length > 0
  rescue:
    - name: "Identity verifier — {{ _case.name }}: fail when a task of the case timed out"
      ansible.builtin.fail:
        msg: "identity case {{ _case.name }} did not finish within {{ case_task_timeout }} s: {{ ansible_failed_result.msg | default('') }}"
      when: ansible_failed_result.timedout is defined

    - name: "Identity verifier — {{ _case.name }}: fail when a case that must pass failed"
      ansible.builtin.fail:
        msg: "The verifier failed a case that must pass: {{ ansible_failed_result.msg | default('') }}"
      when: _case.expect | default([]) | length == 0

    - name: "Identity verifier — {{ _case.name }}: assert the failure names what it found"
      ansible.builtin.assert:
        that:
          - "'passed a case' not in ansible_failed_result.msg"
          - item in ansible_failed_result.msg
        fail_msg: "The failure did not name {{ item }}: {{ ansible_failed_result.msg | default('') }}"
      loop: "{{ _case.expect | default([]) }}"
  always:
    # The controller's shell would run a name from the state directory of the case or from its
    # own working directory, so the check looks in both.
    - name: "Identity verifier — {{ _case.name }}: look for the marker file"
      ansible.builtin.stat:
        path: "{{ item }}/{{ _case.marker }}"
      register: _marker
      loop:
        - "{{ _state.path }}/{{ _case.name }}"
        - "{{ playbook_dir }}"
      when: _case.marker is defined

    - name: "Identity verifier — {{ _case.name }}: assert that no name ran as shell"
      ansible.builtin.assert:
        that: _marker.results | rejectattr('stat.exists', 'equalto', false) | list | length == 0
        fail_msg: "A name from OpenBao ran as shell: {{ _case.marker }} exists."
      when: _case.marker is defined
