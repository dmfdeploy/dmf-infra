---
# Test of the shared OpenBao command task (roles/common/openbao-cli) against the fake
# kubectl and the stub bao in tests/fixtures/capture-bao. The stub records the arguments,
# the standard input and the token that the program passed to `bao`.
#
# The play checks that:
#   - a token, words and a body that hold `$` and `'` arrive byte for byte, in order;
#   - no value is part of the arguments of kubectl;
#   - a call without a token gives `bao` no token;
#   - a non-zero exit code fails the caller with a message that names the operation and
#     holds no secret, unless the caller allows it or tolerates the stderr text;
#   - an empty required output fails the caller;
#   - a token or a word that holds a line break is refused before kubectl runs, with a
#     message that names the operation and the reason;
#   - a list of calls stops at the first call that fails, and the calls after it do not run;
#   - with `openbao_cli_allow_failure`, every call runs and the caller reads each exit code;
#   - a tolerated stderr text is not a failure, and the call is not `changed`;
#   - a retry that runs out fails the caller even with `openbao_cli_allow_failure`, unless the
#     caller sets `openbao_cli_allow_exhausted_retries` to judge the last attempt itself;
#   - `changed` is true for a successful call that changes OpenBao, and false for a failed one.
#
# The play runs on ansible-core 2.15 (the AWX image) and on the current version. On 2.15 a
# template result that looks like a JSON object or list becomes a mapping or list, and a
# result of a per-field template loses its type, so the play checks the body text, `rc` as a
# number and a JSON-looking `stdout` as text.
#
# Run locally, from k3s-lab-bootstrap:
#   PATH="$PWD/tests/fixtures/fake-kubectl:$PATH" ansible-playbook tests/test-openbao-cli.yml
- name: Test - the shared OpenBao command task
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    literal_token: "tok$HOME'1"
    literal_word: "key=$HOME/it's"
    literal_body: "{\"password\": \"pa$HOME'ss\"}\n"
    step_env:
      FAKE_STATE: "{{ _state.path | default('') }}"
      FAKE_EXEC_STUB_DIR: "{{ playbook_dir }}/fixtures/step-bao"
    env_stub:
      FAKE_STATE: "{{ _state.path | default('') }}"
      FAKE_EXEC_STUB_DIR: "{{ playbook_dir }}/fixtures/capture-bao"
      STUB_CAPTURE: "{{ _state.path | default('') }}/capture"

  tasks:
    - name: Make a state directory for the fake cluster
      ansible.builtin.tempfile:
        state: directory
        prefix: openbao-cli-
      register: _state
      changed_when: false

    - name: Make the capture directory
      ansible.builtin.file:
        path: "{{ _state.path }}/capture"
        state: directory
        mode: "0700"
      changed_when: false

    - name: Run one call with a token, two words and a body
      ansible.builtin.include_role:
        name: common/openbao-cli
        apply:
          environment: "{{ env_stub }}"
      vars:
        openbao_cli_operation: write a probe value
        openbao_cli_pod: openbao-0
        openbao_cli_token: "{{ literal_token }}"
        openbao_cli_register: _probe
        openbao_cli_calls:
          - args: [write, "{{ literal_word }}", "-"]
            input: "{{ literal_body | string }}"

    - name: Send a body that arrives as a mapping on ansible-core 2.15, and one that is JSON text
      ansible.builtin.include_role:
        name: common/openbao-cli
        apply:
          environment: "{{ env_stub }}"
      vars:
        openbao_cli_operation: send a mapping and a list as bodies
        openbao_cli_pod: openbao-0
        openbao_cli_register: _mapping
        openbao_cli_calls:
          - args: [write, "secret/map", "-"]
            input: {password: "pa$HOME'ss"}
          - args: [write, "secret/list", "-"]
            input: ["a", "b"]
          - args: [write, "secret/text", "-"]
            input: "{{ literal_body | string }}"

    - name: Run one call without a token
      ansible.builtin.include_role:
        name: common/openbao-cli
        apply:
          environment: "{{ env_stub }}"
      vars:
        openbao_cli_operation: read the status
        openbao_cli_pod: openbao-0
        openbao_cli_register: _no_token
        openbao_cli_calls:
          - args: [status, -format=json]

    - name: Read what the stub saw
      ansible.builtin.slurp:
        src: "{{ _state.path }}/capture/{{ item }}"
      loop: [argv-1, stdin-1, token-1, argv-5, token-5, stdin-2, stdin-3, stdin-4]
      register: _seen
      changed_when: false

    - name: Check that every value arrived unchanged and nothing reached kubectl arguments
      ansible.builtin.assert:
        that:
          - (_seen.results[0].content | b64decode) == 'write\n' ~ literal_word ~ '\n-\n'
          - (_seen.results[1].content | b64decode) == literal_body
          - (_seen.results[2].content | b64decode) == literal_token
          - (_seen.results[4].content | b64decode) == ''
          - "(_seen.results[5].content | b64decode) == ({'password': \"pa$HOME'ss\"} | to_json)"
          - "(_seen.results[6].content | b64decode) == (['a', 'b'] | to_json)"
          - (_seen.results[7].content | b64decode) == literal_body
          - "_probe.rc | type_debug == 'int'"
          - "_probe.stdout is string"
          - "_probe.changed | type_debug == 'bool'"
          - "_no_token.rc | type_debug == 'int'"
          - "_mapping.results | map(attribute='rc') | map('type_debug') | unique | list == ['int']"
          - _probe.rc == 0
          - _probe.stdout == '{}'
          - _probe.results | length == 1
          - lookup('ansible.builtin.file', _state.path ~ '/kubectl-argv.log') is not search('tok|pa\$HOME|it.s')

    - name: Run a failing call and expect the play to stop
      block:
        - name: Fail with exit code 3 through the shared task
          ansible.builtin.include_role:
            name: common/openbao-cli
            apply:
              environment: "{{ env_stub | combine({'FAKE_EXEC_STUB_DIR': playbook_dir ~ '/fixtures/fake-bao'}) }}"
          vars:
            openbao_cli_operation: fail on purpose
            openbao_cli_pod: openbao-0
            openbao_cli_token: "{{ literal_token }}"
            openbao_cli_register: _failing
            openbao_cli_calls:
              - args: [no-such-subcommand]
        - name: Fail the test when the shared task did not stop
          ansible.builtin.fail:
            msg: The shared task did not fail on a non-zero exit code.
      rescue:
        - name: Check that the message names the operation and holds no secret
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('fail on purpose')
              - ansible_failed_result.msg is not search('tok')
              - ansible_failed_result.msg is not search('The shared task did not fail')

    - name: Allow the failure and read the exit code
      ansible.builtin.include_role:
        name: common/openbao-cli
        apply:
          environment: "{{ env_stub | combine({'FAKE_EXEC_STUB_DIR': playbook_dir ~ '/fixtures/fake-bao'}) }}"
      vars:
        openbao_cli_operation: allow a failure
        openbao_cli_pod: openbao-0
        openbao_cli_register: _allowed
        openbao_cli_allow_failure: true
        openbao_cli_calls:
          - args: [no-such-subcommand]

    - name: Check that the caller sees the failure
      ansible.builtin.assert:
        that:
          - _allowed.rc != 0

    - name: Retry until the stub answers with output
      ansible.builtin.include_role:
        name: common/openbao-cli
        apply:
          environment: "{{ env_stub }}"
      vars:
        openbao_cli_operation: retry a status read
        openbao_cli_pod: openbao-0
        openbao_cli_register: _retried
        openbao_cli_retries: 2
        openbao_cli_delay: 0
        openbao_cli_until: "{{ openbao_cli_run.stdout is match('(?s)\\s*[{]') }}"
        openbao_cli_calls:
          - args: [status]

    - name: Check that the retry condition ran
      ansible.builtin.assert:
        that:
          - _retried.stdout == '{}'
          - "_retried.stdout is string"

    - name: Refuse an empty output when output is required
      block:
        - name: Run a call that prints nothing
          ansible.builtin.include_role:
            name: common/openbao-cli
            apply:
              environment: "{{ env_stub | combine({'FAKE_EXEC_STUB_DIR': playbook_dir ~ '/fixtures/empty-bao'}) }}"
          vars:
            openbao_cli_operation: need output
            openbao_cli_pod: openbao-0
            openbao_cli_register: _empty
            openbao_cli_require_output: true
            openbao_cli_calls:
              - args: [status]
        - name: Fail the test when the shared task did not stop
          ansible.builtin.fail:
            msg: The shared task accepted an empty output.
      rescue:
        - name: Check the reason
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('need output')
              - ansible_failed_result.msg is search('empty output')

    - name: Refuse a word with a line break before kubectl runs
      block:
        - name: Run a call with a bad word
          ansible.builtin.include_role:
            name: common/openbao-cli
          vars:
            openbao_cli_operation: bad word
            openbao_cli_pod: openbao-0
            openbao_cli_register: _bad
            openbao_cli_calls:
              - args: ["a\nb"]
        - name: Fail the test when the shared task did not stop
          ansible.builtin.fail:
            msg: The shared task accepted a word with a line break.
      rescue:
        - name: Check that the input check stopped it
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('bad word')
              - ansible_failed_result.msg is search('line break')

    # The stub in tests/fixtures/step-bao records each call in $STUB_CAPTURE/calls.
    - name: Make one capture directory for each scenario
      ansible.builtin.file:
        path: "{{ _state.path }}/{{ item }}"
        state: directory
        mode: "0700"
      loop: [stop, all, absent, ranout, changed, failedchanged]
      changed_when: false

    - name: Stop at the first failing call
      block:
        - name: Run three calls where the second fails
          ansible.builtin.include_role:
            name: common/openbao-cli
            apply:
              environment: "{{ step_env | combine({'STUB_CAPTURE': _state.path ~ '/stop'}) }}"
          vars:
            openbao_cli_operation: write three values
            openbao_cli_pod: openbao-0
            openbao_cli_register: _stop
            openbao_cli_changed: true
            openbao_cli_calls:
              - {args: [write, one]}
              - {args: [write, fail]}
              - {args: [write, three]}
        - name: Fail the test when the list did not stop
          ansible.builtin.fail:
            msg: The shared task did not stop at the failing call.
      rescue:
        - name: Read the calls that ran
          ansible.builtin.slurp:
            src: "{{ _state.path }}/stop/calls"
          register: _stop_calls
        - name: Check that the third call did not run
          ansible.builtin.assert:
            that:
              - (_stop_calls.content | b64decode) == 'write one\nwrite fail\n'
              - ansible_failed_result.msg is search('write three values')
              - ansible_failed_result.msg is search('exit code 1')
              - ansible_failed_result.msg is not search('boom')

    - name: Run every call when the caller reads the exit codes
      ansible.builtin.include_role:
        name: common/openbao-cli
        apply:
          environment: "{{ step_env | combine({'STUB_CAPTURE': _state.path ~ '/all'}) }}"
      vars:
        openbao_cli_operation: read three values
        openbao_cli_pod: openbao-0
        openbao_cli_register: _all
        openbao_cli_allow_failure: true
        openbao_cli_calls:
          - {args: [read, one], item: a}
          - {args: [read, fail], item: b}
          - {args: [read, three], item: c}

    - name: Check that all three ran and the results keep their order and items
      ansible.builtin.assert:
        that:
          - _all.results | map(attribute='item') | list == ['a', 'b', 'c']
          - _all.results | map(attribute='rc') | list == [0, 1, 0]
          - _all.results[1].stderr == 'boom'
          - _all.results | map(attribute='changed') | list == [false, false, false]

    - name: Tolerate a stderr text
      ansible.builtin.include_role:
        name: common/openbao-cli
        apply:
          environment: "{{ step_env | combine({'STUB_CAPTURE': _state.path ~ '/absent'}) }}"
      vars:
        openbao_cli_operation: read an absent path
        openbao_cli_pod: openbao-0
        openbao_cli_register: _absent
        openbao_cli_changed: true
        openbao_cli_tolerate_stderr: ["No value found"]
        openbao_cli_calls:
          - {args: [read, absent]}

    - name: Check that the tolerated call is not a failure and not a change
      ansible.builtin.assert:
        that:
          - _absent.rc == 2
          - not _absent.changed

    - name: Fail when the retries run out, even if the caller allows a failure
      block:
        - name: Wait for a condition that never holds
          ansible.builtin.include_role:
            name: common/openbao-cli
            apply:
              environment: "{{ step_env | combine({'STUB_CAPTURE': _state.path ~ '/ranout'}) }}"
          vars:
            openbao_cli_operation: wait for a leader
            openbao_cli_pod: openbao-0
            openbao_cli_register: _ranout
            openbao_cli_allow_failure: true
            openbao_cli_retries: 2
            openbao_cli_delay: 0
            openbao_cli_until: "{{ openbao_cli_run.stdout is search('leader') }}"
            openbao_cli_calls:
              - {args: [status]}
        - name: Fail the test when the retries did not fail the caller
          ansible.builtin.fail:
            msg: The shared task did not fail when the retries ran out.
      rescue:
        - name: Check that the failure names the operation and the reason
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('wait for a leader')
              - ansible_failed_result.msg is search('the retries ran out')
              - ansible_failed_result.msg is not search('The shared task did not fail')

    - name: Let the caller judge the last attempt when it asks to
      ansible.builtin.include_role:
        name: common/openbao-cli
        apply:
          environment: "{{ step_env | combine({'STUB_CAPTURE': _state.path ~ '/ranout'}) }}"
      vars:
        openbao_cli_operation: revoke with a caller that judges
        openbao_cli_pod: openbao-0
        openbao_cli_register: _judged
        openbao_cli_allow_failure: true
        openbao_cli_allow_exhausted_retries: true
        openbao_cli_retries: 1
        openbao_cli_delay: 0
        openbao_cli_until: "{{ openbao_cli_run.rc == 0 }}"
        openbao_cli_calls:
          - {args: [write, fail]}

    - name: Check that the caller sees the last attempt
      ansible.builtin.assert:
        that:
          - _judged.rc == 1

    - name: Report a change only for a call that succeeded
      ansible.builtin.include_role:
        name: common/openbao-cli
        apply:
          environment: "{{ step_env | combine({'STUB_CAPTURE': _state.path ~ '/changed'}) }}"
      vars:
        openbao_cli_operation: write one value
        openbao_cli_pod: openbao-0
        openbao_cli_register: _changed_ok
        openbao_cli_changed: true
        openbao_cli_calls:
          - {args: [write, one]}

    - name: Report no change for a call that failed
      ansible.builtin.include_role:
        name: common/openbao-cli
        apply:
          environment: "{{ step_env | combine({'STUB_CAPTURE': _state.path ~ '/failedchanged'}) }}"
      vars:
        openbao_cli_operation: write one value that fails
        openbao_cli_pod: openbao-0
        openbao_cli_register: _changed_failed
        openbao_cli_changed: true
        openbao_cli_allow_failure: true
        openbao_cli_calls:
          - {args: [write, fail]}

    - name: Check the changed flags
      ansible.builtin.assert:
        that:
          - _changed_ok.changed
          - not _changed_failed.changed
          - _changed_failed.rc == 1

    - name: Name the operation and the reason when the input is not valid
      block:
        - name: Run a call that reads stdin without an input
          ansible.builtin.include_role:
            name: common/openbao-cli
          vars:
            openbao_cli_operation: write without a body
            openbao_cli_pod: openbao-0
            openbao_cli_register: _noinput
            openbao_cli_token: "{{ literal_token }}"
            openbao_cli_calls:
              - args: [write, "secret/x", "-"]
        - name: Fail the test when the input was accepted
          ansible.builtin.fail:
            msg: The shared task accepted a call without an input.
      rescue:
        - name: Check the message
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('write without a body')
              - ansible_failed_result.msg is search('reads stdin but has no input')
              - ansible_failed_result.msg is not search('tok')
